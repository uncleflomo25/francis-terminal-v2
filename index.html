<script>

// ===== FORMAT =====
function fmt(v){
 if(v>1e9) return (v/1e9).toFixed(2)+"B";
 if(v>1e6) return (v/1e6).toFixed(2)+"M";
 return v.toFixed(2);
}

// ===== DIRECTION =====
function getDir(curr, prev){
 if(prev === 0) return ["➜","yellow"];

 let change = (curr - prev) / prev;

 if(change > 0.001) return ["▲","green"];
 if(change < -0.001) return ["▼","red"];
 return ["➜","yellow"];
}

// ===== STATE =====
let spotBuy=0, spotSell=0, perpBuy=0, perpSell=0;
let lastBTC=0, lastETHBTC=0, lastUSDT=0;

// ===== BTC SPOT =====
let spotWS = new WebSocket("wss://stream.binance.com:9443/ws/btcusdt@trade");
spotWS.onmessage = (e)=>{
 let t = JSON.parse(e.data);
 let vol = parseFloat(t.q);

 if(t.m){ spotSell += vol } else { spotBuy += vol }
 update();
}

// ===== BTC PERP =====
let perpWS = new WebSocket("wss://fstream.binance.com/ws/btcusdt@trade");
perpWS.onmessage = (e)=>{
 let t = JSON.parse(e.data);
 let vol = parseFloat(t.q);

 if(t.m){ perpSell += vol } else { perpBuy += vol }
 update();
}

// ===== ETHBTC PRICE =====
let ethbtcPrice = 0;

let ethWS = new WebSocket("wss://stream.binance.com:9443/ws/ethbtc@trade");
ethWS.onmessage = (e)=>{
 let t = JSON.parse(e.data);
 ethbtcPrice = parseFloat(t.p);
 update();
}

// ===== OPEN INTEREST =====
async function getOI(){
 let res = await fetch("https://fapi.binance.com/fapi/v1/openInterest?symbol=BTCUSDT");
 let d = await res.json();
 document.getElementById("oi").innerText = fmt(parseFloat(d.openInterest));
}
setInterval(getOI,5000);

// ===== DOMINANCE =====
let btcDom=0, usdtDom=0, totalCap=0;

async function getMacro(){
 let res = await fetch("https://api.coingecko.com/api/v3/global");
 let d = await res.json();

 btcDom = d.data.market_cap_percentage.btc;
 usdtDom = d.data.market_cap_percentage.usdt || 0;
 totalCap = d.data.total_market_cap.usd;

 update();
}
setInterval(getMacro,10000);
getMacro();

// ===== ENGINE =====
function update(){

 // ===== DIRECTION =====
 let [btcArrow, btcColor] = getDir(btcDom, lastBTC);
 let [ethArrow, ethColor] = getDir(ethbtcPrice, lastETHBTC);
 let [usdtArrow, usdtColor] = getDir(usdtDom, lastUSDT);

 lastBTC = btcDom;
 lastETHBTC = ethbtcPrice;
 lastUSDT = usdtDom;

 // ===== DISPLAY =====
 document.getElementById("btcd").innerHTML = btcDom.toFixed(2)+"% <span class='"+btcColor+"'>"+btcArrow+"</span>";
 document.getElementById("usdt").innerHTML = usdtDom.toFixed(2)+"% <span class='"+usdtColor+"'>"+usdtArrow+"</span>";
 document.getElementById("total").innerHTML = fmt(totalCap);

 // ETHBTC ADD (you must add this div in HTML)
 if(document.getElementById("ethbtc")){
  document.getElementById("ethbtc").innerHTML =
    ethbtcPrice.toFixed(5)+" <span class='"+ethColor+"'>"+ethArrow+"</span>";
 }

 // ===== VOLUME =====
 document.getElementById("spotBuy").innerText = fmt(spotBuy);
 document.getElementById("spotSell").innerText = fmt(spotSell);
 document.getElementById("perpBuy").innerText = fmt(perpBuy);
 document.getElementById("perpSell").innerText = fmt(perpSell);

 // ===== DELTA =====
 let delta = (spotBuy+perpBuy) - (spotSell+perpSell);
 document.getElementById("delta").innerText = fmt(delta);

 // ===== MARKET STATE =====
 let state = "NEUTRAL ➜";
 let color = "yellow";

 if(delta > 0 && usdtDom < lastUSDT){
  state = "RISK-ON ▲";
  color = "green";
 }
 else if(delta < 0 && usdtDom > lastUSDT){
  state = "RISK-OFF ▼";
  color = "red";
 }

 let el = document.getElementById("state");
 el.innerText = state;
 el.className = "big " + color;
}

</script>
