<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>⚡ V100 INSTITUTIONAL FLOW ENGINE</title>

<style>
body{background:#02050c;color:#fff;font-family:Arial;margin:0;}
.header{padding:12px;text-align:center;background:#060d1f;border-bottom:1px solid #1a2a4a;font-size:18px;}

.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;padding:10px;}
.card{background:#0a1326;border:1px solid #1c2b4a;border-radius:8px;padding:10px;}

.up{color:#00ff9c;}
.down{color:#ff4d4d;}
.side{color:#ffcc00;}

.signal{font-size:20px;font-weight:bold;}
</style>
</head>

<body>

<div class="header">⚡ V100 — INSTITUTIONAL FLOW ENGINE</div>

<div class="grid">
<div class="card">BTC.D<br><span id="btc"></span></div>
<div class="card">USDT.D<br><span id="usdt"></span></div>
<div class="card">ETHBTC<br><span id="ethbtc"></span></div>
<div class="card">TOTAL<br><span id="total"></span></div>
<div class="card">Regime<br><span id="regime"></span></div>
</div>

<div class="grid">
<div class="card">Spot Volume<br><span id="spot"></span></div>
<div class="card">Perp Volume<br><span id="perp"></span></div>
<div class="card">Open Interest<br><span id="oi"></span></div>
<div class="card">Delta<br><span id="delta"></span></div>
<div class="card signal">Signal<br><span id="signal"></span></div>
</div>

<script>

let prev = {btc:null, usdt:null, ethbtc:null, total:null, oi:null}

/* FORMAT */
function fmt(n){
    if(n > 1e9) return (n/1e9).toFixed(2)+"B";
    if(n > 1e6) return (n/1e6).toFixed(2)+"M";
    return n.toFixed(2);
}

/* DIRECTION */
function dir(c,p){
    if(p===null) return {a:"↔️",c:"side"};
    if(c>p) return {a:"⬆️",c:"up"};
    if(c<p) return {a:"⬇️",c:"down"};
    return {a:"↔️",c:"side"};
}

/* FETCH ENGINE */
async function update(){

// GLOBAL DATA
let g = await fetch("https://api.coingecko.com/api/v3/global").then(r=>r.json());

let total = g.data.total_market_cap.usd;
let btc_d = g.data.market_cap_percentage.btc;
let eth_d = g.data.market_cap_percentage.eth;
let usdt_d = 100 - btc_d - eth_d;
let ethbtc = eth_d / btc_d;

// BINANCE DATA
let vol = await fetch("https://api.binance.com/api/v3/ticker/24hr?symbol=BTCUSDT").then(r=>r.json());
let oi = await fetch("https://fapi.binance.com/fapi/v1/openInterest?symbol=BTCUSDT").then(r=>r.json());

// APPROX FLOW
let spotVol = parseFloat(vol.quoteVolume);
let perpVol = spotVol * 1.4; // proxy
let openInterest = parseFloat(oi.openInterest);

// DELTA (proxy)
let delta = spotVol - perpVol * 0.7;

/* DIRECTIONS */
let d1=dir(btc_d,prev.btc);
let d2=dir(usdt_d,prev.usdt);
let d3=dir(ethbtc,prev.ethbtc);
let d4=dir(total,prev.total);
let d5=dir(openInterest,prev.oi);

/* UI */
btc.innerHTML=`<span class="${d1.c}">${btc_d.toFixed(2)}% ${d1.a}</span>`;
usdt.innerHTML=`<span class="${d2.c}">${usdt_d.toFixed(2)}% ${d2.a}</span>`;
ethbtc.innerHTML=`<span class="${d3.c}">${ethbtc.toFixed(4)} ${d3.a}</span>`;
total.innerHTML=`<span class="${d4.c}">${fmt(total)} ${d4.a}</span>`;

/* REGIME DETECTION */
let regime="RANGE";

if(d4.c==="up" && d5.c==="up") regime="TREND";
if(d4.c==="down" && d2.c==="up") regime="RISK-OFF";
if(d3.c==="up" && d2.c==="down") regime="ALT TREND";

regimeEl = document.getElementById("regime");
regimeEl.innerHTML = regime;

/* FLOW */
spot.innerText=fmt(spotVol);
perp.innerText=fmt(perpVol);
oi.innerHTML=`<span class="${d5.c}">${fmt(openInterest)} ${d5.a}</span>`;
delta.innerHTML = delta>0 ? `<span class="up">${fmt(delta)}</span>` : `<span class="down">${fmt(delta)}</span>`;

/* ADAPTIVE SCORE */
let score = 0;

// dominance
if(d2.c==="down") score+=2;
if(d1.c==="up") score+=1;

// flow
if(delta>0) score+=2;
if(d5.c==="up") score+=2;

// structure
if(d4.c==="up") score+=2;
if(d4.c==="down") score-=2;

/* SIGNAL */
let signalText="WAIT";
let color="side";

if(score>=5){ signalText="BUY"; color="up"; }
else if(score<=-2){ signalText="SELL"; color="down"; }

document.getElementById("signal").innerHTML =
`<span class="${color}">${signalText} (${score})</span>`;

/* SAVE */
prev={btc:btc_d,usdt:usdt_d,ethbtc:ethbtc,total:total,oi:openInterest};

}

/* RUN */
update();
setInterval(update,8000);

</script>

</body>
</html>
