<!DOCTYPE html>
<html>
<head>
  <title>Composite Footprint Terminal (Live)</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body style="background:#0b0f14; color:white; font-family:sans-serif;">

<h2>🔥 Real-Time Composite Footprint</h2>
<canvas id="chart" width="1000" height="400"></canvas>

<script>
const ctx = document.getElementById('chart').getContext('2d');

let data = [];
let colors = [];
let labels = [];

// Chart
const chart = new Chart(ctx, {
  type: 'bar',
  data: {
    labels: labels,
    datasets: [{
      label: 'Composite Delta',
      data: data,
      backgroundColor: colors
    }]
  },
  options: {
    animation: false,
    scales: {
      x: { display: false },
      y: { ticks: { color: "white" } }
    }
  }
});

// ==========================
// STATE
// ==========================
let btcDelta = 0;
let ethDelta = 0;

// ==========================
// BTC STREAM
// ==========================
const btcSocket = new WebSocket("wss://stream.binance.com:9443/ws/btcusdt@trade");

btcSocket.onmessage = (event) => {
  const trade = JSON.parse(event.data);

  const price = parseFloat(trade.p);
  const qty   = parseFloat(trade.q);

  const isBuyerMaker = trade.m;

  // If buyer is maker → sell pressure
  const delta = isBuyerMaker ? -qty : qty;

  btcDelta += delta;
};

// ==========================
// ETHBTC STREAM
// ==========================
const ethSocket = new WebSocket("wss://stream.binance.com:9443/ws/ethbtc@trade");

ethSocket.onmessage = (event) => {
  const trade = JSON.parse(event.data);

  const qty = parseFloat(trade.q);
  const isBuyerMaker = trade.m;

  const delta = isBuyerMaker ? -qty : qty;

  ethDelta += delta;
};

// ==========================
// UPDATE LOOP
// ==========================
setInterval(() => {

  // Composite delta
  let comp = (btcDelta * 1.2) + (ethDelta * 0.8);

  // Normalize
  let norm = Math.max(Math.abs(comp), 1);
  comp = comp / norm;

  // Reset for next interval
  btcDelta = 0;
  ethDelta = 0;

  // Color logic
  let color = "gray";

  if (comp > 0.3) color = "lime";
  else if (comp < -0.3) color = "red";

  data.push(comp);
  colors.push(color);
  labels.push("");

  if (data.length > 60) {
    data.shift();
    colors.shift();
    labels.shift();
  }

  chart.update();

}, 2000);
</script>

</body>
</html>
