<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Composite Crypto Footprint V3 - TIME ENGINE</title>
<style>
body{
  margin:0;
  font-family:Arial, sans-serif;
  background:#05070d;
  color:#e5e7eb;
}
header{
  padding:10px 14px;
  border-bottom:1px solid #1f2937;
  display:flex;
  justify-content:space-between;
  align-items:center;
}
.title{font-weight:700;font-size:14px;letter-spacing:1px}
.sub{font-size:12px;color:#9ca3af}

.container{
  display:grid;
  grid-template-columns: 260px 1fr 260px;
  height:calc(100vh - 90px);
}

.panel{
  border-right:1px solid #1f2937;
  padding:10px;
  overflow:auto;
}

.center{
  display:flex;
  flex-direction:column;
}

.topbar{
  display:grid;
  grid-template-columns: repeat(4, 1fr);
  gap:10px;
  padding:10px;
  border-bottom:1px solid #1f2937;
}

.card{
  background:#0b1220;
  padding:10px;
  border-radius:6px;
  font-size:12px;
}

.green{color:#22c55e}
.red{color:#ef4444}
.gray{color:#9ca3af}

.tfbar{
  display:flex;
  gap:8px;
  padding:8px 10px;
  border-bottom:1px solid #1f2937;
  flex-wrap:wrap;
}

.tfbtn{
  padding:5px 10px;
  font-size:11px;
  border-radius:4px;
  cursor:pointer;
  background:#111827;
  border:1px solid #1f2937;
  color:#9ca3af;
}

.tfbtn.active{
  border-color:#22c55e;
  color:#22c55e;
  background:rgba(34,197,94,0.1);
}

.grid{
  flex:1;
  display:grid;
  grid-template-columns: repeat(10, 1fr);
  gap:6px;
  padding:10px;
  overflow:auto;
}

.cell{
  height:28px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:11px;
  border-radius:4px;
  background:#111827;
  border:1px solid #1f2937;
}

.buy{background:rgba(34,197,94,0.25);border-color:#22c55e}
.sell{background:rgba(239,68,68,0.25);border-color:#ef4444}
.neutral{background:#111827}

.footer{
  padding:8px;
  border-top:1px solid #1f2937;
  display:flex;
  justify-content:space-between;
  font-size:11px;
}

.small{font-size:11px;color:#9ca3af}

</style>
</head>
<body>

<header>
  <div>
    <div class="title">COMPOSITE CRYPTO FOOTPRINT V3</div>
    <div class="sub">REAL TIME TIMEFRAME ENGINE (BUCKETED CANDLES)</div>
  </div>
  <div class="small" id="status">CONNECTING...</div>
</header>

<div class="container">

  <div class="panel">
    <div class="card">
      <b>TIMEFRAME ENGINE</b><br/>
      Active TF: <span id="activeTf">M1</span><br/>
      Candle Buffer: <span id="bufferSize">0</span>
    </div>
  </div>

  <div class="center">

    <div class="topbar">
      <div class="card" id="btc">BTC: --</div>
      <div class="card" id="eth">ETH: --</div>
      <div class="card" id="delta">DELTA: --</div>
      <div class="card" id="flow">FLOW: --</div>
    </div>

    <div class="tfbar">
      <div class="tfbtn active" data-tf="60000">M1</div>
      <div class="tfbtn" data-tf="300000">M5</div>
      <div class="tfbtn" data-tf="900000">M15</div>
      <div class="tfbtn" data-tf="3600000">H1</div>
      <div class="tfbtn" data-tf="21600000">H6</div>
      <div class="tfbtn" data-tf="43200000">H12</div>
      <div class="tfbtn" data-tf="86400000">D1</div>
      <div class="tfbtn" data-tf="604800000">W1</div>
    </div>

    <div class="grid" id="grid"></div>

    <div class="footer">
      <div id="info">WAITING STREAM...</div>
      <div id="pressure">--</div>
    </div>

  </div>

  <div class="panel">
    <div class="card">
      <b>LIVE ENGINE</b><br/>
      Binance WebSocket: <span id="ws">OFF</span>
    </div>
  </div>

</div>

<script>
const grid = document.getElementById('grid');
let ws;
let trades = [];
let currentTF = 60000;
let candles = [];

function connectWS(){
  ws = new WebSocket("wss://stream.binance.com:9443/ws/btcusdt@trade");

  ws.onopen = () => {
    document.getElementById("ws").textContent = "LIVE";
    document.getElementById("status").textContent = "CONNECTED";
  };

  ws.onmessage = (e) => {
    const t = JSON.parse(e.data);

    trades.push({
      price: +t.p,
      qty: +t.q,
      side: t.m ? "sell" : "buy",
      time: Date.now()
    });

    if(trades.length > 500) trades.shift();

    buildCandles();
  };
}

function buildCandles(){
  const now = Date.now();
  const tf = currentTF;

  let grouped = {};

  for(let t of trades){
    const bucket = Math.floor(t.time / tf) * tf;

    if(!grouped[bucket]){
      grouped[bucket] = {open:t.price, high:t.price, low:t.price, close:t.price, buy:0, sell:0};
    }

    let c = grouped[bucket];

    c.high = Math.max(c.high, t.price);
    c.low = Math.min(c.low, t.price);
    c.close = t.price;

    if(t.side === "buy") c.buy += t.qty;
    else c.sell += t.qty;
  }

  candles = Object.keys(grouped).map(k => grouped[k]);

  render();
}

function render(){
  grid.innerHTML = "";

  let totalBuy = 0;
  let totalSell = 0;

  candles.slice(-120).forEach(c => {
    const delta = c.buy - c.sell;

    totalBuy += c.buy;
    totalSell += c.sell;

    const div = document.createElement("div");
    div.className = "cell";
    div.textContent = delta.toFixed(1);

    if(delta > 0) div.classList.add("buy");
    else if(delta < 0) div.classList.add("sell");
    else div.classList.add("neutral");

    grid.appendChild(div);
  });

  document.getElementById("bufferSize").textContent = candles.length;
  document.getElementById("delta").textContent = "DELTA: " + (totalBuy - totalSell).toFixed(2);
  document.getElementById("flow").textContent = totalBuy > totalSell ? "BUY FLOW" : "SELL FLOW";

  document.getElementById("pressure").textContent = totalBuy > totalSell ? "BULLISH" : "BEARISH";
}

// TIMEFRAME SWITCH FIX

document.querySelectorAll('.tfbtn').forEach(btn => {
  btn.onclick = () => {
    document.querySelectorAll('.tfbtn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');

    currentTF = parseInt(btn.dataset.tf);

    document.getElementById("activeTf").textContent = btn.textContent;

    buildCandles();
  };
});

connectWS();
</script>

</body>
</html>
