<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>⚡ V16.1 REAL FLOW ENGINE</title>

<style>
body{background:#02050c;color:#fff;font-family:Arial;margin:0}

.header{
 padding:12px;
 background:#060d1f;
 color:#ffb347;
 font-weight:bold;
}

.grid{
 display:grid;
 grid-template-columns:repeat(5,1fr);
 gap:10px;
 padding:10px;
}

.box{
 background:#0a1326;
 padding:10px;
 border-radius:6px;
 border:1px solid #1c2b4a;
}

.big{font-size:18px;font-weight:bold}

.green{color:#00ff9c}
.red{color:#ff4d4d}
.yellow{color:#ffd700}
</style>
</head>

<body>

<div class="header">⚡ V16.1 — REAL INSTITUTIONAL FLOW</div>

<!-- TOP -->
<div class="grid">
<div class="box">BTC.D<br><span id="btcd" class="big"></span></div>
<div class="box">USDT.D<br><span id="usdt" class="big"></span></div>
<div class="box">ETHBTC<br><span id="ethbtc" class="big"></span></div>
<div class="box">TOTAL<br><span id="total" class="big"></span></div>
<div class="box">Market<br><span id="state" class="big"></span></div>
</div>

<!-- FLOW -->
<div class="grid">
<div class="box">Spot Buy<br><span id="spotBuy"></span></div>
<div class="box">Spot Sell<br><span id="spotSell"></span></div>
<div class="box">Perp Buy<br><span id="perpBuy"></span></div>
<div class="box">Perp Sell<br><span id="perpSell"></span></div>
<div class="box">Open Interest<br><span id="oi"></span></div>
</div>

<div class="grid">
<div class="box">Delta<br><span id="delta" class="big"></span></div>
</div>

<script>

// ===== FORMAT =====
function fmt(v){
 if(v>1e9) return (v/1e9).toFixed(2)+"B";
 if(v>1e6) return (v/1e6).toFixed(2)+"M";
 return v.toFixed(2);
}

// ===== DIRECTION =====
function getDir(curr, prev){
 if(prev === 0) return ["➜","yellow"];
 let change = (curr - prev) / prev;

 if(change > 0.001) return ["▲","green"];
 if(change < -0.001) return ["▼","red"];
 return ["➜","yellow"];
}

// ===== STATE =====
let spotBuy=0, spotSell=0, perpBuy=0, perpSell=0;
let lastBTC=0, lastUSDT=0, lastETHBTC=0;

let btcDom=0, usdtDom=0, totalCap=0, ethbtcPrice=0;

// ===== BINANCE SPOT =====
new WebSocket("wss://stream.binance.com:9443/ws/btcusdt@trade")
.onmessage = (e)=>{
 let t = JSON.parse(e.data);
 let vol = parseFloat(t.q);

 if(t.m){ spotSell += vol } else { spotBuy += vol }
 update();
}

// ===== BINANCE PERP =====
new WebSocket("wss://fstream.binance.com/ws/btcusdt@trade")
.onmessage = (e)=>{
 let t = JSON.parse(e.data);
 let vol = parseFloat(t.q);

 if(t.m){ perpSell += vol } else { perpBuy += vol }
 update();
}

// ===== ETHBTC =====
new WebSocket("wss://stream.binance.com:9443/ws/ethbtc@trade")
.onmessage = (e)=>{
 let t = JSON.parse(e.data);
 ethbtcPrice = parseFloat(t.p);
 update();
}

// ===== OPEN INTEREST =====
async function getOI(){
 let res = await fetch("https://fapi.binance.com/fapi/v1/openInterest?symbol=BTCUSDT");
 let d = await res.json();
 document.getElementById("oi").innerText = fmt(parseFloat(d.openInterest));
}
setInterval(getOI,5000);

// ===== MACRO =====
async function getMacro(){
 let res = await fetch("https://api.coingecko.com/api/v3/global");
 let d = await res.json();

 btcDom = d.data.market_cap_percentage.btc;
 usdtDom = d.data.market_cap_percentage.usdt || 0;
 totalCap = d.data.total_market_cap.usd;

 update();
}
setInterval(getMacro,10000);
getMacro();

// ===== ENGINE =====
function update(){

 // direction
 let [btcA, btcC] = getDir(btcDom, lastBTC);
 let [usdtA, usdtC] = getDir(usdtDom, lastUSDT);
 let [ethA, ethC] = getDir(ethbtcPrice, lastETHBTC);

 lastBTC = btcDom;
 lastUSDT = usdtDom;
 lastETHBTC = ethbtcPrice;

 // display
 document.getElementById("btcd").innerHTML =
   btcDom.toFixed(2)+"% <span class='"+btcC+"'>"+btcA+"</span>";

 document.getElementById("usdt").innerHTML =
   usdtDom.toFixed(2)+"% <span class='"+usdtC+"'>"+usdtA+"</span>";

 document.getElementById("ethbtc").innerHTML =
   ethbtcPrice.toFixed(5)+" <span class='"+ethC+"'>"+ethA+"</span>";

 document.getElementById("total").innerText = fmt(totalCap);

 // volumes
 document.getElementById("spotBuy").innerText = fmt(spotBuy);
 document.getElementById("spotSell").innerText = fmt(spotSell);
 document.getElementById("perpBuy").innerText = fmt(perpBuy);
 document.getElementById("perpSell").innerText = fmt(perpSell);

 // delta
 let delta = (spotBuy+perpBuy) - (spotSell+perpSell);
 document.getElementById("delta").innerText = fmt(delta);

 // state
 let state="NEUTRAL ➜", color="yellow";

 if(delta > 0 && usdtDom < lastUSDT){
  state="RISK-ON ▲"; color="green";
 }
 else if(delta < 0 && usdtDom > lastUSDT){
  state="RISK-OFF ▼"; color="red";
 }

 let el=document.getElementById("state");
 el.innerText=state;
 el.className="big "+color;
}

</script>

</body>
</html>
