<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Myfxbook Style Risk Calculator</title>

<style>
body { margin:0; background:#0a0e27; color:#e2e8f0; font-family:Segoe UI; }
.container { max-width:900px; margin:auto; padding:20px; }

.card {
  background:#111827;
  padding:20px;
  border-radius:10px;
  margin-top:20px;
}

input {
  width:100%;
  padding:10px;
  margin:5px 0;
  background:#0f172a;
  color:white;
  border:1px solid #334155;
}

button {
  padding:10px;
  width:100%;
  background:#3b82f6;
  border:none;
  color:white;
  cursor:pointer;
  margin-top:10px;
}

h1 { color:#00ff88; }
p { color:#60a5fa; }
</style>

</head>

<body>

<div class="container">

<h1>📊 FX Risk Calculator (Myfxbook Style)</h1>

<div class="card">

  <input id="accountBalance" placeholder="Account Balance (optional)" />
  <input id="riskAmount" placeholder="Risk Amount ($ / AED)" />
  <input id="entryPrice" placeholder="Entry Price" />

  <button onclick="calculate()">Calculate</button>

  <div id="output"></div>

</div>

</div>

<script>

function calculate() {

  const balance = +document.getElementById("accountBalance").value || 0;
  const risk = +document.getElementById("riskAmount").value || 0;
  const entry = +document.getElementById("entryPrice").value || 0;

  if (!risk || !entry) return;

  // ===== MYFXBOOK STYLE CORE ENGINE =====
  const pipValuePerLot = 10;   // standard FX rule
  const defaultRiskPips = 20;  // fixed risk model (you can upgrade later)
  const pip = 0.0001;

  // LOT SIZE
  const lotSize = risk / (defaultRiskPips * pipValuePerLot);

  // AUTO STOP LOSS PRICE
  const slBuy = entry - (defaultRiskPips * pip);
  const slSell = entry + (defaultRiskPips * pip);

  document.getElementById("output").innerHTML = `
    <p>📦 Lot Size: <b>${lotSize.toFixed(2)}</b></p>
    <p>📉 Stop Loss (BUY): ${slBuy.toFixed(5)}</p>
    <p>📈 Stop Loss (SELL): ${slSell.toFixed(5)}</p>
    <p>📊 Risk Model: ${defaultRiskPips} pips</p>
  `;

}

</script>

</body>
</html>
