<!DOCTYPE html>
<html>
<head>
    <title>Trading AI Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { background:#0f1116; color:white; font-family:Arial; }
        .card {
            background:#1a1d26;
            padding:20px;
            margin:10px;
            border-radius:10px;
        }
        .grid {
            display:grid;
            grid-template-columns: repeat(3, 1fr);
        }
    </style>
</head>

<body>

<h1>📊 Trading Dashboard</h1>

<div class="grid">

<div class="card">
<h2>Win Rate</h2>
<p id="winrate">Loading...</p>
</div>

<div class="card">
<h2>Total Trades</h2>
<p id="total">Loading...</p>
</div>

<div class="card">
<h2>Last Signal</h2>
<p id="last">Loading...</p>
</div>

</div>

<div class="card">
<canvas id="chart"></canvas>
</div>

<script>
async function loadStats() {
    const res = await fetch("http://127.0.0.1:8000/stats");
    const data = await res.json();

    document.getElementById("winrate").innerText = data.winrate + "%";
    document.getElementById("total").innerText = data.total_trades;
}

async function loadTrades() {
    const res = await fetch("http://127.0.0.1:8000/trades");
    const data = await res.json();

    if (data.length === 0) return;

    document.getElementById("last").innerText =
        data[data.length - 1].type + " @ " + data[data.length - 1].price;

    const prices = data.map(x => x.price);

    const ctx = document.getElementById('chart').getContext('2d');

    new Chart(ctx, {
        type: 'line',
        data: {
            labels: data.map((_, i) => i),
            datasets: [{
                label: 'Price',
                data: prices,
                borderWidth: 2
            }]
        }
    });
}

loadStats();
loadTrades();
</script>

</body>
</html>
