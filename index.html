<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>⚡ V14 PRO FLOW TERMINAL</title>

<style>
body{
    margin:0;
    background:#05070d;
    color:#fff;
    font-family:Arial;
}

/* HEADER */
.header{
    padding:15px;
    font-size:22px;
    color:#f7a600;
}

/* GRID */
.grid{
    display:grid;
    grid-template-columns:repeat(5,1fr);
    gap:12px;
    padding:10px;
}

/* CARDS */
.card{
    background:#0b0f1a;
    padding:15px;
    border-radius:10px;
    border:1px solid #111827;
}

.title{
    font-size:13px;
    color:#888;
}

.value{
    font-size:22px;
    margin-top:5px;
}

.green{color:#00ff9c;}
.red{color:#ff4d4d;}
.yellow{color:#f7a600;}

/* SECTION */
.section{
    padding:10px;
}

.section-title{
    color:#f7a600;
    font-size:18px;
    margin-bottom:10px;
}

/* SIGNAL BOX */
.signal{
    background:#0b0f1a;
    border-left:4px solid #f7a600;
    padding:20px;
    margin:10px;
    border-radius:10px;
}

.small{
    font-size:13px;
    color:#aaa;
}

</style>
</head>

<body>

<div class="header">⚡ V14 — INSTITUTIONAL FLOW TERMINAL</div>

<!-- ================= MACRO ================= -->
<div class="section">
<div class="section-title">Macro Drivers</div>

<div class="grid">

<div class="card">
<div class="title">BTC.D</div>
<div id="btcDom" class="value green">--</div>
<div class="small">Bias: BTC Strength</div>
</div>

<div class="card">
<div class="title">USDT.D</div>
<div id="usdtDom" class="value red">--</div>
<div class="small">Bias: Risk</div>
</div>

<div class="card">
<div class="title">ETHBTC</div>
<div id="ethbtc" class="value green">--</div>
<div class="small">Bias: Alt Strength</div>
</div>

<div class="card">
<div class="title">TOTAL</div>
<div id="total" class="value green">--</div>
<div class="small">Bias: Expansion</div>
</div>

<div class="card">
<div class="title">Market State</div>
<div id="state" class="value yellow">--</div>
<div class="small">Adaptive Engine</div>
</div>

</div>
</div>

<!-- ================= BTC FLOW ================= -->
<div class="section">
<div class="section-title">BTC Flow Engine</div>

<div class="grid" style="grid-template-columns:repeat(4,1fr);">

<div class="card">
<div class="title">Spot Volume</div>
<div id="spotVol" class="value green">--</div>
</div>

<div class="card">
<div class="title">Perp Volume</div>
<div id="perpVol" class="value green">--</div>
</div>

<div class="card">
<div class="title">Open Interest</div>
<div id="oi" class="value green">--</div>
</div>

<div class="card">
<div class="title">Market Pressure</div>
<div id="pressure" class="value green">--</div>
</div>

</div>
</div>

<!-- ================= SIGNAL ================= -->
<div class="section">
<div class="section-title">Terminal Signal</div>

<div class="signal">
<div id="signalText">
Loading...
</div>

<br>
<div id="strength" class="small"></div>
</div>

</div>

<script>

// ============================
// FORMAT
// ============================
function fmt(v){
    if(v>1e9) return (v/1e9).toFixed(2)+"B";
    if(v>1e6) return (v/1e6).toFixed(2)+"M";
    return v.toFixed(2);
}

// ============================
// FETCH LIVE DATA
// ============================
async function getData(){

    let global = await fetch("https://api.coingecko.com/api/v3/global").then(r=>r.json());
    let btcDom = global.data.market_cap_percentage.btc;
    let ethDom = global.data.market_cap_percentage.eth;
    let total  = global.data.total_market_cap.usd / 1e12;

    let usdtDom = 100 - btcDom - ethDom;

    // Binance BTC data
    let oi = Math.random()*20e9; // replace later with real API
    let spot = Math.random()*2e9;
    let perp = Math.random()*4e9;

    return {btcDom, usdtDom, total, oi, spot, perp};
}

// ============================
// ENGINE
// ============================
function compute(d){

    let score = 0;

    // Liquidity
    if(d.usdtDom < 7) score += 1;
    else score -= 1;

    // BTC dominance
    if(d.btcDom > 50) score += 0.5;

    // Market expansion
    if(d.total > 2.5) score += 0.5;

    return score;
}

// ============================
// SIGNAL TEXT
// ============================
function buildSignal(score, d){

    if(score > 1.2){
        return {
            text:`BTC bullish structure active.
Spot demand strong, participation rising.
Liquidity supportive (USDT.D falling).`,
            strength:"Strength: 8.5 / 10"
        }
    }

    if(score > 0.5){
        return {
            text:`Market mildly bullish.
Trend building, but confirmation needed.`,
            strength:"Strength: 6 / 10"
        }
    }

    return {
        text:`No clear edge.
Wait for structure + volume alignment.`,
        strength:"Strength: 3 / 10"
    }
}

// ============================
// UPDATE UI
// ============================
async function update(){

    let d = await getData();
    let score = compute(d);
    let sig = buildSignal(score, d);

    document.getElementById("btcDom").innerText = d.btcDom.toFixed(2)+"%";
    document.getElementById("usdtDom").innerText = d.usdtDom.toFixed(2)+"%";
    document.getElementById("total").innerText = d.total.toFixed(2)+"T";

    document.getElementById("spotVol").innerText = fmt(d.spot);
    document.getElementById("perpVol").innerText = fmt(d.perp);
    document.getElementById("oi").innerText = fmt(d.oi);

    document.getElementById("pressure").innerText =
        score > 1 ? "BUY ▲" :
        score < -1 ? "SELL ▼" :
        "NEUTRAL";

    document.getElementById("state").innerText =
        score > 1 ? "BULL TREND" :
        score < -1 ? "BEAR TREND" :
        "RANGE";

    document.getElementById("signalText").innerText = sig.text;
    document.getElementById("strength").innerText = sig.strength;
}

// RUN
update();
setInterval(update, 5000);

</script>

</body>
</html>
