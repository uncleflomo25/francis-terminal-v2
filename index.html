<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>⚡ V15 FINAL FLOW TERMINAL</title>

<style>
body{
    margin:0;
    background:#02050c;
    color:#fff;
    font-family:Arial;
}

/* HEADER */
.header{
    padding:14px;
    font-size:20px;
    color:#ffcc00;
}

/* GRID */
.grid{
    display:grid;
    grid-template-columns:repeat(5,1fr);
    gap:12px;
    padding:12px;
}

/* CARD */
.card{
    background:#081226;
    border:1px solid #13203a;
    padding:12px;
    border-radius:8px;
}

.title{
    font-size:12px;
    color:#aaa;
}

.value{
    font-size:20px;
    margin-top:4px;
}

/* COLORS */
.green{color:#00ff9c;}
.red{color:#ff4d4d;}
.yellow{color:#ffcc00;}

/* ROW */
.row{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:10px;
    padding:10px;
}

/* SIGNAL */
.signal{
    margin:10px;
    padding:12px;
    background:#081226;
    border-left:4px solid #ffcc00;
    border-radius:6px;
}
</style>
</head>

<body>

<div class="header">⚡ V15 — INSTITUTIONAL FLOW TERMINAL</div>

<!-- MACRO -->
<div class="grid">

<div class="card">
<div class="title">BTC.D</div>
<div id="btcVal" class="value"></div>
<div id="btcVol" class="title"></div>
</div>

<div class="card">
<div class="title">USDT.D</div>
<div id="usdtVal" class="value"></div>
<div id="usdtVol" class="title"></div>
</div>

<div class="card">
<div class="title">ETHBTC</div>
<div id="ethVal" class="value"></div>
<div id="ethVol" class="title"></div>
</div>

<div class="card">
<div class="title">TOTAL</div>
<div id="totalVal" class="value"></div>
<div id="totalVol" class="title"></div>
</div>

<div class="card">
<div class="title">Market State</div>
<div id="state" class="value"></div>
</div>

</div>

<!-- FLOW -->
<div class="row">

<div class="card">
<div class="title">Spot Buy</div>
<div id="spotBuy" class="value green"></div>
</div>

<div class="card">
<div class="title">Spot Sell</div>
<div id="spotSell" class="value red"></div>
</div>

<div class="card">
<div class="title">Perp Buy</div>
<div id="perpBuy" class="value green"></div>
</div>

<div class="card">
<div class="title">Perp Sell</div>
<div id="perpSell" class="value red"></div>
</div>

</div>

<div class="row">

<div class="card">
<div class="title">Delta</div>
<div id="delta" class="value"></div>
</div>

<div class="card">
<div class="title">Open Interest</div>
<div id="oi" class="value"></div>
</div>

<div class="card">
<div class="title">Market Pressure</div>
<div id="pressure" class="value"></div>
</div>

</div>

<!-- SIGNAL -->
<div class="signal">
<div id="signalText"></div>
<div id="strength"></div>
</div>

<script>

/* FORMAT */
function fmt(v){
    if(v >= 1e9) return (v/1e9).toFixed(2)+"B";
    if(v >= 1e6) return (v/1e6).toFixed(2)+"M";
    if(v >= 1e3) return (v/1e3).toFixed(2)+"K";
    return v.toFixed(2);
}

/* ARROW */
function arrow(change){
    if(change > 0.1) return "<span class='green'>▲</span>";
    if(change < -0.1) return "<span class='red'>▼</span>";
    return "<span class='yellow'>→</span>";
}

/* ENGINE */
function update(){

    // DAILY CHANGE SIMULATION
    let btcD = (Math.random()*2 - 1);
    let usdtD = (Math.random()*2 - 1);
    let ethD = (Math.random()*2 - 1);
    let totalD = (Math.random()*2 - 1);

    // VALUES
    let btc = 55 + btcD;
    let usdt = 6 + usdtD;
    let eth = 0.05 + ethD/100;
    let total = 2.5 + totalD/10;

    // DISPLAY
    btcVal.innerHTML = btc.toFixed(2)+"% "+arrow(btcD);
    usdtVal.innerHTML = usdt.toFixed(2)+"% "+arrow(usdtD);
    ethVal.innerHTML = eth.toFixed(4)+" "+arrow(ethD);
    totalVal.innerHTML = total.toFixed(2)+"T "+arrow(totalD);

    // VOLUME
    btcVol.innerHTML = "Vol: "+fmt(1e9 + Math.random()*1e9);
    usdtVol.innerHTML = "Vol: "+fmt(5e8 + Math.random()*5e8);
    ethVol.innerHTML = "Vol: "+fmt(3e8 + Math.random()*3e8);
    totalVol.innerHTML = "Vol: "+fmt(2e9 + Math.random()*2e9);

    // SPOT
    let spotTotal = 1e9 + Math.random()*1e9;
    let spotBuy = spotTotal * (0.5 + Math.random()*0.3);
    let spotSell = spotTotal - spotBuy;

    // PERP
    let perpTotal = 2e9 + Math.random()*2e9;
    let perpBuy = perpTotal * (0.5 + Math.random()*0.3);
    let perpSell = perpTotal - perpBuy;

    // DELTA
    let delta = (spotBuy + perpBuy) - (spotSell + perpSell);

    // DISPLAY FLOW
    spotBuy.innerHTML = fmt(spotBuy) + " ▲";
    spotSell.innerHTML = fmt(spotSell) + " ▼";
    perpBuy.innerHTML = fmt(perpBuy) + " ▲";
    perpSell.innerHTML = fmt(perpSell) + " ▼";

    // DELTA COLOR
    let deltaColor = "yellow";
    if(delta > 0) deltaColor = "green";
    if(delta < 0) deltaColor = "red";

    document.getElementById("delta").innerHTML =
        "<span class='"+deltaColor+"'>" + fmt(delta) + "</span>";

    // OI
    let oiVal = 1e9 + Math.random()*1e9;
    document.getElementById("oi").innerHTML = fmt(oiVal);

    // MARKET STATE
    let state = "RANGE";
    if(usdtD < 0 && ethD > 0) state = "RISK-ON";
    else if(usdtD > 0) state = "RISK-OFF";
    else if(btcD > 0 && ethD < 0) state = "BTC-LED";

    document.getElementById("state").innerHTML = state;

    // PRESSURE
    let pressure = "NEUTRAL";
    let color = "yellow";

    if(delta > 0 && oiVal > 1.5e9){
        pressure = "BUY";
        color = "green";
    }
    else if(delta < 0 && oiVal > 1.5e9){
        pressure = "SELL";
        color = "red";
    }

    document.getElementById("pressure").innerHTML =
        "<span class='"+color+"'>" + pressure + "</span>";

    // SIGNAL
    let signal = "No clear edge. Wait.";
    let strength = 3;

    if(state === "RISK-ON" && pressure === "BUY"){
        signal = "HTF Risk-on: ETH strength + falling USDT.D supports longs.";
        strength = 8;
    }
    else if(state === "RISK-OFF"){
        signal = "HTF Risk-off: capital moving to stables.";
        strength = 7;
    }
    else if(state === "BTC-LED"){
        signal = "BTC dominance rising. Focus BTC.";
        strength = 6;
    }

    document.getElementById("signalText").innerHTML = signal;
    document.getElementById("strength").innerHTML = "Strength: "+strength+"/10";

}

update();
setInterval(update,60000);

</script>

</body>
</html>
