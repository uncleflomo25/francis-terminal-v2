<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>FRANCIS TERMINAL V8 (DOM + HEATMAP)</title>

<style>
body{margin:0;background:#0f1722;color:#fff;font-family:Arial}
.wrap{display:grid;grid-template-columns:1fr 300px;height:100vh}
.left{position:relative}
.right{background:#0d1520;border-left:1px solid #1f2937;padding:10px}

/* DOM */
.dom{font-size:12px}
.row{display:flex;justify-content:space-between;padding:2px}
.bid{color:#26a69a}
.ask{color:#ef5350}
</style>
</head>

<body>

<div class="wrap">
<div class="left">
<canvas id="c"></canvas>
</div>

<div class="right">
<div>ORDER BOOK</div>
<div id="dom" class="dom"></div>
</div>
</div>

<script>
const c=document.getElementById("c");
const ctx=c.getContext("2d");
const domEl=document.getElementById("dom");

let bids=[],asks=[];
let price=0;

/* RESIZE */
function resize(){
c.width=window.innerWidth-300;
c.height=window.innerHeight;
}
window.onresize=resize;
resize();

/* WEBSOCKET */
let ws=new WebSocket("wss://stream.binance.com:9443/ws/btcusdt@depth20@100ms");

ws.onmessage=(e)=>{
let data=JSON.parse(e.data);
bids=data.bids.map(b=>[+b[0],+b[1]]);
asks=data.asks.map(a=>[+a[0],+a[1]]);
price=bids[0][0];
renderDOM();
draw();
};

/* DOM PANEL */
function renderDOM(){
domEl.innerHTML="";

asks.slice().reverse().forEach(a=>{
domEl.innerHTML+=`<div class="row ask"><span>${a[0]}</span><span>${a[1]}</span></div>`;
});
bids.forEach(b=>{
domEl.innerHTML+=`<div class="row bid"><span>${b[0]}</span><span>${b[1]}</span></div>`;
});
}

/* HEATMAP DRAW */
function draw(){

ctx.fillStyle="#0f1722";
ctx.fillRect(0,0,c.width,c.height);

if(!bids.length) return;

let all=[...bids,...asks];
let maxVol=Math.max(...all.map(x=>x[1]));

/* SCALE */
let minP=Math.min(...all.map(x=>x[0]));
let maxP=Math.max(...all.map(x=>x[0]));
let range=maxP-minP;

/* DRAW HEATMAP */
all.forEach(([p,v])=>{

let y=(maxP-p)/range*c.height;

/* intensity */
let alpha=v/maxVol;

/* color */
ctx.fillStyle = p>price
? `rgba(239,83,80,${alpha*0.6})`
: `rgba(38,166,154,${alpha*0.6})`;

ctx.fillRect(0,y,c.width,3);
});

/* CURRENT PRICE LINE */
let py=(maxP-price)/range*c.height;
ctx.strokeStyle="#fff";
ctx.beginPath();
ctx.moveTo(0,py);
ctx.lineTo(c.width,py);
ctx.stroke();
}
</script>

</body>
</html>
