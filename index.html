```html
<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>⚡ FRANCIS TERMINAL V8 — REAL ENGINE</title>

<script src="https://s3.tradingview.com/tv.js"></script>

<style>
body{
    margin:0;
    background:#02040a;
    color:#fff;
    font-family:Arial;
}

/* HEADER */
.header{
    text-align:center;
    padding:12px;
    font-size:20px;
    background:#0a0f1f;
}

/* GRID */
.grid{
    display:grid;
    grid-template-columns:2fr 1fr;
    gap:10px;
    padding:10px;
}

.right{
    display:grid;
    grid-template-rows:1fr 1fr;
    gap:10px;
}

.chart{height:350px;border:1px solid #1c2b4a;border-radius:8px;}
.small{height:170px;}

/* PANEL */
.panel{
    position:absolute;
    right:10px;
    top:70px;
    width:260px;
    padding:14px;
    background:#0a0f1f;
    border-radius:10px;
    border:1px solid #1c2b4a;
}

.green{color:#00ff9c;}
.red{color:#ff4d4d;}
.yellow{color:#ffd700;}
</style>
</head>

<body>

<div class="header">⚡ FRANCIS TERMINAL V8 — INSTITUTIONAL FLOW</div>

<div class="grid">
    <div id="total" class="chart"></div>

    <div class="right">
        <div id="btcdom" class="chart small"></div>
        <div id="ethbtc" class="chart small"></div>
    </div>
</div>

<div id="usdt" class="chart small"></div>

<div class="panel">
<b>⚡ V8 FLOW ENGINE</b><br><br>

Score: <span id="score"></span><br>
Confidence: <span id="conf"></span><br><br>

State: <span id="state"></span><br><br>

<div id="drivers"></div>
</div>

<script>

/* ===== FORMAT ===== */
function fmt(v){
    if(v>1e9) return (v/1e9).toFixed(2)+"B";
    if(v>1e6) return (v/1e6).toFixed(2)+"M";
    return v.toFixed(2);
}

/* ===== FETCH BINANCE ===== */
async function getData(symbol){
    let r = await fetch(`https://api.binance.com/api/v3/ticker/24hr?symbol=${symbol}`);
    return await r.json();
}

/* ===== TREND DETECTION ===== */
function trend(change){
    return parseFloat(change) >= 0 ? 1 : -1;
}

/* ===== ENGINE ===== */
async function update(){

    // REAL DATA
    let btc = await getData("BTCUSDT");
    let eth = await getData("ETHUSDT");

    // PROXY LOGIC (since TOTAL/BTC.D not in Binance API)
    let TOTAL = trend(btc.priceChangePercent);      // market proxy
    let BTCD  = trend(btc.priceChangePercent);      // btc strength proxy
    let ETHBTC= trend(eth.priceChangePercent - btc.priceChangePercent);
    let USDTD = trend(-btc.priceChangePercent);     // inverse risk proxy

    // ===== SCORING =====
    let score = 0;

    score += TOTAL * 2;
    score += BTCD * 1;
    score += ETHBTC * 1;
    score += (USDTD * -2);

    // ===== STATE =====
    let state = "NEUTRAL";
    let color = "yellow";

    if(score >=3){state="STRONG BULL";color="green";}
    else if(score >=1){state="BULLISH";color="green";}
    else if(score <=-3){state="RISK OFF";color="red";}
    else if(score <=-1){state="BEARISH";color="red";}

    // SPECIAL
    if(TOTAL==1 && BTCD==1) state="BTC TREND";
    if(TOTAL==1 && BTCD==-1) state="ALT SEASON";

    let conf = Math.min(100, Math.abs(score)*20);

    // DISPLAY
    document.getElementById("score").innerText = score;
    document.getElementById("conf").innerText = conf+"%";
    document.getElementById("state").innerHTML =
        `<span class="${color}">${state}</span>`;

    document.getElementById("drivers").innerHTML =
        `
        Market: ${TOTAL>0?'🟢':'🔴'}<br>
        BTC: ${BTCD>0?'🟢':'🔴'}<br>
        Alts: ${ETHBTC>0?'🟢':'🔴'}<br>
        Liquidity: ${USDTD>0?'🔴':'🟢'}
        `;
}

/* ===== CHARTS ===== */
new TradingView.widget({
    container_id:"total",
    symbol:"CRYPTOCAP:TOTAL",
    interval:"15",
    theme:"dark"
});

new TradingView.widget({
    container_id:"btcdom",
    symbol:"CRYPTOCAP:BTC.D",
    interval:"15",
    theme:"dark"
});

new TradingView.widget({
    container_id:"ethbtc",
    symbol:"BINANCE:ETHBTC",
    interval:"15",
    theme:"dark"
});

new TradingView.widget({
    container_id:"usdt",
    symbol:"CRYPTOCAP:USDT.D",
    interval:"15",
    theme:"dark"
});

/* RUN */
update();
setInterval(update,5000);

</script>

</body>
</html>
