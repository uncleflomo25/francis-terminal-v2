<!DOCTYPE html>
<html>
<head>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>

<canvas id="macroChart"></canvas>

<script>
const ctx = document.getElementById('macroChart');

new Chart(ctx, {
    type: 'line',
    data: {
        labels: [
            '2025-01',
            '2025-03',
            '2025-05',
            '2025-07',
            '2025-09',
            '2025-11',
            '2026-01',
            '2026-03',
            '2026-05'
        ],
        datasets: [
        {
            label: 'US Unemployment',
            data: [4.0,4.1,4.2,4.3,4.4,4.5,4.3,4.3,4.3],
            yAxisID:'y'
        },
        {
            label: 'DXY',
            data: [108,107,106,105,104,103,102,101,100],
            yAxisID:'y1'
        },
        {
            label: 'Macro Flow Score',
            data: [-60,-45,-30,-15,10,25,40,55,70],
            yAxisID:'y2'
        }]
    },
    options:{
        responsive:true,
        interaction:{
            mode:'index',
            intersect:false
        },
        scales:{
            y:{
                position:'left',
                title:{
                    display:true,
                    text:'Unemployment %'
                }
            },
            y1:{
                position:'right',
                grid:{
                    drawOnChartArea:false
                },
                title:{
                    display:true,
                    text:'DXY'
                }
            },
            y2:{
                min:-100,
                max:100,
                display:false
            }
        }
    }
});
</script>

</body>
</html>
