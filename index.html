<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>⚡ FRANCIS TERMINAL V10 — SMART FLOW</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script src="https://s3.tradingview.com/tv.js"></script>

<style>
body{
    margin:0;
    background:radial-gradient(circle at top,#050b18,#02040a);
    color:#fff;
    font-family:Arial;
}

/* HEADER */
.header{
    text-align:center;
    padding:12px;
    font-size:18px;
    background:#070f1f;
    border-bottom:1px solid #1a2a4a;
}

/* TOP BAR */
.topbar{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:10px;
    padding:10px;
}

.box{
    background:#0a1326;
    border:1px solid #1c2b4a;
    border-radius:10px;
    padding:10px;
    text-align:center;
}

.value{font-size:18px;}
.vol{font-size:11px;color:#888;}

.green{color:#00ff9c;}
.red{color:#ff4d4d;}
.yellow{color:#ffd700;}

/* GRID */
.grid{
    display:grid;
    grid-template-columns:2fr 1fr;
    grid-template-rows:450px 250px;
    gap:10px;
    padding:10px;
}

.chart{
    border:1px solid #13203a;
    border-radius:10px;
}

/* ENGINE PANEL */
.panel{
    background:#0a1326;
    border:1px solid #1c2b4a;
    border-radius:10px;
    padding:14px;
}
</style>
</head>

<body>

<div class="header">⚡ FRANCIS TERMINAL V10 — SMART SIGNAL ENGINE</div>

<!-- TOP BAR -->
<div class="topbar">
    <div class="box">
        USDT.D
        <div id="usdt" class="value"></div>
        <div id="usdtVol" class="vol"></div>
    </div>

    <div class="box">
        ETHBTC
        <div id="ethbtc" class="value"></div>
        <div id="ethbtcVol" class="vol"></div>
    </div>

    <div class="box">
        BTC.D
        <div id="btc" class="value"></div>
        <div id="btcVol" class="vol"></div>
    </div>

    <div class="box">
        TOTAL
        <div id="total" class="value"></div>
        <div id="totalVol" class="vol"></div>
    </div>
</div>

<!-- GRID -->
<div class="grid">

    <!-- MAIN TOTAL -->
    <div id="chart_total" class="chart"></div>

    <!-- ENGINE -->
    <div class="panel">
        <b>⚡ V10 ENGINE (HTF CONFIRM)</b><br><br>

        TF: 1D (Higher Timeframe)<br><br>

        Market State: <span id="state"></span><br>
        Confidence: <span id="conf"></span><br><br>

        BTC.D: <span id="btcState"></span><br>
        ETHBTC: <span id="ethState"></span><br>
        USDT.D: <span id="usdtState"></span><br><br>

        Liquidity: <span id="liq"></span>
    </div>

    <!-- USDT.D -->
    <div id="chart_usdt" class="chart"></div>

    <!-- RIGHT SIDE -->
    <div style="display:grid;grid-template-rows:1fr 1fr;gap:10px;">
        <div id="chart_ethbtc" class="chart"></div>
        <div id="chart_btc" class="chart"></div>
    </div>

</div>

<script>

/* FORMAT */
function fmt(v){
    if(v>1e9) return (v/1e9).toFixed(2)+"B";
    if(v>1e6) return (v/1e6).toFixed(2)+"M";
    return v.toFixed(2);
}

/* MOCK HTF DATA (you can replace with API later) */
function randomTrend(){
    return Math.random()>0.5 ? 1 : -1;
}

/* ENGINE LOGIC (V10) */
function updateEngine(){

    let btcTrend = randomTrend();
    let ethTrend = randomTrend();
    let usdtTrend = randomTrend();

    // STATES
    let btcState = btcTrend>0 ? "UP" : "DOWN";
    let ethState = ethTrend>0 ? "UP" : "DOWN";
    let usdtState = usdtTrend>0 ? "RISK OFF" : "RISK ON";

    document.getElementById("btcState").innerHTML =
        `<span class="${btcTrend>0?'green':'red'}">${btcState}</span>`;

    document.getElementById("ethState").innerHTML =
        `<span class="${ethTrend>0?'green':'red'}">${ethState}</span>`;

    document.getElementById("usdtState").innerHTML =
        `<span class="${usdtTrend>0?'red':'green'}">${usdtState}</span>`;

    // MASTER LOGIC
    let state = "SIDEWAYS";
    let conf = "40%";
    let color = "yellow";

    if(btcTrend>0 && ethTrend>0 && usdtTrend<0){
        state = "ALT BULL RUN";
        conf = "90%";
        color="green";
    }
    else if(btcTrend>0 && ethTrend<0){
        state = "BTC DOMINANCE";
        conf = "80%";
        color="yellow";
    }
    else if(btcTrend<0 && usdtTrend>0){
        state = "RISK OFF";
        conf = "85%";
        color="red";
    }

    document.getElementById("state").innerHTML =
        `<span class="${color}">${state}</span>`;

    document.getElementById("conf").innerHTML =
        `<span class="${color}">${conf}</span>`;

    document.getElementById("liq").innerHTML =
        `<span class="${usdtTrend>0?'red':'green'}">${usdtTrend>0?'EXITING':'ENTERING'}</span>`;
}

/* TOP BAR (mock volume) */
function updateTop(){

    let usdt = Math.random()*10;
    let btc = Math.random()*60;
    let eth = Math.random()*0.05;
    let total = Math.random()*3;

    document.getElementById("usdt").innerText = usdt.toFixed(2);
    document.getElementById("btc").innerText = btc.toFixed(2);
    document.getElementById("ethbtc").innerText = eth.toFixed(5);
    document.getElementById("total").innerText = total.toFixed(2)+"T";

    document.getElementById("usdtVol").innerText = "Vol: "+fmt(Math.random()*1e9);
    document.getElementById("btcVol").innerText = "Vol: "+fmt(Math.random()*1e9);
    document.getElementById("ethbtcVol").innerText = "Vol: "+fmt(Math.random()*1e9);
    document.getElementById("totalVol").innerText = "Vol: "+fmt(Math.random()*1e9);
}

/* CHARTS */
new TradingView.widget({container_id:"chart_total",symbol:"CRYPTOCAP:TOTAL",interval:"D",theme:"dark"});
new TradingView.widget({container_id:"chart_usdt",symbol:"CRYPTOCAP:USDT.D",interval:"D",theme:"dark"});
new TradingView.widget({container_id:"chart_ethbtc",symbol:"BINANCE:ETHBTC",interval:"D",theme:"dark"});
new TradingView.widget({container_id:"chart_btc",symbol:"CRYPTOCAP:BTC.D",interval:"D",theme:"dark"});

/* RUN */
updateTop();
updateEngine();

setInterval(()=>{
    updateTop();
    updateEngine();
},5000);

</script>

</body>
</html>
