<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>⚡ FRANCIS TERMINAL ELITE V3</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script src="https://s3.tradingview.com/tv.js"></script>

<style>
body{
    margin:0;
    background:#05070d;
    color:#fff;
    font-family:Arial;
}

/* HEADER */
.header{
    text-align:center;
    padding:12px;
    font-size:20px;
    background:#0a0f1f;
    border-bottom:1px solid #1c2b4a;
}

/* TOP BAR */
.topbar{
    display:grid;
    grid-template-columns: repeat(5,1fr);
    gap:10px;
    padding:10px;
}

.box{
    background:#0a0f1f;
    padding:10px;
    border-radius:8px;
    text-align:center;
    border:1px solid #13203a;
}

/* TIMEFRAME */
.tf{
    text-align:center;
    padding:10px;
}

.tf button{
    margin:4px;
    padding:6px 12px;
    background:#0a0f1f;
    color:white;
    border:1px solid #1c2b4a;
    border-radius:6px;
    cursor:pointer;
}

.tf button:hover{
    background:#13203a;
}

/* GRID */
.grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:10px;
    padding:10px;
}

.chart{
    height:300px;
    border:1px solid #13203a;
    border-radius:8px;
}

/* COLORS */
.green{color:#00ff9c;}
.red{color:#ff4d4d;}
.yellow{color:#ffd700;}

/* ELITE TABLE */
.elite{
    position:absolute;
    right:10px;
    top:60px;
    background:#0a0f1f;
    border:1px solid #1c2b4a;
    padding:10px;
    border-radius:8px;
    width:180px;
    font-size:12px;
}
</style>
</head>

<body>

<div class="header">⚡ FRANCIS TERMINAL ELITE V3</div>

<!-- TIMEFRAME -->
<div class="tf">
    <button onclick="setTF('1')">1m</button>
    <button onclick="setTF('5')">5m</button>
    <button onclick="setTF('15')">15m</button>
    <button onclick="setTF('60')">1H</button>
    <button onclick="setTF('240')">4H</button>
    <button onclick="setTF('D')">1D</button>
</div>

<!-- TOP STATUS -->
<div class="topbar">
    <div class="box" id="usdt">USDT.D</div>
    <div class="box" id="ethbtc">ETHBTC</div>
    <div class="box" id="btcd">BTC.D</div>
    <div class="box" id="total">TOTAL</div>
    <div class="box" id="signal">SIGNAL</div>
</div>

<!-- CHARTS -->
<div class="grid">
    <div id="chart1" class="chart"></div>
    <div id="chart2" class="chart"></div>
    <div id="chart3" class="chart"></div>
    <div id="chart4" class="chart"></div>
</div>

<!-- ELITE FLOW -->
<div class="elite" id="elite">
    <b>⚡ ELITE FLOW</b><br><br>
    USDT.D: <span id="e1"></span><br>
    ETHBTC: <span id="e2"></span><br>
    BTC.D: <span id="e3"></span><br>
    TOTAL: <span id="e4"></span><br><br>
    SIGNAL: <span id="e5"></span>
</div>

<script>
let tf = "15";

/* CREATE CHARTS */
function loadCharts(){
    document.getElementById("chart1").innerHTML="";
    document.getElementById("chart2").innerHTML="";
    document.getElementById("chart3").innerHTML="";
    document.getElementById("chart4").innerHTML="";

    new TradingView.widget({
        container_id:"chart1",
        symbol:"CRYPTOCAP:USDT.D",
        interval:tf,
        theme:"dark"
    });

    new TradingView.widget({
        container_id:"chart2",
        symbol:"BINANCE:ETHBTC",
        interval:tf,
        theme:"dark"
    });

    new TradingView.widget({
        container_id:"chart3",
        symbol:"CRYPTOCAP:BTC.D",
        interval:tf,
        theme:"dark"
    });

    new TradingView.widget({
        container_id:"chart4",
        symbol:"CRYPTOCAP:TOTAL",
        interval:tf,
        theme:"dark"
    });
}

/* TIMEFRAME CHANGE */
function setTF(newTF){
    tf = newTF;
    loadCharts();
}

/* DIRECTION LOGIC (SIMULATED) */
function randomTrend(){
    let r = Math.random();
    if(r > 0.66) return ["▲","green"];
    if(r < 0.33) return ["▼","red"];
    return ["→","yellow"];
}

/* UPDATE ELITE FLOW */
function updateFlow(){
    let a = randomTrend();
    let b = randomTrend();
    let c = randomTrend();
    let d = randomTrend();

    set("usdt", a);
    set("ethbtc", b);
    set("btcd", c);
    set("total", d);

    set("e1", a);
    set("e2", b);
    set("e3", c);
    set("e4", d);

    // SIGNAL LOGIC
    let signal = "SIDEWAYS";
    let color = "yellow";

    if(a[1]=="green" && d[1]=="green"){
        signal="STRONG";
        color="green";
    }
    if(a[1]=="red" && c[1]=="red"){
        signal="RISK OFF";
        color="red";
    }

    document.getElementById("signal").innerHTML =
        "<span class='"+color+"'>"+signal+"</span>";

    document.getElementById("e5").innerHTML =
        "<span class='"+color+"'>"+signal+"</span>";
}

/* SET TEXT */
function set(id,data){
    document.getElementById(id).innerHTML =
        "<span class='"+data[1]+"'>"+data[0]+"</span>";
}

/* INIT */
loadCharts();
updateFlow();
setInterval(updateFlow,4000);

</script>

</body>
</html>
