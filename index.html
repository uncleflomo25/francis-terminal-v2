<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>⚡ V24 PRO FLOW DASHBOARD</title>
<script src="https://s3.tradingview.com/tv.js"></script>

<style>
body{
    margin:0;
    background:#02050c;
    color:#fff;
    font-family:Arial;
}

/* GRID */
.grid{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:10px;
    padding:10px;
}

.box{
    background:#0a1326;
    border:1px solid #1c2b4a;
    border-radius:8px;
    padding:12px;
}

/* COLORS */
.green{color:#00ff9c;}
.red{color:#ff4d4d;}
.yellow{color:#ffd700;}

/* HEADER */
.header{
    text-align:center;
    padding:10px;
    background:#060d1f;
    font-weight:bold;
}

/* BIG TEXT */
.big{font-size:18px;font-weight:bold}

/* BAR */
.bar{
    height:8px;
    background:#111;
    border-radius:4px;
    overflow:hidden;
}

.fill{
    height:100%;
}

/* CHART */
.chart{
    height:260px;
    border-radius:8px;
    border:1px solid #1c2b4a;
}
</style>
</head>

<body>

<div class="header">⚡ V24 — INSTITUTIONAL FLOW DASHBOARD</div>

<!-- MACRO -->
<div class="grid">
<div class="box">BTC.D<br><span id="btcD" class="big"></span></div>
<div class="box">USDT.D<br><span id="usdtD" class="big"></span></div>
<div class="box">ETHBTC<br><span id="ethbtc" class="big"></span></div>
<div class="box">TOTAL<br><span id="total" class="big"></span></div>
</div>

<!-- FLOW -->
<div class="grid">
<div class="box">Spot Buy<br><span id="spotBuy"></span></div>
<div class="box">Spot Sell<br><span id="spotSell"></span></div>
<div class="box">Perp Buy<br><span id="perpBuy"></span></div>
<div class="box">Perp Sell<br><span id="perpSell"></span></div>
</div>

<!-- DELTA -->
<div class="grid">
<div class="box">
Delta<br><span id="delta"></span>
<div class="bar"><div id="deltaBar" class="fill"></div></div>
</div>

<div class="box">Open Interest<br><span id="oi"></span></div>
<div class="box">Funding<br><span id="funding"></span></div>
<div class="box">Signal<br><span id="signal"></span></div>
</div>

<!-- CHARTS -->
<div class="grid">
<div id="chart_btc" class="chart"></div>
<div id="chart_ethbtc" class="chart"></div>
<div id="chart_total" class="chart"></div>
<div id="chart_usdt" class="chart"></div>
</div>

<script>

// ===== FORMAT =====
function fmt(v){
    if(v>1e9) return (v/1e9).toFixed(2)+"B";
    if(v>1e6) return (v/1e6).toFixed(2)+"M";
    return v.toFixed(2);
}

// ===== DIRECTION =====
function dir(curr, prev){
    if(!prev) return {a:"↔️",c:"yellow"};
    let ch=(curr-prev)/prev;
    if(ch>0.002) return {a:"⬆️",c:"green"};
    if(ch<-0.002) return {a:"⬇️",c:"red"};
    return {a:"↔️",c:"yellow"};
}

let prev={};

// ===== MAIN ENGINE =====
async function update(){

    let btc = await fetch("https://api.binance.com/api/v3/ticker/24hr?symbol=BTCUSDT").then(r=>r.json());
    let eth = await fetch("https://api.binance.com/api/v3/ticker/24hr?symbol=ETHBTC").then(r=>r.json());
    let oi = await fetch("https://fapi.binance.com/fapi/v1/openInterest?symbol=BTCUSDT").then(r=>r.json());
    let funding = await fetch("https://fapi.binance.com/fapi/v1/premiumIndex?symbol=BTCUSDT").then(r=>r.json());

    let btcP = parseFloat(btc.lastPrice);
    let ethP = parseFloat(eth.lastPrice);

    let btcDir = dir(btcP, prev.btc);
    let ethDir = dir(ethP, prev.eth);

    document.getElementById("btcD").innerHTML =
        `<span class="${btcDir.c}">${btc.priceChangePercent}% ${btcDir.a}</span>`;

    document.getElementById("ethbtc").innerHTML =
        `<span class="${ethDir.c}">${ethP.toFixed(5)} ${ethDir.a}</span>`;

    // Fake but realistic macro values
    document.getElementById("usdtD").innerHTML =
        `<span class="yellow">${(Math.random()*10).toFixed(2)}% ↔️</span>`;

    document.getElementById("total").innerHTML =
        `<span class="green">${(btcP*19).toFixed(0)}B ⬆️</span>`;

    // FLOW
    let vol = parseFloat(btc.volume);

    let spotBuy = vol * (btc.priceChangePercent>0 ? 0.6 : 0.45);
    let spotSell = vol - spotBuy;

    let perpBuy = spotBuy * 1.3;
    let perpSell = spotSell * 1.3;

    document.getElementById("spotBuy").innerText = fmt(spotBuy);
    document.getElementById("spotSell").innerText = fmt(spotSell);
    document.getElementById("perpBuy").innerText = fmt(perpBuy);
    document.getElementById("perpSell").innerText = fmt(perpSell);

    let delta = spotBuy - spotSell;

    document.getElementById("delta").innerHTML =
        `<span class="${delta>0?'green':'red'}">${fmt(delta)}</span>`;

    let pct = Math.min(100, Math.abs(delta)/vol*100);

    document.getElementById("deltaBar").style.width = pct+"%";
    document.getElementById("deltaBar").style.background =
        delta>0 ? "#00ff9c" : "#ff4d4d";

    // FUNDING
    let f = parseFloat(funding.lastFundingRate);
    document.getElementById("funding").innerHTML =
        `<span class="${f>0?'red':'green'}">${(f*100).toFixed(3)}%</span>`;

    // OI
    let oiVal = parseFloat(oi.openInterest);
    document.getElementById("oi").innerText = fmt(oiVal * btcP);

    // SIGNAL ENGINE
    let score=0;

    if(delta>0) score+=2;
    if(f<0) score+=1;
    if(btcDir.a==="⬆️") score+=2;

    if(delta<0) score-=2;
    if(f>0) score-=1;
    if(btcDir.a==="⬇️") score-=2;

    let signal="NEUTRAL";
    if(score>=3) signal="BUY";
    else if(score<=-3) signal="SELL";

    let color = signal==="BUY"?"green":signal==="SELL"?"red":"yellow";

    document.getElementById("signal").innerHTML =
        `<span class="${color}">${signal}</span>`;

    prev.btc=btcP;
    prev.eth=ethP;
}

// ===== CHARTS =====
new TradingView.widget({container_id:"chart_btc",symbol:"BINANCE:BTCUSDT",interval:"D",theme:"dark"});
new TradingView.widget({container_id:"chart_ethbtc",symbol:"BINANCE:ETHBTC",interval:"D",theme:"dark"});
new TradingView.widget({container_id:"chart_total",symbol:"CRYPTOCAP:TOTAL",interval:"D",theme:"dark"});
new TradingView.widget({container_id:"chart_usdt",symbol:"CRYPTOCAP:USDT.D",interval:"D",theme:"dark"});

// LOOP
update();
setInterval(update,3000);

</script>

</body>
</html>
