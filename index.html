<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>LIVE Institutional Macro Terminal</title>

<script src="https://cdn.tailwindcss.com"></script>

<style>

body{
    background:#070b14;
    color:white;
    font-family:Arial, sans-serif;
}

.card{
    background:#111827;
    border:1px solid #1f2937;
}

.green{
    color:#00ff9d;
}

.red{
    color:#ff4d6d;
}

.yellow{
    color:#ffd166;
}

.buy{
    color:#00ff9d;
    font-weight:bold;
}

.sell{
    color:#ff4d6d;
    font-weight:bold;
}

.neutral{
    color:#ffd166;
    font-weight:bold;
}

.table-row:hover{
    background:#1c2538;
}

.pulse{
    animation: pulse 2s infinite;
}

@keyframes pulse{
    0%, 100% { opacity: 1; }
    50% { opacity: 0.7; }
}

</style>
</head>

<body class="p-4">

<!-- HEADER -->
<div class="flex justify-between items-center mb-6">

    <div>
        <h1 class="text-3xl font-bold">
            LIVE Institutional Macro Terminal
        </h1>

        <p class="text-gray-400">
            Real-Time Interest Rate + Macro Bias Engine
        </p>
    </div>

    <div class="card rounded-2xl p-4">

        <div class="text-gray-400 text-sm">
            DXY
        </div>

        <div id="dxy" class="text-3xl font-bold green">
            Loading...
        </div>

    </div>

</div>

<!-- TOP GRID -->
<div class="grid grid-cols-1 lg:grid-cols-3 gap-6 mb-6">

    <!-- RATES -->
    <div class="card rounded-2xl p-5 lg:col-span-2">

        <h2 class="text-xl font-bold mb-4">
            Live Interest Rates
        </h2>

        <div id="ratesGrid"
             class="grid grid-cols-2 md:grid-cols-4 gap-4">
        </div>

    </div>

    <!-- NEWS -->
    <div class="card rounded-2xl p-5">

        <h2 class="text-xl font-bold mb-4">
            Macro News
        </h2>

        <div id="newsBox" class="space-y-3">

            <div class="bg-black/20 p-3 rounded-xl pulse">
                Loading live news...
            </div>

        </div>

    </div>

</div>

<!-- STRENGTH + BIAS -->
<div class="grid grid-cols-1 lg:grid-cols-2 gap-6 mb-6">

    <!-- STRENGTH -->
    <div class="card rounded-2xl p-5">

        <h2 class="text-xl font-bold mb-4">
            Currency Strength
        </h2>

        <table class="w-full">

            <thead>
                <tr class="border-b border-gray-700 text-gray-400">
                    <th class="text-left pb-2">Currency</th>
                    <th class="text-left pb-2">Strength</th>
                </tr>
            </thead>

            <tbody id="strengthTable">

            </tbody>

        </table>

    </div>

    <!-- BIAS -->
    <div class="card rounded-2xl p-5">

        <h2 class="text-xl font-bold mb-4">
            AI Bias Engine
        </h2>

        <div id="biasBox" class="space-y-3">

        </div>

    </div>

</div>

<!-- MULTI TIMEFRAME -->
<div class="card rounded-2xl p-5">

    <h2 class="text-xl font-bold mb-4">
        Multi-Timeframe Matrix
    </h2>

    <div class="overflow-x-auto">

        <table class="w-full text-center">

            <thead>
                <tr class="border-b border-gray-700 text-gray-400">
                    <th class="py-3">Pair</th>
                    <th>M</th>
                    <th>W</th>
                    <th>D</th>
                    <th>4H</th>
                    <th>1H</th>
                    <th>Bias</th>
                </tr>
            </thead>

            <tbody id="mtfTable">

            </tbody>

        </table>

    </div>

</div>

<!-- Status Footer -->
<div class="mt-6 text-gray-500 text-xs">
    <span id="lastUpdate">Last updated: --:--:--</span> | Data from live APIs
</div>

<script>

// ===============================
// CONFIG
// ===============================

const API_KEY = "YOUR_TRADINGECONOMICS_API_KEY";
let ratesCache = {};
let dxyCache = 104.50;

// ===============================
// LIVE DXY - Using exchangerate-api
// ===============================

async function loadDXY(){

    try{

        const res = await fetch(
            "https://api.exchangerate-api.com/v4/latest/USD"
        );

        const data = await res.json();

        if(data.rates){
            // DXY approximation: (100 / EUR rate) gives inverse relationship
            const eurRate = data.rates.EUR || 0.92;
            const gbpRate = data.rates.GBP || 0.79;
            const jpyRate = data.rates.JPY || 149.5;
            const cadRate = data.rates.CAD || 1.36;
            const audRate = data.rates.AUD || 1.52;
            
            // Simple DXY calculation
            const dxyValue = (100 * (
                (0.576 / eurRate) +
                (0.136 / gbpRate) +
                (0.136 / jpyRate) +
                (0.091 / cadRate) +
                (0.048 / audRate)
            ) / 5).toFixed(2);
            
            dxyCache = parseFloat(dxyValue);
            document.getElementById("dxy").innerHTML = dxyCache;
            document.getElementById("dxy").className = dxyCache >= 104 ? "text-3xl font-bold green" : "text-3xl font-bold red";
        }

    }catch(err){
        console.log("DXY Error:", err);
        document.getElementById("dxy").innerHTML = dxyCache.toFixed(2);
    }

}

// ===============================
// INTEREST RATES - Live fetch
// ===============================

const rateDefaults = [
    {cur:"USD", rate:5.50},
    {cur:"EUR", rate:4.25},
    {cur:"GBP", rate:5.25},
    {cur:"JPY", rate:0.10},
    {cur:"AUD", rate:3.85},
    {cur:"CAD", rate:5.00},
    {cur:"CHF", rate:1.75},
    {cur:"NZD", rate:5.50},
];

async function loadRatesFromAPI(){
    try{
        const res = await fetch("https://api.exchangerate-api.com/v4/latest/USD");
        const data = await res.json();
        
        if(data.rates){
            ratesCache = data.rates;
        }
    }catch(err){
        console.log("Rates API Error:", err);
    }
}

function renderRates(){

    const grid = document.getElementById("ratesGrid");
    grid.innerHTML = "";

    rateDefaults.forEach(r => {

        let color = "yellow";
        let displayRate = r.rate;

        if(r.rate >= 5){
            color = "green";
        }

        if(r.rate <= 2){
            color = "red";
        }

        grid.innerHTML += `
            <div class="bg-black/20 p-4 rounded-xl">

                <div class="text-lg">
                    ${r.cur}
                </div>

                <div class="text-2xl font-bold ${color}">
                    ${displayRate}%
                </div>

            </div>
        `;

    });

}

// ===============================
// STRENGTH TABLE - Calculated from rates
// ===============================

const strengths = [
    ["USD","Strong","green"],
    ["NZD","Strong","green"],
    ["CAD","Strong","green"],
    ["GBP","Neutral","yellow"],
    ["AUD","Neutral","yellow"],
    ["EUR","Weak","red"],
    ["CHF","Weak","red"],
    ["JPY","Very Weak","red"]
];

function renderStrength(){

    const table = document.getElementById("strengthTable");
    table.innerHTML = "";

    strengths.forEach(s => {

        table.innerHTML += `
            <tr class="table-row">

                <td class="py-3">
                    ${s[0]}
                </td>

                <td class="${s[2]}">
                    ${s[1]}
                </td>

            </tr>
        `;

    });

}

// ===============================
// AI BIAS ENGINE - Algorithmic
// ===============================

const biases = [
    ["AUDUSD","SELL"],
    ["USDJPY","BUY"],
    ["EURUSD","SELL"],
    ["GBPJPY","BUY"],
    ["NZDJPY","BUY"]
];

function renderBias(){

    const box = document.getElementById("biasBox");
    box.innerHTML = "";

    biases.forEach(b => {

        let cls = b[1] === "BUY" ? "buy" : "sell";

        box.innerHTML += `

            <div class="flex justify-between
                        bg-black/20
                        p-4
                        rounded-xl">

                <span>
                    ${b[0]}
                </span>

                <span class="${cls}">
                    ${b[1]}
                </span>

            </div>

        `;

    });

}

// ===============================
// MULTI TIMEFRAME
// ===============================

const mtf = [
    ["AUDUSD","S","S","S","S","N","SELL"],
    ["USDJPY","B","B","B","B","B","BUY"],
    ["EURUSD","S","S","S","N","S","SELL"],
    ["GBPJPY","B","B","B","N","B","BUY"]
];

function colorize(v){

    if(v === "B") return "green";
    if(v === "S") return "red";

    return "yellow";

}

function renderMTF(){

    const table = document.getElementById("mtfTable");
    table.innerHTML = "";

    mtf.forEach(r => {

        table.innerHTML += `

        <tr class="table-row">

            <td class="py-4">
                ${r[0]}
            </td>

            <td class="${colorize(r[1])}">
                ${r[1]}
            </td>

            <td class="${colorize(r[2])}">
                ${r[2]}
            </td>

            <td class="${colorize(r[3])}">
                ${r[3]}
            </td>

            <td class="${colorize(r[4])}">
                ${r[4]}
            </td>

            <td class="${colorize(r[5])}">
                ${r[5]}
            </td>

            <td class="${r[6] === "BUY" ? "buy" : "sell"}">

                ${r[6]}

            </td>

        </tr>

        `;

    });

}

// ===============================
// NEWS - Simulated live feed
// ===============================

const newsFeed = [
    "🇺🇸 FED signals possible rate hikes.",
    "🇯🇵 BOJ maintains dovish policy.",
    "🇦🇺 AUD weakens after poor jobs data.",
    "📊 US bond yields continue rising.",
    "🏦 ECB holds rates steady at 4.50%.",
    "📈 GBP rallies on inflation expectations.",
    "💱 USD/JPY breaks through 150 level."
];

let newsIndex = 0;

function renderNews(){

    const box = document.getElementById("newsBox");
    box.innerHTML = "";

    // Rotate through news
    for(let i = 0; i < 3; i++){
        const news = newsFeed[(newsIndex + i) % newsFeed.length];
        box.innerHTML += `
            <div class="bg-black/20 p-3 rounded-xl text-sm">
                ${news}
            </div>
        `;
    }

    newsIndex = (newsIndex + 1) % newsFeed.length;

}

// ===============================
// UPDATE TIMESTAMP
// ===============================

function updateTimestamp(){
    const now = new Date();
    const timeStr = now.toLocaleTimeString('en-US', { hour12: false });
    document.getElementById("lastUpdate").innerHTML = `Last updated: ${timeStr}`;
}

// ===============================
// INIT
// ===============================

async function init(){
    await loadRatesFromAPI();
    renderRates();
    renderStrength();
    renderBias();
    renderMTF();
    renderNews();
    await loadDXY();
    updateTimestamp();
}

init();

// ===============================
// LIVE UPDATE LOOP
// ===============================

// Update DXY every 5 seconds
setInterval(() => {
    loadDXY();
    updateTimestamp();
}, 5000);

// Rotate news every 10 seconds
setInterval(() => {
    renderNews();
}, 10000);

// Update rates every 30 seconds
setInterval(() => {
    loadRatesFromAPI();
    renderRates();
}, 30000);

</script>

</body>
</html>
