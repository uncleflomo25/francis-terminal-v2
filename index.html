<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>⚡ ELITE FLOW PRO</title>

<style>
body{
    background:#02050c;
    color:white;
    font-family:Arial;
    margin:0;
}

.header{
    text-align:center;
    padding:12px;
    background:#060d1f;
    font-weight:bold;
    font-size:18px;
}

.grid{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:12px;
    padding:12px;
}

.box{
    background:#0a1326;
    border:1px solid #1c2b4a;
    border-radius:8px;
    padding:15px;
}

.big{
    font-size:22px;
    font-weight:bold;
}

.green{color:#00ff9c;}
.red{color:#ff4d4d;}
.yellow{color:#ffd700;}

.arrow{
    font-size:28px;
    margin-left:8px;
}

.center{text-align:center;}
</style>
</head>

<body>

<div class="header">⚡ ELITE FLOW PRO — LIVE</div>

<div class="grid">

<div class="box center">
USDT.D<br>
<span id="usdt" class="big"></span>
</div>

<div class="box center">
ETHBTC<br>
<span id="ethbtc" class="big"></span>
</div>

<div class="box center">
BTC.D<br>
<span id="btcd" class="big"></span>
</div>

<div class="box center">
TOTAL<br>
<span id="total" class="big"></span>
</div>

<div class="box center">
BTC<br>
<span id="btc" class="big"></span>
</div>

<div class="box center">
Signal<br>
<span id="signal" class="big"></span>
</div>

<div class="box center">
State<br>
<span id="state" class="big"></span>
</div>

<div class="box center">
Confidence<br>
<span id="conf" class="big"></span>
</div>

</div>

<script>

// FORMAT
function fmt(v){
    if(v>1e9) return (v/1e9).toFixed(2)+"B";
    if(v>1e6) return (v/1e6).toFixed(2)+"M";
    return v.toFixed(2);
}

// DIRECTION
function dir(curr, prev){
    if(!prev) return {a:"↔️",c:"yellow",d:0};
    let ch = ((curr-prev)/prev)*100;

    if(ch>0.2) return {a:"⬆️",c:"green",d:1};
    if(ch<-0.2) return {a:"⬇️",c:"red",d:-1};
    return {a:"↔️",c:"yellow",d:0};
}

let prev={};

// MAIN LOOP
async function update(){

    // REAL DATA
    let btc = await fetch("https://api.binance.com/api/v3/ticker/price?symbol=BTCUSDT").then(r=>r.json());
    let eth = await fetch("https://api.binance.com/api/v3/ticker/price?symbol=ETHBTC").then(r=>r.json());

    let btcP = parseFloat(btc.price);
    let ethP = parseFloat(eth.price);

    let btcD = dir(btcP, prev.btc);
    let ethD = dir(ethP, prev.eth);

    // ===== PROXY DOMINANCE =====
    let btcd = 50 + (btcD.d * 5);      // fake but directional
    let usdt = 5 - (btcD.d * 2);       // inverse logic
    let total = btcP * 19;             // rough proxy

    let btcdD = dir(btcd, prev.btcd);
    let usdtD = dir(usdt, prev.usdt);
    let totalD = dir(total, prev.total);

    // DISPLAY
    function set(id,val,d){
        document.getElementById(id).innerHTML =
            `<span class="${d.c}">${val} <span class="arrow">${d.a}</span></span>`;
    }

    set("btc", btcP.toFixed(0), btcD);
    set("ethbtc", ethP.toFixed(5), ethD);
    set("btcd", btcd.toFixed(2)+"%", btcdD);
    set("usdt", usdt.toFixed(2)+"%", usdtD);
    set("total", fmt(total), totalD);

    // ===== SIGNAL ENGINE =====
    let score = 0;

    score += btcD.d * 2;
    score += ethD.d;
    score -= btcdD.d;
    score -= usdtD.d;
    score += totalD.d * 2;

    let signal="NEUTRAL";
    if(score>=3) signal="BUY";
    if(score<=-3) signal="SELL";

    let color = signal=="BUY"?"green":signal=="SELL"?"red":"yellow";

    document.getElementById("signal").innerHTML =
        `<span class="${color}">${signal}</span>`;

    // STATE
    let state =
        btcD.d==1 ? "TREND UP" :
        btcD.d==-1 ? "TREND DOWN" :
        "RANGE";

    document.getElementById("state").innerHTML =
        `<span class="${btcD.c}">${state}</span>`;

    // CONFIDENCE
    let conf = Math.min(100, Math.abs(score)*20);
    document.getElementById("conf").innerText = conf + "%";

    // SAVE
    prev.btc = btcP;
    prev.eth = ethP;
    prev.btcd = btcd;
    prev.usdt = usdt;
    prev.total = total;
}

// LOOP
update();
setInterval(update,3000);

</script>

</body>
</html>
