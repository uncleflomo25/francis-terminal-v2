<!DOCTYPE html><html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Liquidity Flow Terminal</title>
<style>
body {
  margin: 0;
  background: #0b0f14;
  color: #d1d5db;
  font-family: monospace;
}
.header {
  padding: 12px;
  border-bottom: 1px solid #1f2937;
  display: flex;
  justify-content: space-between;
}
.grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  padding: 10px;
}
.card {
  background: #111827;
  border: 1px solid #1f2937;
  padding: 10px;
  border-radius: 6px;
}
.tf {
  display: flex;
  justify-content: space-between;
  padding: 4px 0;
  border-bottom: 1px solid #1f2937;
}
.up { color: #22c55e; }
.down { color: #ef4444; }
.neutral { color: #9ca3af; }
.big {
  font-size: 20px;
  font-weight: bold;
}
.meter {
  height: 8px;
  background: #1f2937;
  border-radius: 4px;
  overflow: hidden;
}
.fill {
  height: 100%;
  width: 50%;
  background: #22c55e;
}
</style>
</head>
<body><div class="header">
  <div>LIQUIDITY FLOW TERMINAL</div>
  <div id="regime">REGIME: LOADING...</div>
</div><div class="grid">  <div class="card">
    <div class="big">MULTI-TF COMPOSITE</div>
    <div id="tfTable"></div>
  </div>  <div class="card">
    <div class="big">ALIGNMENT METER</div>
    <div class="meter"><div class="fill" id="meterFill"></div></div>
    <div id="alignmentText" style="margin-top:10px"></div>
  </div></div><div class="card" style="margin:10px">
  <div class="big">HIDDEN STRUCTURE ENGINE</div>
  <div id="structure"></div>
</div><script>

// ------------------------------
// MOCK DATA (replace with API later)
// ------------------------------
const data = {
  "1M": 120,
  "1W": 110,
  "1D": 105,
  "4H": 102,
  "1H": 101,
  "30M": 99,
  "15M": 98,
  "5M": 97,
  "1M": 96
};

const weights = {
  "1M": 10,
  "1W": 9,
  "1D": 8,
  "4H": 6,
  "1H": 5,
  "30M": 3,
  "15M": 3,
  "5M": 2,
  "1M": 1
};

function getTrend(val, prev) {
  if (val > prev) return "up";
  if (val < prev) return "down";
  return "neutral";
}

function render() {
  const tfTable = document.getElementById("tfTable");
  tfTable.innerHTML = "";

  let score = 0;
  let totalWeight = 0;
  let prev = null;

  Object.keys(data).forEach(tf => {
    const val = data[tf];
    const trend = prev ? getTrend(val, prev) : "neutral";
    const w = weights[tf];

    if (trend === "up") score += w;
    if (trend === "down") score -= w;
    totalWeight += w;

    tfTable.innerHTML += `
      <div class="tf">
        <span>${tf}</span>
        <span class="${trend}">${val.toFixed(2)}</span>
      </div>
    `;

    prev = val;
  });

  const alignment = (score / totalWeight) * 100;
  const meter = document.getElementById("meterFill");
  meter.style.width = Math.abs(alignment) + "%";
  meter.style.background = alignment > 0 ? "#22c55e" : "#ef4444";

  document.getElementById("alignmentText").innerText =
    "Alignment Score: " + alignment.toFixed(2) + "%";

  let regime = "RANGE";
  if (alignment > 30) regime = "BULLISH LIQUIDITY EXPANSION";
  if (alignment < -30) regime = "BEARISH LIQUIDITY DISTRIBUTION";

  document.getElementById("regime").innerText = "REGIME: " + regime;

  document.getElementById("structure").innerHTML = `
    <p>Macro Flow: ${alignment > 0 ? "EXPANDING" : "CONTRACTING"}</p>
    <p>Liquidity State: ${Math.abs(alignment) > 50 ? "HIGH IMPACT" : "LOW IMPACT"}</p>
    <p>BTC Hidden Bias: ${alignment > 0 ? "BULLISH ACCUMULATION" : "BEARISH DISTRIBUTION"}</p>
  `;
}

render();

setInterval(render, 3000);

</script></body>
</html>
