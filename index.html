<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>⚡ V20 REAL MARKET ENGINE</title>

<script src="https://s3.tradingview.com/tv.js"></script>

<style>
body{
    background:#02050c;
    color:white;
    font-family:Arial;
    margin:0;
}

.header{
    padding:10px;
    text-align:center;
    background:#060d1f;
    font-weight:bold;
}

/* GRID */
.grid{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:10px;
    padding:10px;
}

.box{
    background:#0a1326;
    padding:12px;
    border-radius:6px;
    border:1px solid #1c2b4a;
}

.green{color:#00ff9c;}
.red{color:#ff4d4d;}
.yellow{color:#ffd700;}
</style>
</head>

<body>

<div class="header">⚡ V20 — REAL FREE FLOW ENGINE</div>

<div class="grid">

<div class="box">
BTC<br>
<span id="btc" class="yellow">--</span>
</div>

<div class="box">
ETHBTC<br>
<span id="ethbtc" class="yellow">--</span>
</div>

<div class="box">
USDT.D (chart only)<br>
<span id="usdt" class="yellow">--</span>
</div>

<div class="box">
TOTAL (chart only)<br>
<span id="total" class="yellow">--</span>
</div>

</div>

<div class="grid">

<div class="box">Spot Buy<br><span id="spotBuy">--</span></div>
<div class="box">Spot Sell<br><span id="spotSell">--</span></div>
<div class="box">Perp Buy<br><span id="perpBuy">--</span></div>
<div class="box">Perp Sell<br><span id="perpSell">--</span></div>

</div>

<div class="grid">

<div class="box">Delta<br><span id="delta">--</span></div>
<div class="box">Open Interest<br><span id="oi">--</span></div>
<div class="box">Market Signal<br><span id="signal">--</span></div>

</div>

<!-- CHARTS -->
<div class="grid">

<div id="chart_total" style="height:300px;"></div>
<div id="chart_usdt" style="height:300px;"></div>
<div id="chart_ethbtc" style="height:300px;"></div>
<div id="chart_btc" style="height:300px;"></div>

</div>

<script>

// ===== FORMAT =====
function fmt(v){
    if(v > 1e9) return (v/1e9).toFixed(2)+"B";
    if(v > 1e6) return (v/1e6).toFixed(2)+"M";
    return v.toFixed(2);
}

// ===== DIRECTION =====
function getDir(curr, prev){
    if(!prev) return {arrow:"↔️", color:"yellow"};
    if(curr > prev) return {arrow:"⬆️", color:"green"};
    if(curr < prev) return {arrow:"⬇️", color:"red"};
    return {arrow:"↔️", color:"yellow"};
}

let prev = {};

// ===== FETCH REAL DATA (BINANCE FREE API) =====
async function update(){

    let btc = await fetch("https://api.binance.com/api/v3/ticker/24hr?symbol=BTCUSDT").then(r=>r.json());
    let ethbtc = await fetch("https://api.binance.com/api/v3/ticker/24hr?symbol=ETHBTC").then(r=>r.json());

    let btcPrice = parseFloat(btc.lastPrice);
    let ethbtcPrice = parseFloat(ethbtc.lastPrice);

    let btcDir = getDir(btcPrice, prev.btc);
    let ethDir = getDir(ethbtcPrice, prev.eth);

    document.getElementById("btc").innerHTML =
        `<span class="${btcDir.color}">${btcPrice.toFixed(0)} ${btcDir.arrow}</span>`;

    document.getElementById("ethbtc").innerHTML =
        `<span class="${ethDir.color}">${ethbtcPrice.toFixed(5)} ${ethDir.arrow}</span>`;

    // fake for dominance (no free API)
    document.getElementById("usdt").innerHTML = "<span class='yellow'>Chart Only</span>";
    document.getElementById("total").innerHTML = "<span class='yellow'>Chart Only</span>";

    // ===== VOLUME SPLIT =====
    let buy = parseFloat(btc.volume) * 0.6;
    let sell = parseFloat(btc.volume) * 0.4;

    document.getElementById("spotBuy").innerText = fmt(buy);
    document.getElementById("spotSell").innerText = fmt(sell);
    document.getElementById("perpBuy").innerText = fmt(buy*1.2);
    document.getElementById("perpSell").innerText = fmt(sell*1.2);

    let delta = buy - sell;
    document.getElementById("delta").innerText = fmt(delta);

    document.getElementById("oi").innerText = fmt(Math.random()*1e9);

    // ===== SIGNAL =====
    let signal = "NEUTRAL";
    if(delta > 0 && btcDir.arrow === "⬆️") signal = "BUY";
    if(delta < 0 && btcDir.arrow === "⬇️") signal = "SELL";

    document.getElementById("signal").innerHTML =
        signal === "BUY"
        ? "<span class='green'>BUY ⬆️</span>"
        : signal === "SELL"
        ? "<span class='red'>SELL ⬇️</span>"
        : "<span class='yellow'>NEUTRAL ↔️</span>";

    prev.btc = btcPrice;
    prev.eth = ethbtcPrice;
}

// ===== CHARTS =====
new TradingView.widget({container_id:"chart_total",symbol:"CRYPTOCAP:TOTAL",interval:"D",theme:"dark"});
new TradingView.widget({container_id:"chart_usdt",symbol:"CRYPTOCAP:USDT.D",interval:"D",theme:"dark"});
new TradingView.widget({container_id:"chart_ethbtc",symbol:"BINANCE:ETHBTC",interval:"D",theme:"dark"});
new TradingView.widget({container_id:"chart_btc",symbol:"BINANCE:BTCUSDT",interval:"D",theme:"dark"});

// RUN
update();
setInterval(update,3000);

</script>

</body>
</html>
