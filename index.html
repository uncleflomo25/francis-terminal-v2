<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>⚡ FRANCIS TERMINAL V9 — CLEAN ENGINE</title>
<script src="https://s3.tradingview.com/tv.js"></script>

<style>
body{
    margin:0;
    background:#02040a;
    color:#fff;
    font-family:Arial;
}

/* HEADER */
.header{
    text-align:center;
    padding:12px;
    font-size:20px;
    background:#0a0f1f;
}

/* GRID */
.grid{
    display:grid;
    grid-template-columns:3fr 1fr;
    gap:10px;
    padding:10px;
}

.right{
    display:grid;
    grid-template-rows:1fr 1fr;
    gap:10px;
}

.bottom{
    padding:10px;
}

.chart{
    border:1px solid #1c2b4a;
    border-radius:8px;
}

.big{height:500px;}
.small{height:240px;}

/* PANEL */
.panel{
    position:absolute;
    right:10px;
    top:70px;
    width:260px;
    padding:14px;
    background:#0a0f1f;
    border-radius:10px;
    border:1px solid #1c2b4a;
}

.green{color:#00ff9c;}
.red{color:#ff4d4d;}
.yellow{color:#ffd700;}
</style>
</head>

<body>

<div class="header">⚡ FRANCIS TERMINAL V9 — INSTITUTIONAL FLOW</div>

<div class="grid">

    <!-- TOTAL BIG -->
    <div id="total" class="chart big"></div>

    <!-- RIGHT SIDE -->
    <div class="right">
        <div id="btcdom" class="chart small"></div>
        <div id="ethbtc" class="chart small"></div>
    </div>

</div>

<!-- USDT FULL WIDTH -->
<div class="bottom">
    <div id="usdt" class="chart small"></div>
</div>

<!-- ENGINE PANEL -->
<div class="panel">
<b>⚡ V9 ENGINE</b><br><br>

State: <span id="state"></span><br>
Confidence: <span id="conf"></span><br><br>

<div id="explain"></div>
</div>

<script>

/* ===== FETCH ===== */
async function get(symbol){
    let r = await fetch(`https://api.binance.com/api/v3/ticker/24hr?symbol=${symbol}`);
    return await r.json();
}

/* ===== TREND FILTER ===== */
function trend(change){
    let c = parseFloat(change)
    if(c > 0.4) return 1
    if(c < -0.4) return -1
    return 0
}

/* ===== ENGINE ===== */
async function update(){

    let btc = await get("BTCUSDT")
    let eth = await get("ETHUSDT")

    let TOTAL = trend(btc.priceChangePercent)
    let BTCD  = trend(btc.priceChangePercent)
    let ETHBTC= trend(eth.priceChangePercent - btc.priceChangePercent)
    let USDTD = trend(-btc.priceChangePercent)

    let state = "RANGE"
    let color = "yellow"

    if(TOTAL==1 && BTCD==1 && USDTD<=0){
        state="BTC TREND"
        color="green"
    }
    else if(TOTAL==1 && BTCD==-1 && ETHBTC==1){
        state="ALT SEASON"
        color="green"
    }
    else if(TOTAL==-1 && USDTD==1){
        state="RISK OFF"
        color="red"
    }

    let agreement = Math.abs(TOTAL + BTCD + ETHBTC - USDTD)
    let confidence = Math.min(100, agreement * 25)

    // DISPLAY
    document.getElementById("state").innerHTML =
        `<span class="${color}">${state}</span>`

    document.getElementById("conf").innerText = confidence + "%"

    document.getElementById("explain").innerHTML = `
    Market: ${TOTAL==1?'UP':TOTAL==-1?'DOWN':'FLAT'}<br>
    BTC.D: ${BTCD==1?'UP':BTCD==-1?'DOWN':'FLAT'}<br>
    ETHBTC: ${ETHBTC==1?'UP':ETHBTC==-1?'DOWN':'FLAT'}<br>
    Liquidity: ${USDTD==1?'RISK OFF':USDTD==-1?'RISK ON':'NEUTRAL'}
    `
}

/* ===== CHARTS ===== */
new TradingView.widget({container_id:"total",symbol:"CRYPTOCAP:TOTAL",interval:"15",theme:"dark"});
new TradingView.widget({container_id:"btcdom",symbol:"CRYPTOCAP:BTC.D",interval:"15",theme:"dark"});
new TradingView.widget({container_id:"ethbtc",symbol:"BINANCE:ETHBTC",interval:"15",theme:"dark"});
new TradingView.widget({container_id:"usdt",symbol:"CRYPTOCAP:USDT.D",interval:"15",theme:"dark"});

/* RUN */
update();
setInterval(update,5000);

</script>

</body>
</html>
