<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>COMPOSITE REAL-TIME FIXED</title>
<style>
body{margin:0;background:#0f1722;color:#fff;font-family:Arial}
canvas{display:block}
</style>
</head>

<body>
<canvas id="c"></canvas>

<script>
const c=document.getElementById("c");
const ctx=c.getContext("2d");

let bars=[];
let current=null;
let intervalMs=60000; // 1m
let lastTime=0;

/* RESIZE */
function resize(){
c.width=innerWidth;
c.height=innerHeight;
}
window.onresize=resize;
resize();

/* SCORE */
function score(d){
return (
(d.total*10)+
(d.ethbtc*500)+
((10-d.usdt)*2)+
(d.ethd*0.7)-
(d.btc*0.4)
);
}

/* FETCH */
async function getData(){
try{
const [cg,bn]=await Promise.all([
fetch("https://api.coingecko.com/api/v3/global").then(r=>r.json()),
fetch("https://api.binance.com/api/v3/ticker/price?symbol=ETHBTC").then(r=>r.json())
]);

return {
btc:cg.data.market_cap_percentage.btc,
usdt:cg.data.market_cap_percentage.usdt,
ethd:cg.data.market_cap_percentage.eth,
ethbtc:parseFloat(bn.price),
total:cg.data.total_market_cap.usd/1e12
};
}catch{
return null;
}
}

/* UPDATE ENGINE */
async function update(){

let d=await getData();
if(!d) return;

let s=score(d);
let now=Date.now();

/* NEW CANDLE */
if(!current || now-lastTime>=intervalMs){

if(current) bars.push(current);

let open = current ? current.c : 100;

current={
o:open,
h:open,
l:open,
c:open,
t:now
};

lastTime=now;
}

/* UPDATE CURRENT ONLY */
let move=(s-100)*0.03;

current.c = current.c + move;
current.h = Math.max(current.h,current.c);
current.l = Math.min(current.l,current.c);

draw();
}

/* DRAW */
function draw(){

ctx.fillStyle="#0f1722";
ctx.fillRect(0,0,c.width,c.height);

let all=[...bars,current].filter(Boolean);
if(all.length<2) return;

let max=Math.max(...all.map(b=>b.h));
let min=Math.min(...all.map(b=>b.l));
let range=max-min || 1;

let w=6,x=40;

all.forEach(b=>{

let col=b.c>b.o?"#26a69a":"#ef5350";

let yo=(max-b.o)/range*c.height;
let yc=(max-b.c)/range*c.height;
let yh=(max-b.h)/range*c.height;
let yl=(max-b.l)/range*c.height;

ctx.strokeStyle=col;
ctx.beginPath();
ctx.moveTo(x,yh);
ctx.lineTo(x,yl);
ctx.stroke();

ctx.fillStyle=col;
ctx.fillRect(x-2,Math.min(yo,yc),4,Math.abs(yc-yo));

x+=w;
});
}

/* LOOP */
setInterval(update,3000);
update();
</script>
</body>
</html>
