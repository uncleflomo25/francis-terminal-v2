<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>COMPOSITE CANDLE ENGINE</title>

<style>
body{margin:0;background:#0f1722;color:#fff;font-family:Arial;overflow:hidden}
canvas{display:block}
.panel{
position:absolute;right:10px;top:10px;
background:#111827;padding:12px;border-radius:10px;
font-size:13px
}
</style>
</head>

<body>

<canvas id="c"></canvas>

<div class="panel" id="info">Loading...</div>

<script>
const c=document.getElementById("c");
const ctx=c.getContext("2d");
const info=document.getElementById("info");

let bars=[];
let prevClose=100;

/* RESIZE */
function resize(){
c.width=innerWidth;
c.height=innerHeight;
}
window.onresize=resize;
resize();

/* NORMALIZE */
function norm(v,min,max){
return (v-min)/(max-min);
}

/* BUILD COMPOSITE SCORE */
function buildScore(d){

return (
(d.total*10) +          // growth
(d.ethbtc*500) +        // alt strength
((10-d.usdt)*2) +       // risk-on
(d.ethd*0.7) -          // ETH dominance
(d.btc*0.4)             // BTC dominance
);
}

/* CREATE CANDLE */
function makeCandle(score){

// smooth movement
let change = (score - 100) * 0.05;

// inertia
let open = prevClose;
let close = open + change;

// wick simulation (controlled, not random noise)
let high = Math.max(open, close) + Math.abs(change)*0.5;
let low  = Math.min(open, close) - Math.abs(change)*0.5;

prevClose = close;

return {o:open,h:high,l:low,c:close};
}

/* FETCH DATA */
async function fetchData(){

try{
const [cg,bn]=await Promise.all([
fetch("https://api.coingecko.com/api/v3/global").then(r=>r.json()),
fetch("https://api.binance.com/api/v3/ticker/price?symbol=ETHBTC").then(r=>r.json())
]);

let d={
btc:cg.data.market_cap_percentage.btc,
usdt:cg.data.market_cap_percentage.usdt,
ethd:cg.data.market_cap_percentage.eth,
ethbtc:parseFloat(bn.price),
total:cg.data.total_market_cap.usd/1e12
};

let score=buildScore(d);
let candle=makeCandle(score);

bars.push(candle);
if(bars.length>150) bars.shift();

draw();

info.innerHTML=`
BTC.D: ${d.btc.toFixed(2)}%<br>
USDT.D: ${d.usdt.toFixed(2)}%<br>
ETHBTC: ${d.ethbtc.toFixed(5)}<br>
ETH.D: ${d.ethd.toFixed(2)}%<br>
TOTAL: $${d.total.toFixed(2)}T
`;

}catch(e){
console.log("fallback");
}
}

/* DRAW */
function draw(){

ctx.fillStyle="#0f1722";
ctx.fillRect(0,0,c.width,c.height);

if(bars.length<2) return;

let max=Math.max(...bars.map(b=>b.h));
let min=Math.min(...bars.map(b=>b.l));
let range=max-min;

let w=8;
let x=50;

bars.forEach(b=>{

let col=b.c>b.o?"#26a69a":"#ef5350";

let yo=(max-b.o)/range*c.height;
let yc=(max-b.c)/range*c.height;
let yh=(max-b.h)/range*c.height;
let yl=(max-b.l)/range*c.height;

ctx.strokeStyle=col;
ctx.beginPath();
ctx.moveTo(x,yh);
ctx.lineTo(x,yl);
ctx.stroke();

ctx.fillStyle=col;
ctx.fillRect(x-3,Math.min(yo,yc),6,Math.abs(yc-yo));

x+=w;
});
}

/* LOOP */
setInterval(fetchData,3000);
fetchData();

</script>

</body>
</html>
