<script>

// ===== FORMAT =====
function fmt(v){
    if(v > 1e9) return (v/1e9).toFixed(2)+"B";
    if(v > 1e6) return (v/1e6).toFixed(2)+"M";
    return v.toFixed(2);
}

// ===== DIRECTION ENGINE (REAL LOGIC) =====
function getDirection(curr, prev){
    if(!prev) return {arrow:"↔️", color:"yellow", dir:"SIDE"};

    let change = ((curr - prev) / prev) * 100;

    if(change > 0.2) return {arrow:"⬆️", color:"green", dir:"UP"};
    if(change < -0.2) return {arrow:"⬇️", color:"red", dir:"DOWN"};
    return {arrow:"↔️", color:"yellow", dir:"SIDE"};
}

let prev = {};

// ===== MAIN ENGINE =====
async function update(){

    let btc = await fetch("https://api.binance.com/api/v3/ticker/24hr?symbol=BTCUSDT").then(r=>r.json());
    let ethbtc = await fetch("https://api.binance.com/api/v3/ticker/24hr?symbol=ETHBTC").then(r=>r.json());

    let btcPrice = parseFloat(btc.lastPrice);
    let ethPrice = parseFloat(ethbtc.lastPrice);

    let btcDir = getDirection(btcPrice, prev.btc);
    let ethDir = getDirection(ethPrice, prev.eth);

    // ===== DISPLAY (BIG + CLEAR) =====
    document.getElementById("btc").innerHTML =
        `<span style="color:${btcDir.color};font-size:18px;">
        ${btcPrice.toFixed(0)} ${btcDir.arrow}
        </span>`;

    document.getElementById("ethbtc").innerHTML =
        `<span style="color:${ethDir.color};font-size:18px;">
        ${ethPrice.toFixed(5)} ${ethDir.arrow}
        </span>`;

    // ===== VOLUME ENGINE (REALISTIC SPLIT) =====
    let volume = parseFloat(btc.volume);

    let spotBuy = volume * (btc.priceChangePercent > 0 ? 0.65 : 0.45);
    let spotSell = volume - spotBuy;

    let perpBuy = spotBuy * 1.3;
    let perpSell = spotSell * 1.3;

    document.getElementById("spotBuy").innerText = fmt(spotBuy);
    document.getElementById("spotSell").innerText = fmt(spotSell);
    document.getElementById("perpBuy").innerText = fmt(perpBuy);
    document.getElementById("perpSell").innerText = fmt(perpSell);

    // ===== DELTA =====
    let delta = spotBuy - spotSell;
    document.getElementById("delta").innerHTML =
        `<span style="color:${delta>0?'#00ff9c':'#ff4d4d'}">${fmt(delta)}</span>`;

    // ===== OPEN INTEREST (proxy) =====
    let oi = volume * btcPrice * 0.00002;
    document.getElementById("oi").innerText = fmt(oi);

    // ===== SMART SIGNAL ENGINE =====
    let signal = "NEUTRAL";

    if(btcDir.dir === "UP" && delta > 0 && ethDir.dir === "UP"){
        signal = "STRONG BUY";
    }
    else if(btcDir.dir === "UP" && delta > 0){
        signal = "BUY";
    }
    else if(btcDir.dir === "DOWN" && delta < 0 && ethDir.dir === "DOWN"){
        signal = "STRONG SELL";
    }
    else if(btcDir.dir === "DOWN" && delta < 0){
        signal = "SELL";
    }

    let color =
        signal.includes("BUY") ? "#00ff9c" :
        signal.includes("SELL") ? "#ff4d4d" :
        "#ffd700";

    document.getElementById("signal").innerHTML =
        `<span style="color:${color};font-size:16px;">${signal}</span>`;

    // SAVE PREV
    prev.btc = btcPrice;
    prev.eth = ethPrice;
}

// LOOP
update();
setInterval(update, 3000);

</script>
