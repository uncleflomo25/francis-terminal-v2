<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Liquidity Flow Terminal V2</title>
<!-- Load TradingView Lightweight Charts Library Natively via CDN -->
<script src="unpkg.com"></script>
<style>
body {
  margin: 0;
  background: #0b0f14;
  color: #d1d5db;
  font-family: monospace;
  padding: 10px;
}
.header {
  padding: 12px;
  border-bottom: 1px solid #1f2937;
  display: flex;
  justify-content: space-between;
  background: #111827;
  border-radius: 6px 6px 0 0;
}
.grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  padding: 10px 0;
}
.card {
  background: #111827;
  border: 1px solid #1f2937;
  padding: 15px;
  border-radius: 6px;
}
.tf {
  display: flex;
  justify-content: space-between;
  padding: 6px 0;
  border-bottom: 1px solid #1f2937;
}
.up { color: #22c55e; }
.down { color: #ef4444; }
.neutral { color: #9ca3af; }
.big {
  font-size: 16px;
  font-weight: bold;
  margin-bottom: 10px;
  letter-spacing: 1px;
}
.meter {
  height: 12px;
  background: #1f2937;
  border-radius: 6px;
  overflow: hidden;
  margin-top: 15px;
}
.fill {
  height: 100%;
  width: 50%;
  background: #22c55e;
  transition: width 0.5s ease, background 0.5s ease;
}
#chart-container {
  height: 280px;
  margin-top: 15px;
  border-radius: 4px;
  overflow: hidden;
}
</style>
</head>
<body>

<div class="header">
  <div>⚡ LIQUIDITY FLOW TERMINAL Engine</div>
  <div id="regime">REGIME: LOADING...</div>
</div>

<div class="grid">  
  <div class="card">
    <div class="big">📊 MULTI-TF COMPOSITE RATIO</div>
    <div id="tfTable"></div>
  </div>  
  
  <div class="card">
    <div class="big">⚖️ ALIGNMENT METER</div>
    <div class="meter"><div class="fill" id="meterFill"></div></div>
    <div id="alignmentText" style="margin-top:15px; font-size:14px;"></div>
  </div>
</div>

<div class="card">
  <div class="big">🛡️ HIDDEN STRUCTURE ENGINE</div>
  <div id="structure"></div>
  <!-- Embedded Native Composite Candlestick Chart Window Component -->
  <div id="chart-container"></div>
</div>

<script>
// ======================================================
// 1. DYNAMIC ASSET & WEIGHT DATA MATRIX
// ======================================================
const data = { "1M": 120, "1W": 110, "1D": 105, "4H": 102, "1H": 101, "30M": 99, "15M": 98, "5M": 97, "1m": 96 };
const weights = { "1M": 10, "1W": 9, "1D": 8, "4H": 6, "1H": 5, "30M": 3, "15M": 3, "5M": 2, "1m": 1 };

function getTrend(val, prev) {
  if (val > prev) return "up";
  if (val < prev) return "down";
  return "neutral";
}

// ======================================================
// 2. LIGHTWEIGHT CHARTS CANVAS INITIALIZATION
// ======================================================
const chartContainer = document.getElementById('chart-container');
const chart = LightweightCharts.createChart(chartContainer, {
    width: chartContainer.clientWidth,
    height: 280,
    layout: { backgroundColor: '#111827', textColor: '#9ca3af', fontSize: 11 },
    grid: { vertLines: { color: '#1f2937' }, horzLines: { color: '#1f2937' } },
    crosshair: { mode: LightweightCharts.CrosshairMode.Normal },
    priceScale: { borderColor: '#1f2937' },
    timeScale: { borderColor: '#1f2937', timeVisible: true, secondsVisible: false }
});

// Configure the single composite candlestick stream properties
const candleSeries = chart.addCandlestickSeries({
    upColor: '#22c55e',
    downColor: '#ef4444',
    borderDownColor: '#ef4444',
    borderUpColor: '#22c55e',
    wickDownColor: '#ef4444',
    wickUpColor: '#22c55e'
});

// Structural array mapping for memory storage 
let chartHistory = [];
let lastClose = 0.0;

// Initialize candles with basic historical base values
let baseTime = Math.floor(Date.now() / 1000) - (100 * 60);
for(let i = 0; i < 100; i++) {
    let mockVal = 0 + (Math.sin(i * 0.1) * 15);
    chartHistory.push({
        time: baseTime + (i * 60),
        open: lastClose,
        high: Math.max(lastClose, mockVal),
        low: Math.min(lastClose, mockVal),
        close: mockVal
    });
    lastClose = mockVal;
}
candleSeries.setData(chartHistory);

// ======================================================
// 3. COMBINED RENDER & CALCULATION LOOP
// ======================================================
function render() {
  const tfTable = document.getElementById("tfTable");
  tfTable.innerHTML = "";

  let score = 0;
  let totalWeight = 0;
  let prev = null;

  // Add random variance to mock realtime data movements for execution testing
  Object.keys(data).forEach(tf => {
    data[tf] += (Math.random() - 0.5) * 1.5; 
    const val = data[tf];
    const trend = prev ? getTrend(val, prev) : "neutral";
    const w = weights[tf];

    if (trend === "up") score += w;
    if (trend === "down") score -= w;
    totalWeight += w;

    tfTable.innerHTML += `
      <div class="tf">
        <span>${tf}</span>
        <span class="${trend}">${val.toFixed(2)}</span>
      </div>
    `;
    prev = val;
  });

  // Alignment Percentage Calculation
  const alignment = (score / totalWeight) * 100;
  
  // Update UI components
  const meter = document.getElementById("meterFill");
  meter.style.width = Math.abs(alignment) + "%";
  meter.style.background = alignment > 0 ? "#22c55e" : "#ef4444";

  document.getElementById("alignmentText").innerText = "Alignment Score: " + alignment.toFixed(2) + "%";

  let regime = "RANGE / CHOP";
  if (alignment > 30) regime = "BULLISH LIQUIDITY EXPANSION";
  if (alignment < -30) regime = "BEARISH LIQUIDITY DISTRIBUTION";
  document.getElementById("regime").innerText = "REGIME: " + regime;

  document.getElementById("structure").innerHTML = `
    <p style="margin:5px 0;">🌐 Macro Flow: ${alignment > 0 ? "<span class='up'>EXPANDING</span>" : "<span class='down'>CONTRACTING</span>"}</p>
    <p style="margin:5px 0;">📊 Liquidity State: ${Math.abs(alignment) > 50 ? "<span style='color:orange'>HIGH IMPACT</span>" : "LOW IMPACT"}</p>
    <p style="margin:5px 0;">⚡ Hidden Index Bias: ${alignment > 0 ? "<span class='up'>BULLISH ACCUMULATION</span>" : "<span class='down'>BEARISH DISTRIBUTION</span>"}</p>
  `;

  // ======================================================
  // 4. GENERATE NATIVE GAPLESS COMPOSITE CANDLESTICK
  // ======================================================
  let currentTime = Math.floor(Date.now() / 1000);
  
  // Calculate perfect wick structures to prevent chart deformation bugs
  let candleHigh = Math.max(lastClose, alignment);
  let candleLow = Math.min(lastClose, alignment);

  let newCandle = {
      time: currentTime,
      open: lastClose,
      high: candleHigh,
      low: candleLow,
      close: alignment
  };

  // Push updates natively directly into the chart element panel
  candleSeries.update(newCandle);
  lastClose = alignment; 
}

// Execute and handle interface loop intervals
render();
setInterval(render, 3000);

// Resize handler to ensure responsiveness
window.addEventListener('resize', () => {
    chart.resize(chartContainer.clientWidth, 280);
});
</script>
</body>
</html>
