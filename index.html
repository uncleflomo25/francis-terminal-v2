<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Francis Terminal PRO - Macro Composite Chart</title>
    <!-- TradingView Lightweight Charts -->
    <script src="https://unpkg.com/lightweight-charts@4.1.3/dist/lightweight-charts.standalone.production.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            background-color: #131722; 
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; 
            overflow: hidden; 
            color: #d1d4dc;
        }
        #header { 
            color: #ffffff; 
            padding: 12px 15px; 
            font-size: 14px; 
            font-weight: bold; 
            background: #1c2030; 
            border-bottom: 1px solid #2b2b43;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            flex-wrap: wrap;
        }
        .title-section {
            display: flex;
            align-items: center;
            gap: 15px;
        }
        .data-display {
            display: flex;
            gap: 20px;
            font-size: 11px;
        }
        .data-item {
            display: flex;
            align-items: center;
            gap: 5px;
        }
        .data-label {
            color: #a0a0b0;
        }
        .data-value {
            color: #00f0ff;
            font-weight: bold;
        }
        #status {
            font-size: 11px;
            color: #00f0ff;
            font-weight: 500;
        }
        .connecting { color: #ffd700; }
        .connected { color: #00f0ff; }
        .error { color: #ff007a; }
        .timeframe-selector {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            align-items: center;
        }
        .timeframe-btn {
            padding: 6px 11px;
            background: #2b2b43;
            border: 1px solid #3a3a52;
            color: #a0a0b0;
            cursor: pointer;
            border-radius: 3px;
            font-size: 11px;
            font-weight: 500;
            transition: all 0.2s ease;
            white-space: nowrap;
        }
        .timeframe-btn:hover {
            background: #3a3a52;
            border-color: #00f0ff;
        }
        .timeframe-btn.active {
            background: #00f0ff;
            color: #131722;
            border-color: #00f0ff;
            box-shadow: 0 0 10px rgba(0, 240, 255, 0.3);
        }
        .indicator-btn {
            padding: 6px 11px;
            background: #2b2b43;
            border: 1px solid #3a3a52;
            color: #a0a0b0;
            cursor: pointer;
            border-radius: 3px;
            font-size: 11px;
            font-weight: 500;
            transition: all 0.2s ease;
            white-space: nowrap;
        }
        .indicator-btn:hover {
            background: #3a3a52;
            border-color: #ff007a;
        }
        #chart-container { 
            width: 100vw; 
            height: calc(100vh - 80px);
            position: relative;
        }

        /* Modal Styles */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.7);
        }
        .modal.active { display: block; }
        .modal-content {
            background-color: #1c2030;
            margin: 10% auto;
            padding: 20px;
            border: 1px solid #2b2b43;
            width: 80%;
            max-width: 600px;
            border-radius: 8px;
            max-height: 80vh;
            overflow-y: auto;
            box-shadow: 0 0 30px rgba(0, 240, 255, 0.2);
        }
        .close {
            color: #a0a0b0;
            float: right;
            font-size: 28px;
            font-weight: bold;
            cursor: pointer;
        }
        .close:hover { color: #00f0ff; }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            color: #d1d4dc;
            font-size: 12px;
            font-weight: 500;
        }
        input, select, textarea {
            width: 100%;
            padding: 8px;
            background: #242835;
            border: 1px solid #3a3a52;
            color: #d1d4dc;
            border-radius: 4px;
            font-family: monospace;
            font-size: 12px;
        }
        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: #00f0ff;
            box-shadow: 0 0 10px rgba(0, 240, 255, 0.2);
        }
        .button-group {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }
        button {
            flex: 1;
            padding: 10px;
            background: #00f0ff;
            color: #131722;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            font-size: 12px;
            transition: all 0.2s ease;
        }
        button:hover {
            background: #00d4d4;
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.4);
        }
        .cancel-btn {
            background: #3a3a52;
            color: #d1d4dc;
        }
        .cancel-btn:hover {
            background: #4a4a62;
            box-shadow: none;
        }
        .indicator-list {
            margin-top: 10px;
            max-height: 200px;
            overflow-y: auto;
        }
        .indicator-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px;
            background: #242835;
            margin-bottom: 5px;
            border-radius: 3px;
            font-size: 11px;
        }
        .remove-indicator {
            background: #ff007a;
            color: white;
            border: none;
            padding: 4px 8px;
            border-radius: 2px;
            cursor: pointer;
            font-size: 10px;
        }
        .remove-indicator:hover {
            background: #ff3388;
        }
        .preset-indicators {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 10px;
        }
        .preset-btn {
            padding: 10px;
            background: #242835;
            border: 1px solid #3a3a52;
            color: #d1d4dc;
            cursor: pointer;
            border-radius: 4px;
            font-size: 11px;
            text-align: center;
            transition: all 0.2s ease;
        }
        .preset-btn:hover {
            background: #3a3a52;
            border-color: #00f0ff;
        }
    </style>
</head>
<body>
    <div id="header">
        <div class="title-section">
            <div>📊 Francis Terminal PRO - Macro Composite (USDT.D + TOTAL + TOTAL2)</div>
            <div id="status" class="connecting">● Connecting...</div>
        </div>
        <div class="data-display">
            <div class="data-item">
                <span class="data-label">USDT.D:</span>
                <span class="data-value" id="usdtValue">--</span>
            </div>
            <div class="data-item">
                <span class="data-label">TOTAL:</span>
                <span class="data-value" id="totalValue">--</span>
            </div>
            <div class="data-item">
                <span class="data-label">TOTAL2:</span>
                <span class="data-value" id="total2Value">--</span>
            </div>
        </div>
        <div class="timeframe-selector" id="timeframeSelector"></div>
        <button class="indicator-btn" onclick="openIndicatorModal()">➕ Add Indicator</button>
    </div>
    <div id="chart-container"></div>

    <!-- Custom Indicator Modal -->
    <div id="indicatorModal" class="modal">
        <div class="modal-content">
            <span class="close" onclick="closeIndicatorModal()">&times;</span>
            <h2 style="color: #00f0ff; margin-bottom: 20px;">Add Custom Indicator</h2>
            
            <div style="margin-bottom: 20px;">
                <h3 style="color: #d1d4dc; font-size: 13px; margin-bottom: 10px;">Quick Presets:</h3>
                <div class="preset-indicators">
                    <button class="preset-btn" onclick="addPresetIndicator('sma')">SMA</button>
                    <button class="preset-btn" onclick="addPresetIndicator('ema')">EMA</button>
                    <button class="preset-btn" onclick="addPresetIndicator('rsi')">RSI</button>
                    <button class="preset-btn" onclick="addPresetIndicator('macd')">MACD</button>
                    <button class="preset-btn" onclick="addPresetIndicator('bb')">Bollinger Bands</button>
                    <button class="preset-btn" onclick="addPresetIndicator('stoch')">Stochastic</button>
                </div>
            </div>

            <hr style="border: none; border-top: 1px solid #2b2b43; margin: 20px 0;">

            <h3 style="color: #d1d4dc; font-size: 13px; margin-bottom: 15px;">Custom Indicator Builder:</h3>

            <div class="form-group">
                <label>Indicator Name:</label>
                <input type="text" id="indicatorName" placeholder="e.g., My RSI">
            </div>

            <div class="form-group">
                <label>Indicator Type:</label>
                <select id="indicatorType">
                    <option value="line">Line Overlay</option>
                    <option value="histogram">Histogram</option>
                    <option value="bands">Upper/Lower Bands</option>
                </select>
            </div>

            <div class="form-group">
                <label>Formula (JavaScript):</label>
                <textarea id="indicatorFormula" placeholder="Example: closes.slice(-20).reduce((a,b)=>a+b)/20&#10;&#10;Available variables:&#10;- closes: array of close prices&#10;- opens: array of open prices&#10;- highs: array of high prices&#10;- lows: array of low prices&#10;- period: lookback period" style="height: 120px; font-family: monospace; font-size: 11px;"></textarea>
            </div>

            <div class="form-group">
                <label>Period (default 20):</label>
                <input type="number" id="indicatorPeriod" value="20" min="2" max="500">
            </div>

            <div class="form-group">
                <label>Color:</label>
                <select id="indicatorColor">
                    <option value="#00f0ff">Cyan</option>
                    <option value="#ff007a">Pink</option>
                    <option value="#ffd700">Gold</option>
                    <option value="#00ff00">Green</option>
                    <option value="#ff6b6b">Red</option>
                    <option value="#a0ff00">Lime</option>
                </select>
            </div>

            <div class="button-group">
                <button onclick="createCustomIndicator()">Add Indicator</button>
                <button class="cancel-btn" onclick="closeIndicatorModal()">Cancel</button>
            </div>

            <hr style="border: none; border-top: 1px solid #2b2b43; margin: 20px 0;">

            <div style="margin-top: 15px;">
                <h3 style="color: #d1d4dc; font-size: 13px; margin-bottom: 10px;">Active Indicators:</h3>
                <div class="indicator-list" id="activeIndicatorsList"></div>
            </div>
        </div>
    </div>

    <script>
        // Three macro indices
        const symbols = ['USDT.D', 'TOTAL', 'TOTAL2'];
        
        const timeframes = [
            { id: '1h', label: '1H', minutes: 60, interval: '1h', klineInterval: '1h' },
            { id: '2h', label: '2H', minutes: 120, interval: '2h', klineInterval: '2h' },
            { id: '4h', label: '4H', minutes: 240, interval: '4h', klineInterval: '4h' },
            { id: '6h', label: '6H', minutes: 360, interval: '6h', klineInterval: '6h' },
            { id: '12h', label: '12H', minutes: 720, interval: '12h', klineInterval: '12h' },
            { id: '1d', label: '1D', minutes: 1440, interval: '1d', klineInterval: '1d' },
            { id: '3d', label: '3D', minutes: 4320, interval: '3d', klineInterval: '1d', multiplier: 3 },
            { id: '1w', label: '1W', minutes: 10080, interval: '1w', klineInterval: '1d', multiplier: 7 }
        ];

        let currentTimeframe = '1d';
        let chart = null;
        let candleSeries = null;
        let candleData = [];
        let realtimeData = {};
        let ws = null;
        let indicators = [];
        let indicatorSeries = [];
        let isLoading = false;

        // Preset Indicators
        const presetIndicators = {
            sma: {
                name: 'SMA 20',
                type: 'line',
                formula: 'closes.slice(-period).reduce((a,b)=>a+b)/period',
                period: 20,
                color: '#00f0ff'
            },
            ema: {
                name: 'EMA 12',
                type: 'line',
                formula: 'emaCalc(closes, period)',
                period: 12,
                color: '#ffd700'
            },
            rsi: {
                name: 'RSI 14',
                type: 'line',
                formula: 'rsiCalc(closes, period)',
                period: 14,
                color: '#ff007a'
            },
            macd: {
                name: 'MACD',
                type: 'line',
                formula: 'macdCalc(closes)',
                period: 26,
                color: '#00ff00'
            },
            bb: {
                name: 'Bollinger Bands',
                type: 'bands',
                formula: 'bbCalc(closes, period)',
                period: 20,
                color: '#a0ff00'
            },
            stoch: {
                name: 'Stochastic',
                type: 'line',
                formula: 'stochCalc(closes, period)',
                period: 14,
                color: '#ff6b6b'
            }
        };

        // Modal functions
        function openIndicatorModal() {
            document.getElementById('indicatorModal').classList.add('active');
            updateActiveIndicatorsList();
        }

        function closeIndicatorModal() {
            document.getElementById('indicatorModal').classList.remove('active');
        }

        function updateActiveIndicatorsList() {
            const list = document.getElementById('activeIndicatorsList');
            list.innerHTML = '';
            indicators.forEach((ind, idx) => {
                const item = document.createElement('div');
                item.className = 'indicator-item';
                item.innerHTML = `
                    <div>
                        <span style="color: ${ind.color};">●</span> ${ind.name} (P${ind.period})
                    </div>
                    <button class="remove-indicator" onclick="removeIndicator(${idx})">Remove</button>
                `;
                list.appendChild(item);
            });
        }

        function addPresetIndicator(type) {
            const preset = presetIndicators[type];
            indicators.push({ ...preset, id: Date.now() });
            recalculateIndicators();
            updateActiveIndicatorsList();
        }

        function createCustomIndicator() {
            const name = document.getElementById('indicatorName').value;
            const type = document.getElementById('indicatorType').value;
            const formula = document.getElementById('indicatorFormula').value;
            const period = parseInt(document.getElementById('indicatorPeriod').value);
            const color = document.getElementById('indicatorColor').value;

            if (!name || !formula) {
                alert('❌ Please fill in indicator name and formula');
                return;
            }

            indicators.push({ name, type, formula, period, color, id: Date.now() });
            
            document.getElementById('indicatorName').value = '';
            document.getElementById('indicatorFormula').value = '';
            document.getElementById('indicatorPeriod').value = '20';

            recalculateIndicators();
            updateActiveIndicatorsList();
        }

        function removeIndicator(idx) {
            const removed = indicators.splice(idx, 1);
            indicatorSeries = indicatorSeries.filter(s => {
                if (s.indicator.id === removed[0].id) {
                    chart.removeSeries(s.series);
                    return false;
                }
                return true;
            });
            updateActiveIndicatorsList();
        }

        // Initialize Chart
        function initChart() {
            const container = document.getElementById('chart-container');
            chart = LightweightCharts.createChart(container, {
                width: window.innerWidth,
                height: window.innerHeight - 80,
                layout: { 
                    background: { type: 'solid', color: '#131722' }, 
                    textColor: '#d1d4dc' 
                },
                grid: { 
                    vertLines: { color: '#242835' }, 
                    horzLines: { color: '#242835' } 
                },
                crosshair: { mode: LightweightCharts.CrosshairMode.Normal },
                priceScale: { borderColor: '#2b2b43', autoScale: true },
                timeScale: { borderColor: '#2b2b43', timeVisible: true }
            });

            candleSeries = chart.addCandlestickSeries({
                upColor: '#00f0ff', 
                downColor: '#ff007a',
                borderUpColor: '#00f0ff', 
                borderDownColor: '#ff007a',
                wickUpColor: '#00f0ff', 
                wickDownColor: '#ff007a'
            });
        }

        // Indicator Calculations
        function emaCalc(data, period) {
            const k = 2 / (period + 1);
            let ema = data[0];
            for (let i = 1; i < data.length; i++) {
                ema = data[i] * k + ema * (1 - k);
            }
            return ema;
        }

        function rsiCalc(data, period) {
            let gains = 0, losses = 0;
            for (let i = 1; i < Math.min(period + 1, data.length); i++) {
                const diff = data[i] - data[i - 1];
                if (diff > 0) gains += diff;
                else losses -= diff;
            }
            gains /= period;
            losses /= period;
            const rs = gains / losses;
            return 100 - (100 / (1 + rs));
        }

        function macdCalc(data) {
            const ema12 = emaCalc(data, 12);
            const ema26 = emaCalc(data, 26);
            return ema12 - ema26;
        }

        function bbCalc(data, period) {
            const sma = data.slice(-period).reduce((a,b)=>a+b)/period;
            const variance = data.slice(-period).reduce((a,b)=>a+Math.pow(b-sma,2))/period;
            const stdDev = Math.sqrt(variance);
            return { upper: sma + 2*stdDev, lower: sma - 2*stdDev, middle: sma };
        }

        function stochCalc(data, period) {
            const low = Math.min(...data.slice(-period));
            const high = Math.max(...data.slice(-period));
            return ((data[data.length-1] - low) / (high - low)) * 100;
        }

        // Recalculate all indicators
        function recalculateIndicators() {
            indicatorSeries.forEach(s => chart.removeSeries(s.series));
            indicatorSeries = [];

            indicators.forEach(ind => {
                const seriesType = ind.type === 'line' ? 'addLineSeries' : 'addHistogramSeries';
                const series = chart[seriesType]({
                    color: ind.color,
                    lineWidth: 2,
                    title: ind.name
                });

                const data = [];
                candleData.forEach(candle => {
                    try {
                        const closes = candleData.map(c => c.close);
                        const opens = candleData.map(c => c.open);
                        const highs = candleData.map(c => c.high);
                        const lows = candleData.map(c => c.low);
                        const period = ind.period;

                        let value = eval(ind.formula);
                        
                        if (ind.type === 'bands' && value && value.middle) {
                            data.push({ time: candle.time, value: value.middle });
                        } else if (typeof value === 'number') {
                            data.push({ time: candle.time, value: value });
                        }
                    } catch (e) {
                        console.warn(`Indicator ${ind.name} calculation error:`, e);
                    }
                });

                series.setData(data);
                indicatorSeries.push({ series, indicator: ind });
            });
        }

        // Timeframe functions
        function initTimeframeSelector() {
            const selector = document.getElementById('timeframeSelector');
            timeframes.forEach(tf => {
                const btn = document.createElement('button');
                btn.className = 'timeframe-btn' + (tf.id === '1d' ? ' active' : '');
                btn.textContent = tf.label;
                btn.setAttribute('data-timeframe', tf.id);
                btn.onclick = () => switchTimeframe(tf.id);
                selector.appendChild(btn);
            });
        }

        async function switchTimeframe(timeframeId) {
            if (isLoading || currentTimeframe === timeframeId) return;
            
            isLoading = true;
            updateStatus(`Loading ${timeframeId}...`, 'connecting');
            
            currentTimeframe = timeframeId;
            
            // Update button styles
            document.querySelectorAll('.timeframe-btn').forEach(btn => {
                btn.classList.remove('active');
                if (btn.getAttribute('data-timeframe') === timeframeId) {
                    btn.classList.add('active');
                }
            });

            // Close old WebSocket
            if (ws) {
                ws.close();
                ws = null;
            }

            // Clear chart data
            candleData = [];
            realtimeData = {};
            candleSeries.setData([]);
            
            // Clear indicators
            indicatorSeries.forEach(s => chart.removeSeries(s.series));
            indicatorSeries = [];

            // Load new data
            await fetchHistoricalData(timeframeId);
            
            // Recalculate indicators for new timeframe
            if (indicators.length > 0) {
                recalculateIndicators();
            }
            
            // Initialize WebSocket for real-time updates
            initWebSocket(timeframeId);
            
            isLoading = false;
        }

        function getCandleLimit(timeframeId) {
            const tf = timeframes.find(t => t.id === timeframeId);
            if (['1h', '2h', '4h', '6h', '12h'].includes(timeframeId)) {
                return 500;
            } else if (timeframeId === '1d') {
                return 150;
            } else {
                return Math.ceil(150 / (tf?.multiplier || 1));
            }
        }

        async function fetchHistoricalData(timeframeId) {
            const tf = timeframes.find(t => t.id === timeframeId);
            const limit = getCandleLimit(timeframeId);

            try {
                const fetchPromises = symbols.map(sym => 
                    fetch(`https://api.binance.com/api/v3/klines?symbol=${sym}USDT&interval=${tf.klineInterval}&limit=${limit}`)
                        .then(res => res.ok ? res.json() : Promise.reject(`Failed: ${sym}`))
                        .catch(err => { console.error(err); return []; })
                );

                const allData = await Promise.all(fetchPromises);
                const minCandles = Math.min(...allData.filter(d => d.length).map(d => d.length));

                if (minCandles === 0) {
                    updateStatus('No data available', 'error');
                    isLoading = false;
                    return;
                }

                if (tf.multiplier && tf.multiplier > 1) {
                    const groupedData = [];
                    for (let i = 0; i < allData.length; i++) {
                        const grouped = [];
                        for (let j = 0; j < allData[i].length; j += tf.multiplier) {
                            grouped.push(allData[i].slice(j, j + tf.multiplier));
                        }
                        groupedData.push(grouped);
                    }

                    const groupedMinCandles = Math.min(...groupedData.map(d => d.length));
                    for (let t = 0; t < groupedMinCandles; t++) {
                        let logOpen = 0, logHigh = 0, logLow = 0, logClose = 0;
                        for (let i = 0; i < symbols.length; i++) {
                            const candleGroup = groupedData[i][t];
                            if (candleGroup.length === 0) continue;
                            
                            const openPrice = parseFloat(candleGroup[0][1]);
                            const highPrice = Math.max(...candleGroup.map(c => parseFloat(c[2])));
                            const lowPrice = Math.min(...candleGroup.map(c => parseFloat(c[3])));
                            const closePrice = parseFloat(candleGroup[candleGroup.length - 1][4]);

                            logOpen += Math.log(openPrice);
                            logHigh += Math.log(highPrice);
                            logLow += Math.log(lowPrice);
                            logClose += Math.log(closePrice);
                        }

                        candleData.push({
                            time: Math.floor(groupedData[0][t][groupedData[0][t].length - 1][6] / 1000),
                            open: Math.exp(logOpen / symbols.length),
                            high: Math.exp(logHigh / symbols.length),
                            low: Math.exp(logLow / symbols.length),
                            close: Math.exp(logClose / symbols.length)
                        });
                    }
                } else {
                    for (let t = 0; t < minCandles; t++) {
                        let logOpen = 0, logHigh = 0, logLow = 0, logClose = 0;
                        for (let i = 0; i < symbols.length; i++) {
                            const candle = allData[i][t];
                            if (!candle) continue;
                            logOpen += Math.log(parseFloat(candle[1]));
                            logHigh += Math.log(parseFloat(candle[2]));
                            logLow += Math.log(parseFloat(candle[3]));
                            logClose += Math.log(parseFloat(candle[4]));
                        }

                        candleData.push({
                            time: Math.floor(allData[0][t][0] / 1000),
                            open: Math.exp(logOpen / symbols.length),
                            high: Math.exp(logHigh / symbols.length),
                            low: Math.exp(logLow / symbols.length),
                            close: Math.exp(logClose / symbols.length)
                        });
                    }
                }

                candleSeries.setData(candleData);
                chart.timeScale().fitContent();
                updateStatus(`Loaded ${candleData.length} candles (${timeframeId})`, 'connected');

            } catch (error) {
                console.error('Error fetching data:', error);
                updateStatus('Error loading data', 'error');
            }
        }

        function initWebSocket(timeframeId) {
            const tf = timeframes.find(t => t.id === timeframeId);
            const wsInterval = (tf.multiplier && tf.multiplier > 1) ? '1d' : tf.klineInterval;
            const streams = symbols.map(sym => `${sym.toLowerCase()}usdt@kline_${wsInterval}`).join('/');

            ws = new WebSocket(`wss://stream.binance.com:9443/stream?streams=${streams}`);

            ws.onopen = () => {
                console.log(`✅ Connected to ${timeframeId}`);
                updateStatus(`Connected (${timeframeId})`, 'connected');
            };

            ws.onmessage = (event) => {
                const message = JSON.parse(event.data);
                const kline = message.data.k;
                const symbol = message.data.s;

                if (kline.x) {
                    const symbolKey = symbol.replace('usdt', '').toUpperCase();
                    realtimeData[symbolKey] = {
                        open: parseFloat(kline.o),
                        high: parseFloat(kline.h),
                        low: parseFloat(kline.l),
                        close: parseFloat(kline.c),
                        time: Math.floor(kline.T / 1000)
                    };

                    // Update live values
                    document.getElementById('usdtValue').textContent = realtimeData['USDT.D'] ? realtimeData['USDT.D'].close.toFixed(2) : '--';
                    document.getElementById('totalValue').textContent = realtimeData['TOTAL'] ? realtimeData['TOTAL'].close.toFixed(2) : '--';
                    document.getElementById('total2Value').textContent = realtimeData['TOTAL2'] ? realtimeData['TOTAL2'].close.toFixed(2) : '--';

                    const allSymbolsReady = symbols.every(sym => realtimeData[sym] && realtimeData[sym].time === realtimeData[symbols[0]].time);
                    if (allSymbolsReady) {
                        let logOpen = 0, logHigh = 0, logLow = 0, logClose = 0;
                        for (let i = 0; i < symbols.length; i++) {
                            const data = realtimeData[symbols[i]];
                            logOpen += Math.log(data.open);
                            logHigh += Math.log(data.high);
                            logLow += Math.log(data.low);
                            logClose += Math.log(data.close);
                        }

                        const compositeCandle = {
                            time: realtimeData[symbols[0]].time,
                            open: Math.exp(logOpen / symbols.length),
                            high: Math.exp(logHigh / symbols.length),
                            low: Math.exp(logLow / symbols.length),
                            close: Math.exp(logClose / symbols.length)
                        };

                        const existingIndex = candleData.findIndex(c => c.time === compositeCandle.time);
                        if (existingIndex !== -1) {
                            candleData[existingIndex] = compositeCandle;
                        } else {
                            candleData.push(compositeCandle);
                        }

                        candleSeries.update(compositeCandle);
                        
                        if (indicators.length > 0) {
                            recalculateIndicators();
                        }
                    }
                }
            };

            ws.onerror = (error) => {
                console.error('WebSocket error:', error);
                updateStatus('Connection Error', 'error');
            };

            ws.onclose = () => {
                console.log('WebSocket disconnected');
                if (currentTimeframe === timeframeId && !isLoading) {
                    updateStatus('Reconnecting...', 'connecting');
                    setTimeout(() => initWebSocket(timeframeId), 3000);
                }
            };
        }

        function updateStatus(text, classname) {
            const statusEl = document.getElementById('status');
            statusEl.textContent = `● ${text}`;
            statusEl.className = classname;
        }

        window.addEventListener('resize', () => {
            if (chart) chart.resize(window.innerWidth, window.innerHeight - 80);
        });

        window.addEventListener('DOMContentLoaded', () => {
            initChart();
            initTimeframeSelector();
            fetchHistoricalData('1d');
            initWebSocket('1d');
        });

        window.onclick = (event) => {
            const modal = document.getElementById('indicatorModal');
            if (event.target == modal) closeIndicatorModal();
        };
    </script>
</body>
</html>
