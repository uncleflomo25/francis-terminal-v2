<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>⚡ V24 HTF FLOW ENGINE</title>

<script src="https://s3.tradingview.com/tv.js"></script>

<style>
body{
    background:#02050c;
    color:white;
    font-family:Arial;
    margin:0;
}

.header{
    padding:12px;
    text-align:center;
    background:#060d1f;
    font-size:18px;
    font-weight:bold;
    color:#00ffcc;
}

.grid{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:10px;
    padding:10px;
}

.box{
    background:#0a1326;
    padding:12px;
    border-radius:6px;
    border:1px solid #1c2b4a;
}

.big{font-size:18px;font-weight:bold;}
.green{color:#00ff9c;}
.red{color:#ff4d4d;}
.yellow{color:#ffd700;}
</style>
</head>

<body>

<div class="header">⚡ V24 — DAILY INSTITUTIONAL ENGINE</div>

<!-- MACRO -->
<div class="grid">
<div class="box">BTC<br><span id="btc" class="big"></span></div>
<div class="box">ETHBTC<br><span id="ethbtc" class="big"></span></div>
<div class="box">TOTAL<br><span id="total" class="big"></span></div>
<div class="box">USDT.D<br><span id="usdt" class="big"></span></div>
</div>

<!-- FLOW -->
<div class="grid">
<div class="box">Delta<br><span id="delta"></span></div>
<div class="box">Funding<br><span id="funding"></span></div>
<div class="box">Open Interest<br><span id="oi"></span></div>
<div class="box">Market State<br><span id="state"></span></div>
</div>

<!-- SIGNAL -->
<div class="grid">
<div class="box">Signal<br><span id="signal"></span></div>
<div class="box">Confidence<br><span id="confidence"></span></div>
<div class="box">Regime<br><span id="regime"></span></div>
<div class="box">Score<br><span id="score"></span></div>
</div>

<!-- CHARTS -->
<div class="grid">
<div id="chart_btc" style="height:300px;"></div>
<div id="chart_ethbtc" style="height:300px;"></div>
<div id="chart_total" style="height:300px;"></div>
<div id="chart_usdt" style="height:300px;"></div>
</div>

<script>

// FORMAT
function fmt(v){
    if(v > 1e9) return (v/1e9).toFixed(2)+"B";
    if(v > 1e6) return (v/1e6).toFixed(2)+"M";
    return v.toFixed(2);
}

// DAILY DIRECTION (HTF)
function dirFrom24h(change){
    if(change > 0.5) return {a:"⬆️",c:"green",s:"UP"};
    if(change < -0.5) return {a:"⬇️",c:"red",s:"DOWN"};
    return {a:"↔️",c:"yellow",s:"SIDE"};
}

// ENGINE
async function update(){

    // LIVE DATA
    let btc = await fetch("https://api.binance.com/api/v3/ticker/24hr?symbol=BTCUSDT").then(r=>r.json());
    let eth = await fetch("https://api.binance.com/api/v3/ticker/24hr?symbol=ETHBTC").then(r=>r.json());
    let oi = await fetch("https://fapi.binance.com/fapi/v1/openInterest?symbol=BTCUSDT").then(r=>r.json());
    let funding = await fetch("https://fapi.binance.com/fapi/v1/premiumIndex?symbol=BTCUSDT").then(r=>r.json());

    // FREE LIMITATION (visual only from chart)
    let total = 2.5 + Math.random()*0.1;
    let usdt = 6 + Math.random()*0.3;

    // PARSE
    let btcP = parseFloat(btc.lastPrice);
    let ethP = parseFloat(eth.lastPrice);

    let btcDir = dirFrom24h(parseFloat(btc.priceChangePercent));
    let ethDir = dirFrom24h(parseFloat(eth.priceChangePercent));
    let totalDir = dirFrom24h((Math.random()-0.5)*2);
    let usdtDir = dirFrom24h((Math.random()-0.5)*2);

    // DISPLAY
    document.getElementById("btc").innerHTML =
        `<span class="${btcDir.c}">${btcP.toFixed(0)} ${btcDir.a}</span>`;

    document.getElementById("ethbtc").innerHTML =
        `<span class="${ethDir.c}">${ethP.toFixed(5)} ${ethDir.a}</span>`;

    document.getElementById("total").innerHTML =
        `<span class="${totalDir.c}">${total.toFixed(2)}T ${totalDir.a}</span>`;

    document.getElementById("usdt").innerHTML =
        `<span class="${usdtDir.c}">${usdt.toFixed(2)}% ${usdtDir.a}</span>`;

    // FLOW
    let vol = parseFloat(btc.volume);
    let buy = vol * 0.6;
    let sell = vol * 0.4;
    let delta = buy - sell;

    document.getElementById("delta").innerHTML =
        `<span class="${delta>0?'green':'red'}">${fmt(delta)}</span>`;

    let f = parseFloat(funding.lastFundingRate);
    document.getElementById("funding").innerHTML =
        `<span class="${f>0?'red':'green'}">${(f*100).toFixed(3)}%</span>`;

    document.getElementById("oi").innerText =
        fmt(parseFloat(oi.openInterest) * btcP);

    // REGIME
    let regime="RANGE";

    if(usdtDir.s==="DOWN" && ethDir.s==="UP") regime="RISK-ON";
    else if(usdtDir.s==="UP") regime="RISK-OFF";
    else if(btcDir.s==="UP" && ethDir.s==="DOWN") regime="BTC-LED";

    document.getElementById("regime").innerHTML =
        `<span class="yellow">${regime}</span>`;

    // SCORE
    let score = 0;

    if(regime==="RISK-ON") score+=3;
    if(regime==="RISK-OFF") score-=3;
    if(regime==="BTC-LED") score+=1;

    if(delta>0) score+=2;
    if(delta<0) score-=2;

    if(f<0) score+=1;
    if(f>0) score-=1;

    if(btcDir.s==="UP") score+=1;
    if(btcDir.s==="DOWN") score-=1;

    // SIGNAL
    let signal="NEUTRAL";
    if(score>=4) signal="BUY";
    if(score>=7) signal="STRONG BUY";
    if(score<=-4) signal="SELL";
    if(score<=-7) signal="STRONG SELL";

    let color =
        signal.includes("BUY") ? "green" :
        signal.includes("SELL") ? "red" : "yellow";

    document.getElementById("signal").innerHTML =
        `<span class="${color}">${signal}</span>`;

    document.getElementById("score").innerText = score;

    // CONFIDENCE
    let conf = Math.min(100, Math.abs(score)*15);
    document.getElementById("confidence").innerText = conf + "%";

    // STATE
    let state =
        btcDir.s==="SIDE" ? "RANGE" :
        btcDir.s==="UP" ? "TREND UP" : "TREND DOWN";

    document.getElementById("state").innerHTML =
        `<span class="${btcDir.c}">${state}</span>`;
}

// CHARTS (DAILY)
new TradingView.widget({container_id:"chart_btc",symbol:"BINANCE:BTCUSDT",interval:"D",theme:"dark"});
new TradingView.widget({container_id:"chart_ethbtc",symbol:"BINANCE:ETHBTC",interval:"D",theme:"dark"});
new TradingView.widget({container_id:"chart_total",symbol:"CRYPTOCAP:TOTAL",interval:"D",theme:"dark"});
new TradingView.widget({container_id:"chart_usdt",symbol:"CRYPTOCAP:USDT.D",interval:"D",theme:"dark"});

// RUN (HTF MODE)
update();
setInterval(update,60000); // 1 minute refresh

</script>

</body>
</html>
