<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>⚡ FRANCIS TERMINAL V5 REAL FLOW</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script src="https://s3.tradingview.com/tv.js"></script>

<style>
body{
    margin:0;
    background:#04060c;
    color:#fff;
    font-family:Arial;
}

/* HEADER */
.header{
    text-align:center;
    padding:12px;
    font-size:20px;
    background:#0a0f1f;
    border-bottom:1px solid #1c2b4a;
}

/* GRID */
.grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:10px;
    padding:10px;
}

.chart{
    height:300px;
    border:1px solid #13203a;
    border-radius:8px;
}

/* ELITE TABLE */
.panel{
    position:absolute;
    right:10px;
    top:70px;
    width:300px;
    padding:16px;
    background:#0a0f1f;
    border:1px solid #1c2b4a;
    border-radius:10px;
}

.line{
    display:flex;
    justify-content:space-between;
    margin:6px 0;
}

.green{color:#00ff9c;}
.red{color:#ff4d4d;}
.yellow{color:#ffd700;}
</style>
</head>

<body>

<div class="header">⚡ FRANCIS TERMINAL V5 — REAL FLOW ENGINE</div>

<div class="grid">
    <div id="c1" class="chart"></div>
    <div id="c2" class="chart"></div>
    <div id="c3" class="chart"></div>
    <div id="c4" class="chart"></div>
</div>

<div class="panel">
    <b>⚡ FLOW ENGINE</b><br><br>

    <div class="line">Spot Vol <span id="spotVol"></span></div>
    <div class="line">Perp Vol <span id="perpVol"></span></div>
    <div class="line">Open Interest <span id="oi"></span></div>
    <div class="line">Delta <span id="delta"></span></div>

    <hr>

    <div class="line">Market State <span id="state"></span></div>
</div>

<script>

/* ===== FORMAT ===== */
function fmt(v){
    if(v>1e9) return (v/1e9).toFixed(2)+"B";
    if(v>1e6) return (v/1e6).toFixed(2)+"M";
    return v.toFixed(0);
}

/* ===== FETCH ===== */
async function getSpot(){
    let r = await fetch("https://api.binance.com/api/v3/ticker/24hr?symbol=BTCUSDT");
    return await r.json();
}

async function getPerp(){
    let r = await fetch("https://fapi.binance.com/fapi/v1/ticker/24hr?symbol=BTCUSDT");
    return await r.json();
}

async function getOI(){
    let r = await fetch("https://fapi.binance.com/fapi/v1/openInterest?symbol=BTCUSDT");
    return await r.json();
}

/* ===== UPDATE ===== */
async function update(){

    let spot = await getSpot();
    let perp = await getPerp();
    let oi = await getOI();

    let spotVol = parseFloat(spot.quoteVolume);
    let perpVol = parseFloat(perp.quoteVolume);
    let openInt = parseFloat(oi.openInterest);

    // DELTA
    let delta = spotVol - perpVol;

    // DISPLAY
    document.getElementById("spotVol").innerText = fmt(spotVol);
    document.getElementById("perpVol").innerText = fmt(perpVol);
    document.getElementById("oi").innerText = fmt(openInt);

    let deltaText = fmt(Math.abs(delta));
    if(delta > 0){
        document.getElementById("delta").innerHTML = `<span class="green">+${deltaText}</span>`;
    }else{
        document.getElementById("delta").innerHTML = `<span class="red">-${deltaText}</span>`;
    }

    // ===== SIGNAL ENGINE =====
    let state = "SIDEWAYS";
    let color = "yellow";

    if(spotVol > perpVol && delta > 0){
        state = "SMART MONEY BUYING";
        color = "green";
    }
    else if(perpVol > spotVol && delta < 0){
        state = "SHORT PRESSURE";
        color = "red";
    }
    else if(openInt > 0 && perpVol > spotVol){
        state = "LEVERAGE BUILDING";
        color = "yellow";
    }

    document.getElementById("state").innerHTML =
        `<span class="${color}">${state}</span>`;
}

/* ===== CHARTS ===== */
new TradingView.widget({container_id:"c1",symbol:"CRYPTOCAP:USDT.D",interval:"15",theme:"dark"});
new TradingView.widget({container_id:"c2",symbol:"BINANCE:ETHBTC",interval:"15",theme:"dark"});
new TradingView.widget({container_id:"c3",symbol:"CRYPTOCAP:BTC.D",interval:"15",theme:"dark"});
new TradingView.widget({container_id:"c4",symbol:"CRYPTOCAP:TOTAL",interval:"15",theme:"dark"});

/* RUN */
update();
setInterval(update,5000);

</script>

</body>
</html>
