<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>⚡ FRANCIS TERMINAL V5</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script src="https://s3.tradingview.com/tv.js"></script>

<style>
body{
    margin:0;
    background:#04060c;
    color:#fff;
    font-family:Arial;
}

/* HEADER */
.header{
    text-align:center;
    padding:12px;
    font-size:20px;
    background:#0a0f1f;
    border-bottom:1px solid #1c2b4a;
}

/* TOP BAR */
.topbar{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:10px;
    padding:10px;
}

.box{
    background:#0a0f1f;
    border:1px solid #1c2b4a;
    border-radius:8px;
    padding:10px;
    text-align:center;
}

.symbol{
    font-size:13px;
    color:#aaa;
}

.value{
    font-size:16px;
    margin-top:4px;
}

.arrow{
    font-size:18px;
    margin-top:5px;
}

.green{color:#00ff9c;}
.red{color:#ff4d4d;}
.yellow{color:#ffd700;}

/* GRID */
.grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:10px;
    padding:10px;
}

.chart{
    height:320px;
    border:1px solid #13203a;
    border-radius:8px;
}
</style>
</head>

<body>

<div class="header">⚡ FRANCIS TERMINAL V5 — REAL FLOW ENGINE</div>

<!-- TOP STATUS -->
<div class="topbar">

    <div class="box">
        <div class="symbol">USDT.D</div>
        <div id="usdtVol" class="value"></div>
        <div id="usdtDir" class="arrow"></div>
    </div>

    <div class="box">
        <div class="symbol">ETHBTC</div>
        <div id="ethbtcVol" class="value"></div>
        <div id="ethbtcDir" class="arrow"></div>
    </div>

    <div class="box">
        <div class="symbol">BTC.D</div>
        <div id="btcdVol" class="value"></div>
        <div id="btcdDir" class="arrow"></div>
    </div>

    <div class="box">
        <div class="symbol">TOTAL</div>
        <div id="totalVol" class="value"></div>
        <div id="totalDir" class="arrow"></div>
    </div>

</div>

<!-- CHARTS -->
<div class="grid">
    <div id="c1" class="chart"></div>
    <div id="c2" class="chart"></div>
    <div id="c3" class="chart"></div>
    <div id="c4" class="chart"></div>
</div>

<script>

/* FORMAT */
function fmt(v){
    if(v>1e9) return (v/1e9).toFixed(2)+"B";
    if(v>1e6) return (v/1e6).toFixed(2)+"M";
    return v.toFixed(2);
}

/* DIRECTION LOGIC */
function direction(current, prev){
    let diff = current - prev;

    if(diff > 0){
        return `<span class="green">▲</span>`;
    }
    else if(diff < 0){
        return `<span class="red">▼</span>`;
    }
    else{
        return `<span class="yellow">▶</span>`;
    }
}

/* FETCH BINANCE (proxy for volume activity) */
async function getData(symbol){
    let r = await fetch(`https://api.binance.com/api/v3/klines?symbol=${symbol}&interval=15m&limit=2`);
    return await r.json();
}

/* UPDATE */
async function update(){

    let btc = await getData("BTCUSDT");
    let eth = await getData("ETHUSDT");

    let curr = parseFloat(btc[1][5]);
    let prev = parseFloat(btc[0][5]);

    let ethCurr = parseFloat(eth[1][5]);
    let ethPrev = parseFloat(eth[0][5]);

    /* Assign (approx logic for now) */
    document.getElementById("usdtVol").innerText = fmt(curr);
    document.getElementById("btcdVol").innerText = fmt(curr);
    document.getElementById("totalVol").innerText = fmt(curr);
    document.getElementById("ethbtcVol").innerText = fmt(ethCurr);

    document.getElementById("usdtDir").innerHTML = direction(curr, prev);
    document.getElementById("btcdDir").innerHTML = direction(curr, prev);
    document.getElementById("totalDir").innerHTML = direction(curr, prev);
    document.getElementById("ethbtcDir").innerHTML = direction(ethCurr, ethPrev);
}

/* CHARTS */
new TradingView.widget({container_id:"c1",symbol:"CRYPTOCAP:USDT.D",interval:"15",theme:"dark"});
new TradingView.widget({container_id:"c2",symbol:"BINANCE:ETHBTC",interval:"15",theme:"dark"});
new TradingView.widget({container_id:"c3",symbol:"CRYPTOCAP:BTC.D",interval:"15",theme:"dark"});
new TradingView.widget({container_id:"c4",symbol:"CRYPTOCAP:TOTAL",interval:"15",theme:"dark"});

/* RUN */
update();
setInterval(update,5000);

</script>

</body>
</html>
