<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Francis Terminal PRO - 12-Asset Composite Chart</title>
    <!-- TradingView Lightweight Charts Stable Engine -->
    <script src="https://unpkg.com"></script>
    <style>
        body { margin: 0; padding: 0; background-color: #131722; font-family: sans-serif; overflow: hidden; }
        #chart-container { width: 100vw; height: 92vh; }
        #header { color: #ffffff; padding: 15px; font-size: 16px; font-weight: bold; background: #1c2030; border-bottom: 1px solid #2b2b43; }
    </style>
</head>
<body>
    <div id="header">📊 Francis Terminal PRO - Pure 12-Asset Composite Index (Indicator-Free)</div>
    <div id="chart-container"></div>

    <script>
        const symbols = ['BTCUSDT', 'ETHUSDT', 'SOLUSDT', 'XRPUSDT', 'BNBUSDT', 'DOGEUSDT', 'ADAUSDT', 'SUIUSDT', 'LINKUSDT', 'AVAXUSDT', 'PEPEUSDT', 'BCHUSDT'];
        
        // 1. Initialize Interactive Canvas
        const chart = LightweightCharts.createChart(document.getElementById('chart-container'), {
            width: window.innerWidth,
            height: window.innerHeight * 0.92,
            layout: { background: { type: 'solid', color: '#131722' }, textColor: '#d1d4dc' },
            grid: { vertLines: { color: '#242835' }, horzLines: { color: '#242835' } },
            crosshair: { mode: LightweightCharts.CrosshairMode.Normal },
            priceScale: { borderColor: '#2b2b43', autoScale: true },
            timeScale: { borderColor: '#2b2b43', timeVisible: true }
        });

        // 2. Set Structural Candle Profiles
        const candleSeries = chart.addCandlestickSeries({
            upColor: '#00f0ff', downColor: '#ff007a',
            borderUpColor: '#00f0ff', borderDownColor: '#ff007a',
            wickUpColor: '#00f0ff', wickDownColor: '#ff007a'
        });

        // 3. Execution Data Pipeline
        async function fetchCompositeData() {
            try {
                const fetchPromises = symbols.map(sym => 
                    fetch(`https://binance.com{sym}&interval=1d&limit=150`)
                        .then(res => {
                            if (!res.ok) throw new Error(`API Connection Failed for ${sym}`);
                            return res.json();
                        })
                );

                const allData = await Promise.all(fetchPromises);
                const formattedData = [];
                
                // Find the exact maximum available overlapping candles across all arrays
                const minAvailableCandles = Math.min(...allData.map(d => d.length));

                // 4. Mathematical Reconstruction Loop
                for (let t = 0; t < minAvailableCandles; t++) {
                    // Extract safe epoch timestamp from the first asset (BTCUSDT)
                    let timestampSeconds = Math.floor(allData[0][t][0] / 1000); 
                    
                    let logOpen = 0, logHigh = 0, logLow = 0, logClose = 0;

                    // Accumulate log values to apply pure Geometric Mean logic safely
                    for (let i = 0; i < symbols.length; i++) {
                        const candle = allData[i][t];
                        logOpen  += Math.log(parseFloat(candle[1])); // 1 = Open Price
                        logHigh  += Math.log(parseFloat(candle[2])); // 2 = High Price
                        logLow   += Math.log(parseFloat(candle[3])); // 3 = Low Price
                        logClose += Math.log(parseFloat(candle[4])); // 4 = Close Price
                    }

                    // Push completed structural geometric OHLC bar
                    formattedData.push({
                        time: timestampSeconds,
                        open:  Math.exp(logOpen / symbols.length),
                        high:  Math.exp(logHigh / symbols.length),
                        low:   Math.exp(logLow / symbols.length),
                        close: Math.exp(logClose / symbols.length)
                    });
                }

                // 5. Commit coordinates directly to structural chart layout
                candleSeries.setData(formattedData);
                chart.timeScale().fitContent();

            } catch (error) {
                console.error("Pipeline Execution Crash: ", error);
                document.getElementById('header').innerText = `⚠️ Connection Error: Failed to compile index data from Binance API. Check browser console.`;
            }
        }

        fetchCompositeData();

        // Keep view responsive
        window.addEventListener('resize', () => {
            chart.resize(window.innerWidth, window.innerHeight * 0.92);
        });
    </script>
</body>
</html>
