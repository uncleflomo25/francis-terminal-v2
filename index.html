<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Composite Crypto Footprint V2 - LIVE DATA</title>
<style>
body{
  margin:0;
  font-family:Arial, sans-serif;
  background:#05070d;
  color:#e5e7eb;
}
header{
  padding:10px 14px;
  border-bottom:1px solid #1f2937;
  display:flex;
  justify-content:space-between;
  align-items:center;
}
.title{font-weight:700;font-size:14px;letter-spacing:1px}
.sub{font-size:12px;color:#9ca3af}

.container{
  display:grid;
  grid-template-columns: 260px 1fr 260px;
  height:calc(100vh - 90px);
}

.panel{
  border-right:1px solid #1f2937;
  padding:10px;
  overflow:auto;
}

.center{
  display:flex;
  flex-direction:column;
}

.topbar{
  display:grid;
  grid-template-columns: repeat(4, 1fr);
  gap:10px;
  padding:10px;
  border-bottom:1px solid #1f2937;
}

.card{
  background:#0b1220;
  padding:10px;
  border-radius:6px;
  font-size:12px;
}
.green{color:#22c55e}
.red{color:#ef4444}
.gray{color:#9ca3af}

.tfbar{
  display:flex;
  gap:8px;
  padding:8px 10px;
  border-bottom:1px solid #1f2937;
  flex-wrap:wrap;
}
.tfbtn{
  padding:5px 10px;
  font-size:11px;
  border-radius:4px;
  cursor:pointer;
  background:#111827;
  border:1px solid #1f2937;
  color:#9ca3af;
}
.tfbtn.active{
  border-color:#22c55e;
  color:#22c55e;
  background:rgba(34,197,94,0.1);
}

.grid{
  flex:1;
  display:grid;
  grid-template-columns: repeat(8, 1fr);
  gap:6px;
  padding:10px;
  overflow:auto;
}

.cell{
  height:28px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:11px;
  border-radius:4px;
  background:#111827;
  border:1px solid #1f2937;
}

.buy{background:rgba(34,197,94,0.25);border-color:#22c55e}
.sell{background:rgba(239,68,68,0.25);border-color:#ef4444}
.neutral{background:#111827}

.footer{
  padding:8px;
  border-top:1px solid #1f2937;
  display:flex;
  justify-content:space-between;
  font-size:11px;
}

.small{font-size:11px;color:#9ca3af}

</style>
</head>
<body>

<header>
  <div>
    <div class="title">COMPOSITE CRYPTO FOOTPRINT V2</div>
    <div class="sub">REAL-TIME BINANCE + LIVE MARKET STREAM ENGINE</div>
  </div>
  <div class="small" id="connStatus">CONNECTING...</div>
</header>

<div class="container">

  <div class="panel">
    <div class="card">
      <b>COMPOSITE BIAS</b><br/>
      <span class="gray" id="bias">LOADING...</span>
      <div class="small" id="score">Score: --</div>
      <div class="small" id="delta">Delta: --</div>
    </div>
  </div>

  <div class="center">

    <div class="topbar">
      <div class="card" id="btc">BTC: --</div>
      <div class="card" id="eth">ETH: --</div>
      <div class="card" id="usdt">USDT.D: --</div>
      <div class="card" id="btcd">BTC.D: --</div>
    </div>

    <div class="tfbar">
      <div class="tfbtn active" data-tf="1">M1</div>
      <div class="tfbtn" data-tf="5">M5</div>
      <div class="tfbtn" data-tf="15">M15</div>
      <div class="tfbtn" data-tf="60">H1</div>
      <div class="tfbtn" data-tf="360">H6</div>
      <div class="tfbtn" data-tf="720">H12</div>
      <div class="tfbtn" data-tf="D">D1</div>
      <div class="tfbtn" data-tf="W">W1</div>
    </div>

    <div class="grid" id="grid"></div>

    <div class="footer">
      <div id="flow">FLOW: --</div>
      <div id="pressure">WAITING DATA...</div>
    </div>

  </div>

  <div class="panel">
    <div class="card">
      <b>LIVE ENGINE</b><br/>
      Binance WebSocket: <span id="ws">OFF</span><br/>
      Feed: Trades + Ticker
    </div>
  </div>

</div>

<script>
const grid = document.getElementById('grid');
let ws;
let tradeBuffer = [];
let currentTF = 1;

function connectWS(){
  ws = new WebSocket("wss://stream.binance.com:9443/ws/btcusdt@trade");

  ws.onopen = () => {
    document.getElementById("ws").textContent = "LIVE";
    document.getElementById("connStatus").textContent = "CONNECTED";
  };

  ws.onmessage = (event) => {
    const data = JSON.parse(event.data);

    tradeBuffer.push({
      price: parseFloat(data.p),
      qty: parseFloat(data.q),
      side: data.m ? "sell" : "buy"
    });

    if(tradeBuffer.length > 200) tradeBuffer.shift();

    updateFootprint();
  };

  ws.onclose = () => {
    document.getElementById("ws").textContent = "RECONNECTING...";
    setTimeout(connectWS, 2000);
  };
}

function updateFootprint(){
  grid.innerHTML = "";

  let buy = 0;
  let sell = 0;

  tradeBuffer.forEach(t => {
    if(t.side === "buy") buy += t.qty;
    else sell += t.qty;

    const cell = document.createElement("div");
    cell.className = "cell " + (t.side === "buy" ? "buy" : "sell");
    cell.textContent = t.qty.toFixed(2);
    grid.appendChild(cell);
  });

  const delta = buy - sell;

  document.getElementById("flow").textContent = "FLOW: " + delta.toFixed(2);

  if(delta > 0){
    document.getElementById("pressure").textContent = "BUY PRESSURE";
    document.getElementById("pressure").className = "green";
    document.getElementById("bias").textContent = "BULLISH";
    document.getElementById("bias").className = "green";
  } else {
    document.getElementById("pressure").textContent = "SELL PRESSURE";
    document.getElementById("pressure").className = "red";
    document.getElementById("bias").textContent = "BEARISH";
    document.getElementById("bias").className = "red";
  }

  document.getElementById("score").textContent = "Score: " + Math.round(Math.abs(delta) / 10);
}

function fakeMarketData(){
  // placeholder for BTC/ETH/DOMINANCE APIs
  document.getElementById("btc").textContent = "BTC: live";
  document.getElementById("eth").textContent = "ETH: live";
  document.getElementById("usdt").textContent = "USDT.D: sync";
  document.getElementById("btcd").textContent = "BTC.D: sync";
}

fakeMarketData();
connectWS();
</script>

</body>
</html>
