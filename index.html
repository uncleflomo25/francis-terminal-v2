<script>

// =============================
// ⚡ REAL ENGINE CORE (V12)
// =============================

// SIMPLE TREND (HTF bias)
function trend(series){
    return series[series.length-1] > series[series.length-5] ? 1 : -1;
}

// MOCK REAL DATA (replace with API later)
let data = {
    usdt:[7.2,7.3,7.4,7.35,7.28],
    btc:[58,58.5,59,60,60.5],
    ethbtc:[0.031,0.0305,0.0302,0.0308,0.0312],
    total:[2.5,2.55,2.6,2.58,2.61]
};

// =============================
// ⚡ SIGNALS
// =============================
let s_usdt = trend(data.usdt) * -1;     // falling = bullish
let s_btc  = trend(data.btc);
let s_eth  = trend(data.ethbtc);
let s_tot  = trend(data.total);

// =============================
// ⚡ ADAPTIVE WEIGHTS
// =============================
let weights = {
    usdt:0.35,
    btc:0.25,
    eth:0.25,
    total:0.15
};

// =============================
// ⚡ SCORE ENGINE
// =============================
let score =
    s_usdt * weights.usdt +
    s_btc  * weights.btc +
    s_eth  * weights.eth +
    s_tot  * weights.total;

// =============================
// ⚡ CLASSIFICATION
// =============================
function classify(score){
    if(score > 0.6) return "🚀 STRONG BULL";
    if(score > 0.2) return "🟢 BULL";
    if(score > -0.2) return "⚪ NEUTRAL";
    if(score > -0.6) return "🔴 BEAR";
    return "💀 STRONG BEAR";
}

let state = classify(score);

// =============================
// ⚡ UI UPDATE
// =============================
function update(){

    // CLASS BOX
    document.getElementById("riskOn").style.opacity = (s_usdt>0 && s_eth>0) ? "1" : "0.3";
    document.getElementById("riskOff").style.opacity = (s_usdt<0) ? "1" : "0.3";
    document.getElementById("btcLed").style.opacity = (s_btc>0 && s_eth<0) ? "1" : "0.3";

    // TABLE STATES
    document.getElementById("usdtState").innerHTML = s_usdt>0 ? "RISK-ON" : "RISK-OFF";
    document.getElementById("btcState").innerHTML  = s_btc>0 ? "BTC-UP" : "BTC-DOWN";
    document.getElementById("ethState").innerHTML  = s_eth>0 ? "ALT-STRENGTH" : "ALT-WEAK";
    document.getElementById("totalState").innerHTML= s_tot>0 ? "EXPANSION" : "CONTRACTION";

    // VALUES
    document.getElementById("usdtVal").innerText = data.usdt.at(-1)+"%";
    document.getElementById("btcVal").innerText  = data.btc.at(-1)+"%";
    document.getElementById("ethVal").innerText  = data.ethbtc.at(-1);
    document.getElementById("totalVal").innerText= data.total.at(-1)+"T";

    // DIRECTION
    document.getElementById("usdtDir").innerText = s_usdt>0 ? "↓" : "↑";
    document.getElementById("btcDir").innerText  = s_btc>0 ? "↑" : "↓";
    document.getElementById("ethDir").innerText  = s_eth>0 ? "↑" : "↓";
    document.getElementById("totalDir").innerText= s_tot>0 ? "↑" : "↓";

    // ENGINE OUTPUT (MAIN THING)
    document.querySelector(".header").innerHTML =
        "⚡ V12 ENGINE — " + state + " (Score: " + score.toFixed(2) + ")";
}

// =============================
// ⚡ TRADINGVIEW CHARTS
// =============================
new TradingView.widget({
    container_id:"chart_total",
    symbol:"CRYPTOCAP:TOTAL",
    interval:"D",
    theme:"dark",
    autosize:true
});

new TradingView.widget({
    container_id:"chart_usdt",
    symbol:"CRYPTOCAP:USDT.D",
    interval:"D",
    theme:"dark",
    autosize:true
});

new TradingView.widget({
    container_id:"chart_ethbtc",
    symbol:"BINANCE:ETHBTC",
    interval:"D",
    theme:"dark",
    autosize:true
});

new TradingView.widget({
    container_id:"chart_btc",
    symbol:"CRYPTOCAP:BTC.D",
    interval:"D",
    theme:"dark",
    autosize:true
});

update();

</script>
