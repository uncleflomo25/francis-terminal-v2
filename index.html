<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>⚡ FRANCIS TERMINAL V9.5</title>
<script src="https://s3.tradingview.com/tv.js"></script>

<style>
body{
    margin:0;
    background:#020409;
    color:#fff;
    font-family:Arial;
}

/* HEADER */
.header{
    text-align:center;
    padding:12px;
    font-size:20px;
    background:#050b18;
    border-bottom:1px solid #13203a;
}

/* TOP BAR */
.topbar{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:10px;
    padding:10px;
}

.box{
    background:#070f1f;
    border:1px solid #13203a;
    border-radius:8px;
    padding:10px;
    text-align:center;
}

.price{
    font-size:16px;
    margin-top:4px;
}

.vol{
    font-size:12px;
    opacity:0.7;
}

.green{color:#00ff9c;}
.red{color:#ff4d4d;}
.yellow{color:#ffd700;}

/* MAIN GRID */
.main{
    display:grid;
    grid-template-columns:3fr 1.2fr;
    grid-template-rows:400px 300px;
    gap:10px;
    padding:10px;
}

.chart{
    width:100%;
    height:100%;
    border:1px solid #13203a;
    border-radius:8px;
}

.panel{
    background:#070f1f;
    border:1px solid #13203a;
    border-radius:8px;
    padding:12px;
}
</style>
</head>

<body>

<div class="header">⚡ FRANCIS TERMINAL V9.5 — FLOW</div>

<!-- TOP BAR -->
<div class="topbar">

    <div class="box">
        USDT.D
        <div id="usdt_price" class="price"></div>
        <div id="usdt_vol" class="vol"></div>
    </div>

    <div class="box">
        ETHBTC
        <div id="ethbtc_price" class="price"></div>
        <div id="ethbtc_vol" class="vol"></div>
    </div>

    <div class="box">
        BTC.D
        <div id="btcd_price" class="price"></div>
        <div id="btcd_vol" class="vol"></div>
    </div>

    <div class="box">
        TOTAL
        <div id="total_price" class="price"></div>
        <div id="total_vol" class="vol"></div>
    </div>

</div>

<!-- MAIN -->
<div class="main">

    <div id="total_chart" class="chart"></div>

    <div class="panel">
        <b>⚡ ENGINE</b><br><br>
        Market State: <span class="green">BTC TREND</span>
    </div>

    <div id="usdt_chart" class="chart"></div>

    <div style="display:grid;grid-template-rows:1fr 1fr;gap:10px;">
        <div id="ethbtc_chart" class="chart"></div>
        <div id="btcd_chart" class="chart"></div>
    </div>

</div>

<script>

/* FORMAT */
function fmt(v){
    if(v>1e12) return (v/1e12).toFixed(2)+"T";
    if(v>1e9) return (v/1e9).toFixed(2)+"B";
    if(v>1e6) return (v/1e6).toFixed(2)+"M";
    return v.toFixed(2);
}

/* FAKE DATA SIMULATION (replace with real API later) */
function randomUpdate(id_price, id_vol){
    let price = Math.random()*100;
    let vol = Math.random()*1e10;

    let el = document.getElementById(id_price);
    let color = price > 50 ? "green" : "red";

    el.innerHTML = `<span class="${color}">${price.toFixed(2)}</span>`;
    document.getElementById(id_vol).innerText = "Vol: " + fmt(vol);
}

/* UPDATE LOOP */
function update(){
    randomUpdate("usdt_price","usdt_vol");
    randomUpdate("ethbtc_price","ethbtc_vol");
    randomUpdate("btcd_price","btcd_vol");
    randomUpdate("total_price","total_vol");
}

setInterval(update,2000);
update();

/* CHARTS */
new TradingView.widget({container_id:"total_chart",symbol:"CRYPTOCAP:TOTAL",interval:"15",theme:"dark",autosize:true});
new TradingView.widget({container_id:"usdt_chart",symbol:"CRYPTOCAP:USDT.D",interval:"15",theme:"dark",autosize:true});
new TradingView.widget({container_id:"ethbtc_chart",symbol:"BINANCE:ETHBTC",interval:"15",theme:"dark",autosize:true});
new TradingView.widget({container_id:"btcd_chart",symbol:"CRYPTOCAP:BTC.D",interval:"15",theme:"dark",autosize:true});

</script>

</body>
</html>
