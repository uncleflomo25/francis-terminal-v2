<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>FLOW TERMINAL V9000</title>

<style>
body{margin:0;background:#020c18;color:#9fd3ff;font-family:Segoe UI}
.wrap{display:grid;grid-template-columns:260px 1fr 260px;height:100vh}
.panel{border:1px solid #0c2d4f;margin:5px;padding:10px;border-radius:8px;background:#031426}
.title{font-size:11px;color:#5fbfff;margin-bottom:6px}
.big{font-size:28px;font-weight:800}
.green{color:#00ff9c}.red{color:#ff4d6d}
canvas{width:100%;height:100%}
.center{display:flex;flex-direction:column}
.chartWrap{flex:1}
.feed{font-size:10px;height:200px;overflow:auto}
</style>
</head>

<body>

<div class="wrap">

<!-- LEFT -->
<div>
<div class="panel">
<div class="title">AI REGIME ENGINE</div>
<div id="reg" class="big green">SYNC</div>
<div id="conf">Confidence: --</div>
<div id="bias">Bias: --</div>
</div>

<div class="panel">
<div class="title">DOMINANCE MATRIX</div>
<div id="dom"></div>
</div>

<div class="panel">
<div class="title">ORDERFLOW CORE</div>
<div id="of"></div>
</div>
</div>

<!-- CENTER -->
<div class="center">
<div class="panel chartWrap">
<canvas id="chart"></canvas>
</div>
</div>

<!-- RIGHT -->
<div>
<div class="panel">
<div class="title">AI PROBABILITY</div>
<div id="prob"></div>
</div>

<div class="panel">
<div class="title">LIVE FEED</div>
<div id="feed" class="feed"></div>
</div>

<div class="panel">
<div class="title">SYSTEM</div>
<div>Mode: LIVE</div>
<div id="lat">Latency: 0ms</div>
</div>
</div>

</div>

<script>
// ===== CHART =====
const c=document.getElementById("chart");
const ctx=c.getContext("2d");

function resize(){
c.width=c.clientWidth;
c.height=c.clientHeight;
}
resize(); window.onresize=resize;

let candles=[];

function ema(arr,len){
let k=2/(len+1);
let e=[];
arr.forEach((v,i)=>{
e[i]=i? v*k+e[i-1]*(1-k):v;
});
return e;
}

function draw(){
ctx.clearRect(0,0,c.width,c.height);
if(candles.length<2)return;

let max=Math.max(...candles.map(x=>x.h));
let min=Math.min(...candles.map(x=>x.l));
let w=c.width/candles.length;

candles.forEach((d,i)=>{
let x=i*w;

let yO=c.height-(d.o-min)/(max-min)*c.height;
let yC=c.height-(d.c-min)/(max-min)*c.height;
let yH=c.height-(d.h-min)/(max-min)*c.height;
let yL=c.height-(d.l-min)/(max-min)*c.height;

let col=d.c>=d.o?"#00ff9c":"#ff4d6d";

ctx.strokeStyle=col;
ctx.beginPath();
ctx.moveTo(x+w/2,yH);
ctx.lineTo(x+w/2,yL);
ctx.stroke();

ctx.fillStyle=col;
ctx.fillRect(x+1,Math.min(yO,yC),w-2,Math.abs(yO-yC));
});

// EMA
let closes=candles.map(x=>x.c);
let e=ema(closes,20);

ctx.strokeStyle="#3aa0ff";
ctx.beginPath();
e.forEach((v,i)=>{
let x=i*w;
let y=c.height-(v-min)/(max-min)*c.height;
i?ctx.lineTo(x,y):ctx.moveTo(x,y);
});
ctx.stroke();
}

// ===== FLOW ENGINE =====
function updateFlow(){
if(candles.length<2)return;

let last=candles.at(-1).c;
let prev=candles.at(-2).c;

let ch=((last-prev)/prev)*100;

let reg="SIDE";
let bias="NEUTRAL";
let conf=Math.abs(ch*10);

if(ch>0.2){reg="BULL";bias="LONG";}
if(ch<-0.2){reg="BEAR";bias="SHORT";}

document.getElementById("reg").innerText=reg;
document.getElementById("bias").innerText="Bias: "+bias;
document.getElementById("conf").innerText="Confidence: "+conf.toFixed(0)+"%";

document.getElementById("prob").innerHTML=
`Bull ${Math.max(conf,50)}%<br>Bear ${100-conf}%`;

document.getElementById("of").innerHTML=
`Delta: ${(ch*10000).toFixed(0)}`;

document.getElementById("dom").innerHTML=
`BTC.D ~ ${(58+ch).toFixed(2)}%<br>
ETH.D ~ ${(10+ch/2).toFixed(2)}%<br>
USDT.D ~ ${(7-ch/3).toFixed(2)}%`;

logFeed(reg+" move");
}

// ===== FEED =====
function logFeed(x){
let f=document.getElementById("feed");
f.innerHTML=`<div>${new Date().toLocaleTimeString()} | ${x}</div>`+f.innerHTML;
}

// ===== HISTORY =====
async function load(){
let r=await fetch("https://api.binance.com/api/v3/klines?symbol=ETHUSDT&interval=1m&limit=120");
let d=await r.json();

candles=d.map(k=>({
t:k[0],o:+k[1],h:+k[2],l:+k[3],c:+k[4]
}));

draw();
}

// ===== WEBSOCKET =====
let ws=new WebSocket("wss://stream.binance.com:9443/ws/ethusdt@kline_1m");

ws.onmessage=e=>{
let m=JSON.parse(e.data);
let k=m.k;

let cdl={
t:k.t,o:+k.o,h:+k.h,l:+k.l,c:+k.c
};

if(candles.length && candles.at(-1).t===cdl.t){
candles[candles.length-1]=cdl;
}else{
candles.push(cdl);
if(candles.length>120)candles.shift();
}

draw();
updateFlow();
};

// START
load();
</script>

</body>
</html>
