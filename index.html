<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>⚡ FRANCIS TERMINAL V6 — ULTRA ENGINE</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script src="https://s3.tradingview.com/tv.js"></script>

<style>
body{
    margin:0;
    background:linear-gradient(180deg,#02030a,#050814,#02030a);
    color:#fff;
    font-family:Arial;
}

/* HEADER */
.header{
    text-align:center;
    padding:14px;
    font-size:20px;
    background:#050a18;
    border-bottom:1px solid #1f2d50;
}

/* TOP PANEL */
.top{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:10px;
    padding:10px;
}

.box{
    background:#060d1f;
    border:1px solid #1f2d50;
    border-radius:10px;
    padding:12px;
    text-align:center;
    box-shadow:0 0 10px rgba(0,150,255,0.05);
}

.symbol{
    font-size:13px;
    color:#aaa;
}

.price{
    font-size:18px;
    margin-top:5px;
}

.vol{
    font-size:12px;
    color:#888;
}

.arrow{
    font-size:18px;
    margin-top:5px;
}

/* COLORS */
.green{color:#00ff9c;}
.red{color:#ff4d4d;}
.yellow{color:#ffd700;}

/* GRID */
.grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:10px;
    padding:10px;
}

.chart{
    height:300px;
    border:1px solid #13203a;
    border-radius:8px;
}
</style>
</head>

<body>

<div class="header">⚡ FRANCIS TERMINAL V6 — ULTRA FLOW ENGINE</div>

<!-- TOP PANEL -->
<div class="top">
    <div class="box">
        <div class="symbol">USDT.D</div>
        <div class="price" id="p1">-</div>
        <div class="arrow" id="a1"></div>
        <div class="vol" id="v1"></div>
    </div>

    <div class="box">
        <div class="symbol">ETHBTC</div>
        <div class="price" id="p2">-</div>
        <div class="arrow" id="a2"></div>
        <div class="vol" id="v2"></div>
    </div>

    <div class="box">
        <div class="symbol">BTC.D</div>
        <div class="price" id="p3">-</div>
        <div class="arrow" id="a3"></div>
        <div class="vol" id="v3"></div>
    </div>

    <div class="box">
        <div class="symbol">TOTAL</div>
        <div class="price" id="p4">-</div>
        <div class="arrow" id="a4"></div>
        <div class="vol" id="v4"></div>
    </div>
</div>

<!-- CHART GRID -->
<div class="grid">
    <div id="c1" class="chart"></div>
    <div id="c2" class="chart"></div>
    <div id="c3" class="chart"></div>
    <div id="c4" class="chart"></div>
</div>

<script>

/* ===== FORMAT ===== */
function fmt(v){
    if(v>1e9) return (v/1e9).toFixed(2)+"B";
    if(v>1e6) return (v/1e6).toFixed(2)+"M";
    return v.toFixed(2);
}

/* ===== ARROW ENGINE (SMART) ===== */
function getSignal(change){
    if(change > 0.4) return {arrow:"▲", cls:"green"};
    if(change < -0.4) return {arrow:"▼", cls:"red"};
    return {arrow:"➜", cls:"yellow"};
}

/* ===== BINANCE DATA ===== */
async function getBTC(){
    let r = await fetch("https://api.binance.com/api/v3/ticker/24hr?symbol=BTCUSDT");
    return await r.json();
}

async function getETHBTC(){
    let r = await fetch("https://api.binance.com/api/v3/ticker/24hr?symbol=ETHBTC");
    return await r.json();
}

/* ===== UPDATE ENGINE ===== */
async function update(){

    let btc = await getBTC();
    let ethbtc = await getETHBTC();

    let btcChange = parseFloat(btc.priceChangePercent);
    let ethbtcChange = parseFloat(ethbtc.priceChangePercent);

    let btcVol = parseFloat(btc.quoteVolume);
    let ethbtcVol = parseFloat(ethbtc.volume);

    /* ===== APPLY ===== */

    // ETHBTC
    let s2 = getSignal(ethbtcChange);
    document.getElementById("p2").innerText = ethbtc.lastPrice;
    document.getElementById("a2").innerHTML = `<span class="${s2.cls}">${s2.arrow}</span>`;
    document.getElementById("v2").innerText = "Vol: " + fmt(ethbtcVol);

    // BTC.D proxy (using BTC strength)
    let s3 = getSignal(btcChange);
    document.getElementById("p3").innerText = btcChange.toFixed(2)+"%";
    document.getElementById("a3").innerHTML = `<span class="${s3.cls}">${s3.arrow}</span>`;
    document.getElementById("v3").innerText = "Vol: " + fmt(btcVol);

    // TOTAL proxy
    document.getElementById("p4").innerText = fmt(btcVol);
    document.getElementById("a4").innerHTML = `<span class="${s3.cls}">${s3.arrow}</span>`;
    document.getElementById("v4").innerText = "Market Flow";

    // USDT.D inverse of BTC
    let inv = -btcChange;
    let s1 = getSignal(inv);
    document.getElementById("p1").innerText = inv.toFixed(2)+"%";
    document.getElementById("a1").innerHTML = `<span class="${s1.cls}">${s1.arrow}</span>`;
    document.getElementById("v1").innerText = "Liquidity";
}

/* ===== CHARTS ===== */
new TradingView.widget({container_id:"c1",symbol:"CRYPTOCAP:USDT.D",interval:"15",theme:"dark"});
new TradingView.widget({container_id:"c2",symbol:"BINANCE:ETHBTC",interval:"15",theme:"dark"});
new TradingView.widget({container_id:"c3",symbol:"CRYPTOCAP:BTC.D",interval:"15",theme:"dark"});
new TradingView.widget({container_id:"c4",symbol:"CRYPTOCAP:TOTAL",interval:"15",theme:"dark"});

/* RUN */
update();
setInterval(update,5000);

</script>

</body>
</html>
