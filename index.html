<!DOCTYPE html>
<html>
<head>
<title>CROSE J Chart Terminal FIX</title>

<script src="https://unpkg.com/lightweight-charts/dist/lightweight-charts.standalone.production.js"></script>

<style>
body {
  margin: 0;
  background: #0b0f14;
  font-family: Arial;
}

.grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  grid-template-rows: 1fr 1fr;
  height: 100vh;
  gap: 6px;
  padding: 6px;
}

.box {
  position: relative;
  background: #111826;
  border: 1px solid #1f2a3a;
  overflow: hidden;
}

.chart {
  width: 100%;
  height: 100%;
}
</style>
</head>

<body>

<div class="grid">
  <div class="box"><div id="c1" class="chart"></div></div>
  <div class="box"><div id="c2" class="chart"></div></div>
  <div class="box"><div id="c3" class="chart"></div></div>
  <div class="box"><div id="c4" class="chart"></div></div>
</div>

<script>

function makeChart(containerId) {
    const container = document.getElementById(containerId);

    const chart = LightweightCharts.createChart(container, {
        layout: {
            background: { color: '#111826' },
            textColor: '#ccc'
        },
        grid: {
            vertLines: { color: '#1f2a3a' },
            horzLines: { color: '#1f2a3a' }
        },
        width: container.clientWidth,
        height: container.clientHeight
    });

    const series = chart.addCandlestickSeries();
    return { chart, series };
}

// FIXED: wait for layout before rendering
window.onload = function () {

    let w1 = makeChart("c1");
    let w2 = makeChart("c2");
    let w3 = makeChart("c3");
    let w4 = makeChart("c4");

    function gen(start) {
        let data = [];
        let p = start;

        for (let i = 0; i < 100; i++) {
            let open = p;
            let close = p + (Math.random() - 0.5) * 2;
            let high = Math.max(open, close) + Math.random();
            let low = Math.min(open, close) - Math.random();

            data.push({
                time: 1700000000 + i * 86400,
                open,
                high,
                low,
                close
            });

            p = close;
        }
        return data;
    }

    let data = gen(100);

    w1.series.setData(data);
    w2.series.setData(data.map(d => ({...d, close:d.close*1.01})));
    w3.series.setData(data.map(d => ({...d, close:d.close*0.99})));
    w4.series.setData(data.map(d => ({...d, close:d.close*1.005})));

};

</script>

</body>
</html>
