<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>FRANCIS TERMINAL V5 FINAL</title>

<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
background:#0f1722;
font-family:Arial,Helvetica,sans-serif;
color:#fff;
overflow:hidden;
}

/* TOPBAR */
.topbar{
height:52px;
background:#131722;
border-bottom:1px solid #222b39;
display:flex;
align-items:center;
gap:8px;
padding:0 12px;
}
.logo{font-weight:700}
.btn{
background:#1e222d;
padding:6px 10px;
border-radius:6px;
cursor:pointer;
font-size:12px;
color:#cfd6e4;
}
.btn:hover{background:#2a3140}

/* LAYOUT */
.wrap{
display:grid;
grid-template-columns:1fr 280px;
height:calc(100vh - 52px);
}
.left{position:relative}
.right{
background:#0d1520;
border-left:1px solid #1f2937;
padding:10px;
display:grid;
gap:10px;
}

.card{
background:#111827;
border:1px solid #1f2937;
border-radius:10px;
padding:10px;
}
.lab{font-size:11px;color:#8ea2bd}
.val{font-size:22px;font-weight:700}

/* CHART */
canvas{position:absolute;inset:0}
.watermark{
position:absolute;
top:18px;
left:18px;
font-size:24px;
color:rgba(255,255,255,.05);
}

.status{
position:absolute;
bottom:10px;
left:12px;
font-size:13px;
display:flex;
gap:15px;
color:#94a3b8;
flex-wrap:wrap;
}

.green{color:#26a69a}
.red{color:#ef5350}
.gold{color:#f0b90b}

@media(max-width:900px){
.wrap{grid-template-columns:1fr}
.right{display:none}
}
</style>
</head>

<body>

<div class="topbar">
<div class="logo">FRANCIS TERMINAL V5</div>
<div class="btn" onclick="setTF('1m')">1m</div>
<div class="btn" onclick="setTF('5m')">5m</div>
<div class="btn" onclick="setTF('15m')">15m</div>
<div class="btn" onclick="setTF('1h')">1H</div>
<div class="btn" onclick="setTF('4h')">4H</div>
</div>

<div class="wrap">

<div class="left">
<canvas id="chart"></canvas>
<div class="watermark">REAL MARKET ENGINE</div>

<div class="status">
<div id="mode">--</div>
<div id="clock"></div>
<div id="price">--</div>
</div>
</div>

<div class="right">
<div class="card"><div class="lab">BTC.D</div><div class="val" id="btc"></div></div>
<div class="card"><div class="lab">USDT.D</div><div class="val" id="usdt"></div></div>
<div class="card"><div class="lab">ETHBTC</div><div class="val" id="ethbtc"></div></div>
<div class="card"><div class="lab">ETH.D</div><div class="val" id="ethd"></div></div>
<div class="card"><div class="lab">TOTAL</div><div class="val" id="total"></div></div>
</div>

</div>

<script>
const canvas=document.getElementById("chart");
const ctx=canvas.getContext("2d");

const elBTC=document.getElementById("btc");
const elUSDT=document.getElementById("usdt");
const elETHBTC=document.getElementById("ethbtc");
const elETHD=document.getElementById("ethd");
const elTOTAL=document.getElementById("total");
const elMODE=document.getElementById("mode");
const elCLOCK=document.getElementById("clock");
const elPRICE=document.getElementById("price");

/* STATE */
let bars=[];
let tf="1m";
let signal=0;

/* CLOCK */
setInterval(()=>{
elCLOCK.innerText=new Date().toLocaleTimeString();
},1000);

/* RESIZE */
function resize(){
canvas.width=window.innerWidth-280;
canvas.height=window.innerHeight-52;
draw();
}
window.addEventListener("resize",resize);

/* FETCH PRICE */
async function loadPrice(){
try{
let res=await fetch(`https://api.binance.com/api/v3/klines?symbol=BTCUSDT&interval=${tf}&limit=150`);
let data=await res.json();

bars=data.map(k=>({
o:+k[1],
h:+k[2],
l:+k[3],
c:+k[4]
}));
}catch{}
}

/* FETCH MACRO */
async function loadMacro(){
try{
const [cg,bn]=await Promise.all([
fetch("https://api.coingecko.com/api/v3/global").then(r=>r.json()),
fetch("https://api.binance.com/api/v3/ticker/price?symbol=ETHBTC").then(r=>r.json())
]);

let d={
btc:cg.data.market_cap_percentage.btc,
usdt:cg.data.market_cap_percentage.usdt,
ethd:cg.data.market_cap_percentage.eth,
ethbtc:parseFloat(bn.price),
total:cg.data.total_market_cap.usd/1e12
};

updatePanel(d);
calcSignal(d);

}catch{}
}

/* SIGNAL ENGINE */
function calcSignal(d){

let score=
(d.total*14)+
(d.ethbtc*620)+
((10-d.usdt)*2)+
(d.ethd*0.8)-
(d.btc*0.35);

signal=(score-100)/20;

let state="NEUTRAL";
let color="#f0b90b";

if(signal>1.2){state="STRONG LONG";color="#26a69a";}
else if(signal>0.5){state="LONG";color="#26a69a";}
else if(signal<-1.2){state="STRONG SHORT";color="#ef5350";}
else if(signal<-0.5){state="SHORT";color="#ef5350";}

/* RISK FILTER */
if(d.usdt>9 || d.btc>60){
state="NO TRADE";
color="#ef5350";
}

elMODE.innerText=state;
elMODE.style.color=color;
}

/* PANEL */
function updatePanel(d){
elBTC.innerText=d.btc.toFixed(2)+"%";
elUSDT.innerText=d.usdt.toFixed(2)+"%";
elETHBTC.innerText=d.ethbtc.toFixed(5);
elETHD.innerText=d.ethd.toFixed(2)+"%";
elTOTAL.innerText="$"+d.total.toFixed(2)+"T";
}

/* DRAW */
function draw(){

ctx.clearRect(0,0,canvas.width,canvas.height);

/* BG BIAS */
ctx.fillStyle = signal>0
? "rgba(38,166,154,0.05)"
: "rgba(239,83,80,0.05)";
ctx.fillRect(0,0,canvas.width,canvas.height);

if(bars.length<2) return;

let max=Math.max(...bars.map(b=>b.h));
let min=Math.min(...bars.map(b=>b.l));
let range=max-min || 1;

let w=6;
let x=30;

bars.forEach(b=>{

let col=b.c>b.o ? "#26a69a" : "#ef5350";

let yo=(max-b.o)/range*canvas.height;
let yc=(max-b.c)/range*canvas.height;
let yh=(max-b.h)/range*canvas.height;
let yl=(max-b.l)/range*canvas.height;

ctx.strokeStyle=col;
ctx.beginPath();
ctx.moveTo(x,yh);
ctx.lineTo(x,yl);
ctx.stroke();

ctx.fillStyle=col;
ctx.fillRect(x-2,Math.min(yo,yc),4,Math.abs(yc-yo));

x+=w;
});

/* PRICE LINE */
let last=bars[bars.length-1].c;
let py=(max-last)/range*canvas.height;

ctx.strokeStyle="#d94b4b";
ctx.setLineDash([4,4]);
ctx.beginPath();
ctx.moveTo(0,py);
ctx.lineTo(canvas.width,py);
ctx.stroke();
ctx.setLineDash([]);

elPRICE.innerText="BTC "+last.toFixed(0);
}

/* LOOP */
async function update(){
await loadPrice();
await loadMacro();
draw();
}

/* TIMEFRAME */
function setTF(v){
tf=v;
update();
}

/* INIT */
resize();
update();
setInterval(update,4000);

</script>

</body>
</html>
