<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>⚡ V17 REAL FLOW ENGINE</title>

<style>
body{
    background:#02050c;
    color:#fff;
    font-family:Arial;
    margin:0;
}

/* HEADER */
.header{
    padding:12px;
    text-align:center;
    background:#060d1f;
    border-bottom:1px solid #1a2a4a;
    font-size:18px;
}

/* GRID */
.grid{
    display:grid;
    grid-template-columns:repeat(5,1fr);
    gap:10px;
    padding:10px;
}

/* CARD */
.card{
    background:#0a1326;
    border:1px solid #1c2b4a;
    border-radius:8px;
    padding:10px;
}

/* COLORS */
.up{color:#00ff9c;}
.down{color:#ff4d4d;}
.side{color:#ffcc00;}

.small{font-size:12px;color:#888;}
</style>
</head>

<body>

<div class="header">⚡ V17 — REAL FREE FLOW ENGINE</div>

<div class="grid">

<div class="card">
BTC.D<br>
<span id="btc" class="value">--</span>
</div>

<div class="card">
USDT.D<br>
<span id="usdt" class="value">--</span>
</div>

<div class="card">
ETHBTC<br>
<span id="ethbtc" class="value">--</span>
</div>

<div class="card">
TOTAL<br>
<span id="total" class="value">--</span>
</div>

<div class="card">
Market<br>
<span id="market">--</span>
</div>

</div>

<script>

/* STORE PREVIOUS VALUES */
let prev = {
    btc:null,
    usdt:null,
    ethbtc:null,
    total:null
}

/* FORMAT */
function fmt(n){
    if(n > 1e9) return (n/1e9).toFixed(2)+"B";
    if(n > 1e6) return (n/1e6).toFixed(2)+"M";
    return n.toFixed(2);
}

/* DIRECTION ENGINE */
function getDirection(current, previous){

    if(previous === null) return {arrow:"↔️", class:"side"};

    if(current > previous) return {arrow:"⬆️", class:"up"};
    if(current < previous) return {arrow:"⬇️", class:"down"};

    return {arrow:"↔️", class:"side"};
}

/* UPDATE FUNCTION */
async function update(){

    let res = await fetch("https://api.coingecko.com/api/v3/global");
    let data = await res.json();

    let total = data.data.total_market_cap.usd;

    let btc_d = data.data.market_cap_percentage.btc;
    let eth_d = data.data.market_cap_percentage.eth;

    /* APPROX CALCULATIONS */
    let usdt_d = 100 - btc_d - eth_d;
    let ethbtc = eth_d / btc_d;

    /* DIRECTION */
    let btcDir = getDirection(btc_d, prev.btc);
    let usdtDir = getDirection(usdt_d, prev.usdt);
    let ethbtcDir = getDirection(ethbtc, prev.ethbtc);
    let totalDir = getDirection(total, prev.total);

    /* UPDATE UI */
    document.getElementById("btc").innerHTML =
        `<span class="${btcDir.class}">${btc_d.toFixed(2)}% ${btcDir.arrow}</span>`;

    document.getElementById("usdt").innerHTML =
        `<span class="${usdtDir.class}">${usdt_d.toFixed(2)}% ${usdtDir.arrow}</span>`;

    document.getElementById("ethbtc").innerHTML =
        `<span class="${ethbtcDir.class}">${ethbtc.toFixed(4)} ${ethbtcDir.arrow}</span>`;

    document.getElementById("total").innerHTML =
        `<span class="${totalDir.class}">${fmt(total)} ${totalDir.arrow}</span>`;

    /* MARKET LOGIC */
    let market = "NEUTRAL";
    let color = "side";

    if(usdt_d < prev.usdt && ethbtc > prev.ethbtc) {
        market = "RISK-ON";
        color = "up";
    }
    else if(usdt_d > prev.usdt) {
        market = "RISK-OFF";
        color = "down";
    }
    else if(btc_d > prev.btc) {
        market = "BTC-LED";
        color = "side";
    }

    document.getElementById("market").innerHTML =
        `<span class="${color}">${market}</span>`;

    /* SAVE PREVIOUS */
    prev.btc = btc_d;
    prev.usdt = usdt_d;
    prev.ethbtc = ethbtc;
    prev.total = total;
}

/* RUN */
update();
setInterval(update, 5000);

</script>

</body>
</html>
