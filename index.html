<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>TRUE DOMINANCE LIVE V2</title>

<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
background:#020617;
color:#e5e7eb;
font-family:Arial,Helvetica,sans-serif;
padding:20px;
}
.wrap{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(320px,1fr));
gap:16px;
}
.panel{
background:#07101d;
border:1px solid #1e293b;
border-radius:16px;
padding:18px;
}
.title{
font-size:14px;
font-weight:700;
margin-bottom:8px;
}
.big{
font-size:34px;
font-weight:800;
margin-bottom:8px;
}
.small{
font-size:13px;
margin:4px 0;
}
.green{color:#22c55e}
.red{color:#ef4444}
.yellow{color:#eab308}
.blue{color:#38bdf8}
.gray{color:#94a3b8}
header{
margin-bottom:20px;
display:flex;
justify-content:space-between;
align-items:center;
}
h1{font-size:20px}
</style>
</head>
<body>

<header>
<div>
<h1>TRUE DOMINANCE LIVE V2</h1>
<div class="gray">Real APIs • Auto Refresh • Live Calculated Metrics</div>
</div>
<div id="clock"></div>
</header>

<div class="wrap">

<div class="panel">
<div class="title">BTC Dominance</div>
<div class="big yellow" id="btcd">Loading...</div>
<div class="small green">Buy Vol: <span id="btcdBuy">0</span></div>
<div class="small red">Sell Vol: <span id="btcdSell">0</span></div>
<div class="small yellow">Delta: <span id="btcdDelta">0</span></div>
</div>

<div class="panel">
<div class="title">USDT Dominance</div>
<div class="big red" id="usdtd">Loading...</div>
<div class="small green">Buy Vol: <span id="usdtdBuy">0</span></div>
<div class="small red">Sell Vol: <span id="usdtdSell">0</span></div>
<div class="small yellow">Delta: <span id="usdtdDelta">0</span></div>
</div>

<div class="panel">
<div class="title">TOTAL Market Cap</div>
<div class="big blue" id="total">Loading...</div>
<div class="small green">Buy Vol: <span id="totalBuy">0</span></div>
<div class="small red">Sell Vol: <span id="totalSell">0</span></div>
<div class="small yellow">Delta: <span id="totalDelta">0</span></div>
</div>

</div>

<script>
let prevTotal=0;
let prevBTC=0;
let prevUSDT=0;

function fmt(n){
return Number(n).toLocaleString();
}

function clock(){
document.getElementById("clock").textContent =
new Date().toLocaleTimeString();
}
setInterval(clock,1000);
clock();

async function loadData(){

try{

// CoinGecko Global Market Data
const r = await fetch("https://api.coingecko.com/api/v3/global");
const j = await r.json();

const total = j.data.total_market_cap.usd;
const btcd = j.data.market_cap_percentage.btc;
const usdtd = j.data.market_cap_percentage.usdt || 0;

// TOTAL
document.getElementById("total").textContent =
"$"+(total/1e12).toFixed(2)+"T";

let totalDelta = total - prevTotal;
let totalBuy = totalDelta>0 ? totalDelta : 0;
let totalSell = totalDelta<0 ? Math.abs(totalDelta) : 0;

document.getElementById("totalBuy").textContent =
"$"+fmt(Math.round(totalBuy/1e6))+"M";

document.getElementById("totalSell").textContent =
"$"+fmt(Math.round(totalSell/1e6))+"M";

document.getElementById("totalDelta").textContent =
"$"+fmt(Math.round(totalDelta/1e6))+"M";

// BTC.D
document.getElementById("btcd").textContent =
btcd.toFixed(2)+"%";

let btcDelta = btcd - prevBTC;
let btcBuy = btcDelta>0 ? btcDelta : 0;
let btcSell = btcDelta<0 ? Math.abs(btcDelta) : 0;

document.getElementById("btcdBuy").textContent =
btcBuy.toFixed(2);

document.getElementById("btcdSell").textContent =
btcSell.toFixed(2);

document.getElementById("btcdDelta").textContent =
btcDelta.toFixed(2);

// USDT.D
document.getElementById("usdtd").textContent =
usdtd.toFixed(2)+"%";

let usdtDelta = usdtd - prevUSDT;
let usdtBuy = usdtDelta>0 ? usdtDelta : 0;
let usdtSell = usdtDelta<0 ? Math.abs(usdtDelta) : 0;

document.getElementById("usdtdBuy").textContent =
usdtBuy.toFixed(2);

document.getElementById("usdtdSell").textContent =
usdtSell.toFixed(2);

document.getElementById("usdtdDelta").textContent =
usdtDelta.toFixed(2);

// Save previous
prevTotal = total;
prevBTC = btcd;
prevUSDT = usdtd;

}catch(e){
console.log(e);
}

}

// first load
loadData();

// refresh every 15 sec
setInterval(loadData,15000);
</script>

</body>
</html>
