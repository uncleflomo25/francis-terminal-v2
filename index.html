<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pure 12-Asset Composite Candlestick Chart</title>
    <!-- Load TradingView Lightweight Charts Library -->
    <script src="https://unpkg.com"></script>
    <style>
        body { margin: 0; padding: 0; background-color: #131722; font-family: sans-serif; }
        #chart-container { width: 100vw; height: 90vh; }
        #header { color: #ffffff; padding: 15px; font-size: 18px; font-weight: bold; background: #1c2030; }
    </style>
</head>
<body>
    <div id="header">12-Asset Crypto Composite Index (Pure Price Action)</div>
    <div id="chart-container"></div>

    <script>
        const symbols = ['BTCUSDT', 'ETHUSDT', 'SOLUSDT', 'XRPUSDT', 'BNBUSDT', 'DOGEUSDT', 'ADAUSDT', 'SUIUSDT', 'LINKUSDT', 'AVAXUSDT', 'PEPEUSDT', 'BCHUSDT'];
        
        // Initialize the interactive chart canvas
        const chart = LightweightCharts.createChart(document.getElementById('chart-container'), {
            width: window.innerWidth,
            height: window.innerHeight * 0.9,
            layout: { backgroundColor: '#131722', textColor: '#d1d4dc' },
            grid: { vertLines: { color: '#2b2b43' }, horzLines: { color: '#2b2b43' } },
            crosshair: { mode: LightweightCharts.CrosshairMode.Normal },
            priceScale: { borderColor: '#2b2b43' },
            timeScale: { borderColor: '#2b2b43', timeVisible: true }
        });

        // Add pure candlestick series
        const candleSeries = chart.addCandlestickSeries({
            upColor: '#00f0ff', downColor: '#ff007a',
            borderUpColor: '#00f0ff', borderDownColor: '#ff007a',
            wickUpColor: '#00f0ff', wickDownColor: '#ff007a'
        });

        // Fetch historical data for all 12 tokens simultaneously
        async function fetchCompositeData() {
            const fetchPromises = symbols.map(sym => 
                fetch(`https://binance.com{sym}&interval=1d&limit=100`)
                    .then(res => res.json())
            );

            const allData = await Promise.all(fetchPromises);
            const formattedData = [];
            const numCandles = allData[0].length;

            // Compute the real geometric composite values for each candle interval
            for (let t = 0; t < numCandles; t++) {
                let time = allData[0][t][0] / 1000; // Convert to seconds
                let logOpen = 0, logHigh = 0, logLow = 0, logClose = 0;

                for (let i = 0; i < symbols.length; i++) {
                    logOpen += Math.log(parseFloat(allData[i][t][1]));
                    logHigh += Math.log(parseFloat(allData[i][t][2]));
                    logLow += Math.log(parseFloat(allData[i][t][3]));
                    logClose += Math.log(parseFloat(allData[i][t][4]));
                }

                formattedData.push({
                    time: time,
                    open: Math.exp(logOpen / symbols.length),
                    high: Math.exp(logHigh / symbols.length),
                    low: Math.exp(logLow / symbols.length),
                    close: Math.exp(logClose / symbols.length)
                });
            }

            candleSeries.setData(formattedData);
        }

        fetchCompositeData();
        window.addEventListener('resize', () => {
            chart.resize(window.innerWidth, window.innerHeight * 0.9);
        });
    </script>
</body>
</html>
