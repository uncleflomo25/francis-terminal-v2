<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>⚡ FRANCIS TERMINAL V7 — INSTITUTIONAL ENGINE</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script src="https://s3.tradingview.com/tv.js"></script>

<style>
body{
    margin:0;
    background:radial-gradient(circle at top, #0a0f1f, #04060c);
    color:#fff;
    font-family:Arial;
}

/* HEADER */
.header{
    text-align:center;
    padding:12px;
    font-size:18px;
    background:#0a0f1f;
    border-bottom:1px solid #1c2b4a;
}

/* TOP PANEL */
.top{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:10px;
    padding:10px;
}

.box{
    background:#0a0f1f;
    border:1px solid #1c2b4a;
    border-radius:10px;
    padding:10px;
    text-align:center;
}

.green{color:#00ff9c;}
.red{color:#ff4d4d;}
.yellow{color:#ffd700;}

/* GRID */
.grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:10px;
    padding:10px;
}

.chart{
    height:300px;
    border:1px solid #13203a;
    border-radius:8px;
}

/* FLOW PANEL */
.panel{
    position:absolute;
    right:10px;
    top:80px;
    width:260px;
    padding:14px;
    background:#0a0f1f;
    border:1px solid #1c2b4a;
    border-radius:10px;
}

.line{
    display:flex;
    justify-content:space-between;
    margin:6px 0;
}
</style>
</head>

<body>

<div class="header">⚡ FRANCIS TERMINAL V7 — INSTITUTIONAL FLOW ENGINE</div>

<!-- TOP SIGNAL BOXES -->
<div class="top">
    <div class="box" id="usdtBox">USDT.D<br><span id="usdtDir"></span><br><span id="usdtVol"></span></div>
    <div class="box" id="ethBox">ETHBTC<br><span id="ethDir"></span><br><span id="ethVol"></span></div>
    <div class="box" id="btcBox">BTC.D<br><span id="btcDir"></span><br><span id="btcVol"></span></div>
    <div class="box" id="totBox">TOTAL<br><span id="totDir"></span><br><span id="totVol"></span></div>
</div>

<!-- CHART GRID -->
<div class="grid">
    <div id="c1" class="chart"></div>
    <div id="c2" class="chart"></div>
    <div id="c3" class="chart"></div>
    <div id="c4" class="chart"></div>
</div>

<!-- FLOW ENGINE -->
<div class="panel">
<b>⚡ FLOW ENGINE</b>

<div class="line">Spot <span id="spot"></span></div>
<div class="line">Perp <span id="perp"></span></div>
<div class="line">OI <span id="oi"></span></div>
<div class="line">Delta <span id="delta"></span></div>

<hr>

<div class="line">State <span id="state"></span></div>
</div>

<script>

/* FORMAT */
function fmt(v){
    if(v>1e9) return (v/1e9).toFixed(2)+"B";
    if(v>1e6) return (v/1e6).toFixed(2)+"M";
    return v.toFixed(0);
}

/* DIRECTION ENGINE */
function direction(change){
    if(change > 0.2) return '<span class="green">▲</span>';
    if(change < -0.2) return '<span class="red">▼</span>';
    return '<span class="yellow">→</span>';
}

/* FETCH BINANCE FLOW */
async function getData(){
    let spot = await fetch("https://api.binance.com/api/v3/ticker/24hr?symbol=BTCUSDT").then(r=>r.json());
    let perp = await fetch("https://fapi.binance.com/fapi/v1/ticker/24hr?symbol=BTCUSDT").then(r=>r.json());
    let oi   = await fetch("https://fapi.binance.com/fapi/v1/openInterest?symbol=BTCUSDT").then(r=>r.json());

    return {
        spotVol: parseFloat(spot.quoteVolume),
        perpVol: parseFloat(perp.quoteVolume),
        oi: parseFloat(oi.openInterest),
        change: parseFloat(spot.priceChangePercent)
    };
}

/* UPDATE */
async function update(){

    let d = await getData();

    let delta = d.spotVol - d.perpVol;

    document.getElementById("spot").innerText = fmt(d.spotVol);
    document.getElementById("perp").innerText = fmt(d.perpVol);
    document.getElementById("oi").innerText = fmt(d.oi);

    document.getElementById("delta").innerHTML =
        delta > 0 ? `<span class="green">+${fmt(delta)}</span>`
                  : `<span class="red">-${fmt(Math.abs(delta))}</span>`;

    /* MARKET STATE */
    let state = "SIDEWAYS";
    let color = "yellow";

    if(d.spotVol > d.perpVol && delta > 0){
        state = "SMART MONEY BUY";
        color = "green";
    } else if(d.perpVol > d.spotVol){
        state = "SHORT PRESSURE";
        color = "red";
    }

    document.getElementById("state").innerHTML =
        `<span class="${color}">${state}</span>`;

    /* TOP PANEL (SIMULATED REAL FLOW DIRECTION) */
    document.getElementById("usdtDir").innerHTML = direction(-d.change);
    document.getElementById("ethDir").innerHTML  = direction(-d.change/2);
    document.getElementById("btcDir").innerHTML  = direction(d.change/2);
    document.getElementById("totDir").innerHTML  = direction(d.change);

    document.getElementById("usdtVol").innerText = fmt(d.spotVol);
    document.getElementById("ethVol").innerText  = fmt(d.perpVol);
    document.getElementById("btcVol").innerText  = fmt(d.spotVol);
    document.getElementById("totVol").innerText  = fmt(d.perpVol);
}

/* STABLE CHART LOADER */
function loadChart(id, symbol){
    new TradingView.widget({
        container_id:id,
        symbol:symbol,
        interval:"15",
        theme:"dark",
        style:"1",
        autosize:true,
        toolbar_bg:"#04060c"
    });
}

/* LOAD WITH DELAY (FIX BUG) */
setTimeout(()=> loadChart("c1","CRYPTOCAP:USDT.D"),0);
setTimeout(()=> loadChart("c2","BINANCE:ETHBTC"),300);
setTimeout(()=> loadChart("c3","CRYPTOCAP:BTC.D"),600);
setTimeout(()=> loadChart("c4","CRYPTOCAP:TOTAL"),900);

/* RUN */
update();
setInterval(update,5000);

</script>

</body>
</html>
