<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SGOLD PRO - Personal Trading Platform</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <style>
    body { font-family: Arial; background: #0f1117; color: #fff; margin: 0; padding: 10px; }
    .header { text-align: center; padding: 15px; background: #1e222d; border-bottom: 2px solid #ffd700; }
    .container { display: flex; gap: 15px; margin-top: 15px; }
    .chart-container { flex: 3; background: #1e222d; padding: 10px; border-radius: 8px; }
    .sidebar { flex: 1; background: #1e222d; padding: 15px; border-radius: 8px; }
    h1 { color: #ffd700; }
  </style>
</head>
<body>
  <div class="header">
    <h1>SGOLD PRO - Personal Trading Software</h1>
    <p>Multi-Asset Gold Composite System</p>
  </div>

  <div class="container">
    <div class="chart-container">
      <canvas id="mainChart" height="500"></canvas>
    </div>

    <div class="sidebar">
      <h3>SGOLD PRO Status</h3>
      <div id="status">Loading...</div>
      <hr>
      <h4>Signals</h4>
      <div id="signals">Waiting for data...</div>
    </div>
  </div>

  <script>
    const ctx = document.getElementById('mainChart').getContext('2d');
    
    let chart = new Chart(ctx, {
      type: 'candlestick',
      data: { datasets: [{ label: 'SGOLD Composite', data: [] }] },
      options: {
        responsive: true,
        scales: { x: { type: 'time' }, y: { reverse: false } }
      }
    });

    // Simulated Live Data + SGOLD Logic (You can replace with real API later)
    function updateChart() {
      // This is where we would fetch real prices and calculate your composite
      document.getElementById('status').innerHTML = `
        <strong>Composite Trend:</strong> <span style="color:lime">BULLISH</span><br>
        <strong>Divergence:</strong> <span style="color:lime">Bullish Regular</span><br>
        <strong>Structure:</strong> Higher High + Higher Low
      `;
      
      document.getElementById('signals').innerHTML = `
        🟢 <strong>Strong BUY</strong> Signal on XAUUSD<br>
        🔴 Liquidity Sweep Detected
      `;
    }

    // Update every 5 seconds
    setInterval(updateChart, 5000);
    updateChart();
  </script>
</body>
</html>
