<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Francis Terminal PRO</title>

<script src="https://s3.tradingview.com/tv.js"></script>

<style>
body{
    margin:0;
    background:#020305;
    color:#eaeaea;
    font-family:Arial;
}

/* HEADER */
.header{
    text-align:center;
    padding:12px;
    font-size:20px;
    background:#05070c;
    border-bottom:1px solid #111;
}

/* FLOW BAR */
.flowbar{
    display:flex;
    justify-content:space-around;
    padding:10px;
    background:#03050a;
    border-bottom:1px solid #111;
}

.flowbox{
    text-align:center;
    font-size:13px;
}

.green{color:#00ff9c;}
.red{color:#ff4d4d;}
.yellow{color:#ffd400;}

/* GRID */
.grid{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:12px;
    padding:12px;
}

.card{
    background:#06090f;
    border:1px solid #111;
    border-radius:10px;
    padding:12px;
    text-align:center;
}

.value{
    font-size:20px;
    font-weight:bold;
}

/* CHARTS */
.charts{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:12px;
    padding:12px;
}

.chart{
    height:320px;
    border-radius:10px;
    overflow:hidden;
}
</style>
</head>

<body>

<div class="header">⚡ FRANCIS TERMINAL PRO</div>

<!-- FLOW TABLE -->
<div class="flowbar">
    <div class="flowbox">USDT.D <div id="usdt_arrow"></div></div>
    <div class="flowbox">ETHBTC <div id="ethbtc_arrow"></div></div>
    <div class="flowbox">BTC.D <div id="btcd_arrow"></div></div>
    <div class="flowbox">TOTAL <div id="total_arrow"></div></div>
</div>

<!-- BTC ENGINE -->
<div class="grid">

<div class="card">
<div>BTC Spot Vol</div>
<div id="spot" class="value">--</div>
</div>

<div class="card">
<div>BTC Perp Vol</div>
<div id="perp" class="value">--</div>
</div>

<div class="card">
<div>Open Interest</div>
<div id="oi" class="value">--</div>
</div>

<div class="card">
<div>Pressure</div>
<div id="pressure" class="value yellow">--</div>
</div>

</div>

<!-- CHARTS -->
<div class="charts">

<div>
<div style="padding:5px;color:#888;">USDT.D</div>
<div id="chart1" class="chart"></div>
</div>

<div>
<div style="padding:5px;color:#888;">ETHBTC (ALT vs BTC)</div>
<div id="chart2" class="chart"></div>
</div>

<div>
<div style="padding:5px;color:#888;">BTC.D</div>
<div id="chart3" class="chart"></div>
</div>

<div>
<div style="padding:5px;color:#888;">TOTAL</div>
<div id="chart4" class="chart"></div>
</div>

</div>

<script>

// ===== ARROW FUNCTION =====
function getArrow(change){
    if(change > 0.1) return ["▲","green"];
    if(change < -0.1) return ["▼","red"];
    return ["➜","yellow"];
}

// ===== FETCH DATA =====
async function loadData(){

// BTC REAL DATA
let spot = await fetch("https://api.binance.com/api/v3/ticker/24hr?symbol=BTCUSDT").then(r=>r.json());
let perp = await fetch("https://fapi.binance.com/fapi/v1/ticker/24hr?symbol=BTCUSDT").then(r=>r.json());
let oi = await fetch("https://fapi.binance.com/fapi/v1/openInterest?symbol=BTCUSDT").then(r=>r.json());

document.getElementById("spot").innerText = (spot.quoteVolume/1e9).toFixed(2)+"B";
document.getElementById("perp").innerText = (perp.quoteVolume/1e9).toFixed(2)+"B";
document.getElementById("oi").innerText = (oi.openInterest/1000).toFixed(2)+"K";

// pressure
if(perp.quoteVolume > spot.quoteVolume){
    document.getElementById("pressure").innerHTML="BUY ▲";
    document.getElementById("pressure").className="value green";
}else{
    document.getElementById("pressure").innerHTML="SELL ▼";
    document.getElementById("pressure").className="value red";
}

// ===== ARROWS (REAL CHANGE) =====
let pairs = {
    usdt: "https://api.binance.com/api/v3/ticker/24hr?symbol=BTCUSDT",
    ethbtc: "https://api.binance.com/api/v3/ticker/24hr?symbol=ETHBTC"
};

for(let key in pairs){
    let data = await fetch(pairs[key]).then(r=>r.json());
    let change = parseFloat(data.priceChangePercent);
    let a = getArrow(change);

    document.getElementById(key+"_arrow").innerHTML =
        "<span class='"+a[1]+"'>"+a[0]+"</span>";
}

// STATIC (no free API)
document.getElementById("btcd_arrow").innerHTML="<span class='yellow'>➜</span>";
document.getElementById("total_arrow").innerHTML="<span class='yellow'>➜</span>";

}

// ===== CHARTS =====
function loadCharts(){

new TradingView.widget({
    container_id:"chart1",
    symbol:"CRYPTOCAP:USDT.D",
    interval:"15",
    theme:"dark",
    style:"1",
    allow_symbol_change:false
});

new TradingView.widget({
    container_id:"chart2",
    symbol:"BINANCE:ETHBTC", // ✅ EXACT
    interval:"15",
    theme:"dark",
    allow_symbol_change:false
});

new TradingView.widget({
    container_id:"chart3",
    symbol:"CRYPTOCAP:BTC.D",
    interval:"15",
    theme:"dark",
    allow_symbol_change:false
});

new TradingView.widget({
    container_id:"chart4",
    symbol:"CRYPTOCAP:TOTAL",
    interval:"15",
    theme:"dark",
    allow_symbol_change:false
});

}

// INIT
loadCharts();
loadData();
setInterval(loadData,5000);

</script>

</body>
</html>
