<!DOCTYPE html>
<html>
<head>
<title>CROSE J Terminal</title>

<style>
body {
  margin: 0;
  background: #0b0f14;
  font-family: Arial;
  color: white;
}

.grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  grid-template-rows: 1fr 1fr;
  height: 100vh;
  gap: 6px;
  padding: 6px;
}

.box {
  background: #111826;
  border: 1px solid #1f2a3a;
  padding: 10px;
  position: relative;
}

.title {
  font-size: 12px;
  color: #aaa;
  margin-bottom: 10px;
}

.price {
  font-size: 26px;
  margin-top: 10px;
}

.state {
  font-size: 13px;
  margin-top: 8px;
  color: #888;
}

.up { color: #00ff88; }
.down { color: #ff4d4d; }
.range { color: #f0c674; }
</style>

</head>

<body>

<div class="grid">

  <div class="box">
    <div class="title">8D - MACRO STRUCTURE</div>
    <div id="w1" class="price">---</div>
    <div id="s1" class="state">loading</div>
  </div>

  <div class="box">
    <div class="title">4D - SWING STRUCTURE</div>
    <div id="w2" class="price">---</div>
    <div id="s2" class="state">loading</div>
  </div>

  <div class="box">
    <div class="title">2D - TRANSITION STRUCTURE</div>
    <div id="w3" class="price">---</div>
    <div id="s3" class="state">loading</div>
  </div>

  <div class="box">
    <div class="title">EXECUTION (4H / 12H / DAILY)</div>
    <div id="w4" class="price">---</div>
    <div id="s4" class="state">loading</div>
  </div>

</div>

<script>

// ------------------------
// SIMULATED CROSE J ENGINE
// ------------------------
let price = 100;

function move(){
  price += (Math.random() - 0.5) * 1.2;
  return price;
}

// ------------------------
// STRUCTURE DETECTION
// ------------------------
function structure(p){
  if(p > 101) return "BULLISH HH / HL";
  if(p < 99) return "BEARISH LH / LL";
  return "RANGE / LIQUIDITY BUILD";
}

// ------------------------
// UPDATE DASHBOARD
// ------------------------
function update(){

  let p = move();

  let d8 = p * 1.002;
  let d4 = p * 1.001;
  let d2 = p * 0.999;

  document.getElementById("w1").innerText = d8.toFixed(2);
  document.getElementById("w2").innerText = d4.toFixed(2);
  document.getElementById("w3").innerText = d2.toFixed(2);
  document.getElementById("w4").innerText = p.toFixed(2);

  document.getElementById("s1").innerText = structure(d8);
  document.getElementById("s2").innerText = structure(d4);
  document.getElementById("s3").innerText = structure(d2);

  // execution bias
  if(d8 > d4 && d4 > d2){
    document.getElementById("s4").innerText = "BULLISH FLOW CONFIRMED";
  } else if(d8 < d4 && d4 < d2){
    document.getElementById("s4").innerText = "BEARISH FLOW CONFIRMED";
  } else {
    document.getElementById("s4").innerText = "MIXED / MANIPULATION PHASE";
  }

}

setInterval(update, 1000);

</script>

</body>
</html>
