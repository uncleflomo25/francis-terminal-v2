<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Macro Flow Dashboard</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
body{
background:#111;
color:white;
font-family:Arial;
}

canvas{
max-width:1400px;
height:600px;
}
</style>
</head>

<body>

<h2>Macro Flow Index</h2>

<canvas id="macroChart"></canvas>

<script>

const FRED_KEY = "YOUR_FRED_API_KEY";

async function fred(series){

const url =
`https://api.stlouisfed.org/fred/series/observations?series_id=${series}&api_key=${FRED_KEY}&file_type=json`;

const r = await fetch(url);
const d = await r.json();

return d.observations.slice(-24);
}

async function load(){

const unrate = await fred("UNRATE");
const cpi = await fred("CPIAUCSL");
const fed = await fred("FEDFUNDS");

const labels = unrate.map(x => x.date);

const unemployment =
unrate.map(x => Number(x.value));

const inflation =
cpi.map(x => Number(x.value));

const rates =
fed.map(x => Number(x.value));

new Chart(
document.getElementById("macroChart"),
{
type:"line",
data:{
labels,
datasets:[
{
label:"UNRATE",
data:unemployment
},
{
label:"CPI",
data:inflation
},
{
label:"FEDFUNDS",
data:rates
}
]
}
});

}

load();

</script>

</body>
</html>
