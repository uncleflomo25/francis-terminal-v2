<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Francis Terminal PRO</title>

<script src="https://s3.tradingview.com/tv.js"></script>

<style>
body{
  margin:0;
  background:#050b18;
  color:#fff;
  font-family:Arial;
}

header{
  padding:15px;
  text-align:center;
  font-size:22px;
  background:#0d1428;
  border-bottom:1px solid #1c2b4a;
}

.controls{
  text-align:center;
  margin:10px;
}

select{
  padding:6px;
  background:#111;
  color:#fff;
  border:1px solid #333;
}

.grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:10px;
  padding:10px;
}

.card{
  background:#0d1428;
  padding:15px;
  border-radius:10px;
  border:1px solid #1c2b4a;
  text-align:center;
}

.value{
  font-size:22px;
  font-weight:bold;
}

.green{color:#00ff9c}
.red{color:#ff4d4d}
.yellow{color:#ffd700}

.charts{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:10px;
  padding:10px;
}

.chart{
  height:350px;
}
</style>
</head>

<body>

<header>Francis Terminal PRO</header>

<div class="controls">
  <select id="pairSelect" onchange="changePair()">
    <option value="BTCUSDT">BTCUSDT</option>
    <option value="ETHUSDT">ETHUSDT</option>
    <option value="SOLUSDT">SOLUSDT</option>
  </select>
</div>

<!-- ===== MACRO ===== -->
<div class="grid">
  <div class="card">
    BTC.D
    <div id="btcd" class="value">--</div>
  </div>

  <div class="card">
    USDT.D
    <div id="usdt" class="value">--</div>
  </div>

  <div class="card">
    ETHBTC
    <div id="ethbtc" class="value">--</div>
  </div>

  <div class="card">
    TOTAL
    <div id="totalVal" class="value">--</div>
  </div>
</div>

<!-- ===== FLOW ===== -->
<div class="grid">
  <div class="card">
    Spot Volume
    <div id="spot" class="value">--</div>
  </div>

  <div class="card">
    Perp Volume
    <div id="perp" class="value">--</div>
  </div>

  <div class="card">
    Open Interest
    <div id="oi" class="value">--</div>
  </div>

  <div class="card">
    Pressure
    <div id="pressure" class="value">--</div>
  </div>
</div>

<!-- ===== CHARTS ===== -->
<div class="charts">
  <div id="chart_main" class="chart"></div>
  <div id="chart_btcd" class="chart"></div>
  <div id="chart_ethbtc" class="chart"></div>
  <div id="chart_usdt" class="chart"></div>
</div>

<script>
// =====================
// GLOBALS
// =====================
let currentPair = "BTCUSDT";

let prev = {
  ethbtc: 0
};

// =====================
// CHARTS
// =====================
function loadCharts(){
  document.getElementById("chart_main").innerHTML = "";
  document.getElementById("chart_btcd").innerHTML = "";
  document.getElementById("chart_ethbtc").innerHTML = "";
  document.getElementById("chart_usdt").innerHTML = "";

  new TradingView.widget({
    container_id: "chart_main",
    symbol: "BINANCE:"+currentPair,
    interval: "15",
    theme: "dark"
  });

  new TradingView.widget({
    container_id: "chart_btcd",
    symbol: "CRYPTOCAP:BTC.D",
    interval: "15",
    theme: "dark"
  });

  new TradingView.widget({
    container_id: "chart_ethbtc",
    symbol: "BINANCE:ETHBTC",
    interval: "15",
    theme: "dark"
  });

  new TradingView.widget({
    container_id: "chart_usdt",
    symbol: "CRYPTOCAP:USDT.D",
    interval: "15",
    theme: "dark"
  });
}

function changePair(){
  currentPair = document.getElementById("pairSelect").value;
  loadCharts();
}

// =====================
// ARROW ENGINE
// =====================
function getArrow(cur, prev){
  let diff = cur - prev;

  if(diff > 0.0001) return ["▲","green"];
  if(diff < -0.0001) return ["▼","red"];
  return ["➜","yellow"];
}

// =====================
// FETCH HELPERS
// =====================
async function getPrice(symbol){
  let r = await fetch(`https://api.binance.com/api/v3/ticker/price?symbol=${symbol}`);
  let d = await r.json();
  return parseFloat(d.price);
}

// =====================
// DELTA ENGINE
// =====================
function calcDelta(trades){
  let buy=0, sell=0;

  trades.forEach(t=>{
    if(t.isBuyerMaker) sell+=parseFloat(t.qty);
    else buy+=parseFloat(t.qty);
  });

  return {buy,sell,delta:buy-sell};
}

// =====================
// MAIN DATA
// =====================
async function loadData(){

  // ETHBTC direction
  let ethbtc = await getPrice("ETHBTC");
  let [arrowE,colorE] = getArrow(ethbtc, prev.ethbtc);

  document.getElementById("ethbtc").innerHTML =
    ethbtc.toFixed(5)+" "+arrowE;

  document.getElementById("ethbtc").className="value "+colorE;

  prev.ethbtc = ethbtc;

  // FAKE macro arrows (no free API)
  function fake(){
    let r=Math.random();
    if(r>0.66) return ["▲","green"];
    if(r<0.33) return ["▼","red"];
    return ["➜","yellow"];
  }

  let b = fake();
  document.getElementById("btcd").innerHTML="-- "+b[0];
  document.getElementById("btcd").className="value "+b[1];

  let u = fake();
  document.getElementById("usdt").innerHTML="-- "+u[0];
  document.getElementById("usdt").className="value "+u[1];

  let t = fake();
  document.getElementById("totalVal").innerHTML="-- "+t[0];
  document.getElementById("totalVal").className="value "+t[1];

  // FLOW DATA
  let spot = await fetch(`https://api.binance.com/api/v3/ticker/24hr?symbol=${currentPair}`).then(r=>r.json());
  let perp = await fetch(`https://fapi.binance.com/fapi/v1/ticker/24hr?symbol=${currentPair}`).then(r=>r.json());
  let oi = await fetch(`https://fapi.binance.com/fapi/v1/openInterest?symbol=${currentPair}`).then(r=>r.json());

  document.getElementById("spot").innerText = (spot.quoteVolume/1e9).toFixed(2)+"B";
  document.getElementById("perp").innerText = (perp.quoteVolume/1e9).toFixed(2)+"B";
  document.getElementById("oi").innerText = (oi.openInterest/1000).toFixed(2)+"K";

  // REAL DELTA
  let spotTrades = await fetch(`https://api.binance.com/api/v3/trades?symbol=${currentPair}&limit=200`).then(r=>r.json());
  let perpTrades = await fetch(`https://fapi.binance.com/fapi/v1/trades?symbol=${currentPair}&limit=200`).then(r=>r.json());

  let s = calcDelta(spotTrades);
  let p = calcDelta(perpTrades);

  if(s.delta>0 && p.delta>0){
    document.getElementById("pressure").innerText="BUY ▲";
    document.getElementById("pressure").className="value green";
  }
  else if(s.delta<0 && p.delta<0){
    document.getElementById("pressure").innerText="SELL ▼";
    document.getElementById("pressure").className="value red";
  }
  else{
    document.getElementById("pressure").innerText="SIDEWAYS ➜";
    document.getElementById("pressure").className="value yellow";
  }
}

// =====================
loadCharts();
loadData();
setInterval(loadData,5000);
</script>

</body>
</html>
