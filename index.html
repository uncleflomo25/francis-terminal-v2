<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Francis Terminal PRO</title>

<script src="https://s3.tradingview.com/tv.js"></script>

<style>
body{
    margin:0;
    background:#020305;
    color:#eaeaea;
    font-family:Arial;
}

/* ===== HEADER ===== */
.header{
    padding:12px;
    text-align:center;
    font-size:20px;
    background:#06080c;
    border-bottom:1px solid #111;
    letter-spacing:1px;
}

/* ===== TOP FLOW BAR ===== */
.flowbar{
    display:flex;
    justify-content:space-around;
    padding:10px;
    background:#04060a;
    border-bottom:1px solid #111;
    font-size:13px;
}

.flowbox{
    text-align:center;
}

.green{color:#00ff9c;}
.red{color:#ff4d4d;}
.yellow{color:#ffd400;}

/* ===== GRID ===== */
.grid{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:12px;
    padding:12px;
}

.card{
    background:#070a10;
    border:1px solid #111;
    border-radius:10px;
    padding:12px;
    text-align:center;
}

.value{
    font-size:22px;
    font-weight:bold;
}

/* ===== DROPDOWN ===== */
select{
    background:#000;
    color:#fff;
    border:1px solid #333;
    padding:6px;
    margin-bottom:6px;
}

/* ===== CHARTS ===== */
.charts{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:12px;
    padding:12px;
}

.chart{
    height:300px;
    background:#000;
    border:1px solid #111;
    border-radius:10px;
}
</style>
</head>

<body>

<div class="header">⚡ FRANCIS TERMINAL PRO</div>

<!-- ===== ELITE FLOW TABLE ===== -->
<div class="flowbar">
    <div class="flowbox">USDT.D <div id="usdt_arrow"></div></div>
    <div class="flowbox">ETHBTC <div id="ethbtc_arrow"></div></div>
    <div class="flowbox">BTC.D <div id="btcd_arrow"></div></div>
    <div class="flowbox">TOTAL <div id="total_arrow"></div></div>
</div>

<!-- ===== SELECTOR ===== -->
<div style="padding:12px;">
<select id="symbolSelect">
<option value="CRYPTOCAP:USDT.D">USDT.D</option>
<option value="CRYPTOCAP:BTC.D">BTC.D</option>
<option value="BINANCE:ETHBTC">ETHBTC</option>
<option value="CRYPTOCAP:TOTAL">TOTAL</option>
</select>
</div>

<!-- ===== DATA CARDS ===== -->
<div class="grid">

<div class="card">
<div>BTC Spot Volume</div>
<div id="spot" class="value green">--</div>
</div>

<div class="card">
<div>BTC Perp Volume</div>
<div id="perp" class="value green">--</div>
</div>

<div class="card">
<div>Open Interest</div>
<div id="oi" class="value green">--</div>
</div>

<div class="card">
<div>Market Pressure</div>
<div id="pressure" class="value yellow">--</div>
</div>

</div>

<!-- ===== CHARTS ===== -->
<div class="charts">
<div id="chart1" class="chart"></div>
<div id="chart2" class="chart"></div>
<div id="chart3" class="chart"></div>
<div id="chart4" class="chart"></div>
</div>

<script>

// ===== ARROW LOGIC =====
function arrow(v){
    if(v > 0.3) return ["▲","green"];
    if(v < -0.3) return ["▼","red"];
    return ["➜","yellow"];
}

// ===== RANDOM FLOW (simulate direction) =====
function updateFlow(){
    let pairs = ["usdt","ethbtc","btcd","total"];

    pairs.forEach(id=>{
        let v = Math.random()*2-1;
        let a = arrow(v);
        document.getElementById(id+"_arrow").innerHTML =
            "<span class='"+a[1]+"'>"+a[0]+"</span>";
    });
}

// ===== REAL DATA (BTC only free) =====
async function loadData(){
    let spot = await fetch("https://api.binance.com/api/v3/ticker/24hr?symbol=BTCUSDT").then(r=>r.json());
    let perp = await fetch("https://fapi.binance.com/fapi/v1/ticker/24hr?symbol=BTCUSDT").then(r=>r.json());
    let oi = await fetch("https://fapi.binance.com/fapi/v1/openInterest?symbol=BTCUSDT").then(r=>r.json());

    let spotVol = (spot.quoteVolume/1e9).toFixed(2)+"B";
    let perpVol = (perp.quoteVolume/1e9).toFixed(2)+"B";
    let openI = (oi.openInterest/1000).toFixed(2)+"K";

    document.getElementById("spot").innerText = spotVol;
    document.getElementById("perp").innerText = perpVol;
    document.getElementById("oi").innerText = openI;

    if(perp.quoteVolume > spot.quoteVolume){
        document.getElementById("pressure").innerHTML="BUY ▲";
        document.getElementById("pressure").className="value green";
    } else {
        document.getElementById("pressure").innerHTML="SELL ▼";
        document.getElementById("pressure").className="value red";
    }
}

// ===== CHARTS =====
function loadCharts(){

new TradingView.widget({
    container_id:"chart1",
    symbol:"CRYPTOCAP:USDT.D",
    interval:"15",
    theme:"dark",
    style:"1"
});

new TradingView.widget({
    container_id:"chart2",
    symbol:"BINANCE:ETHBTC",
    interval:"15",
    theme:"dark"
});

new TradingView.widget({
    container_id:"chart3",
    symbol:"CRYPTOCAP:BTC.D",
    interval:"15",
    theme:"dark"
});

new TradingView.widget({
    container_id:"chart4",
    symbol:"CRYPTOCAP:TOTAL",
    interval:"15",
    theme:"dark"
});

}

// ===== INIT =====
loadCharts();
loadData();
updateFlow();

setInterval(loadData,5000);
setInterval(updateFlow,3000);

</script>

</body>
</html>
