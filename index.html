<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>V7 Liquidity Rotation + Footprint Terminal</title>

<style>
body {
  margin:0;
  background:#05070c;
  color:#cbd5e1;
  font-family: monospace;
}

#topbar {
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  padding:10px;
  background:#0f172a;
  border-bottom:1px solid #1f2937;
}

.box {
  padding:6px 10px;
  background:#111827;
  border-radius:6px;
}

#chart {
  width:100%;
  height:85vh;
}
</style>
</head>

<body>

<div id="topbar">
  <div class="box">FLOW: <span id="flow">--</span></div>
  <div class="box">BTC STRENGTH: <span id="btc"></span></div>
  <div class="box">ALT STRENGTH: <span id="alt"></span></div>
  <div class="box">USDT FLOW: <span id="usdt"></span></div>
  <div class="box">DELTA: <span id="delta"></span></div>
</div>

<canvas id="chart"></canvas>

<script>

const canvas = document.getElementById("chart");
const ctx = canvas.getContext("2d");

canvas.width = window.innerWidth;
canvas.height = window.innerHeight * 0.85;

// -----------------------------
// MARKET STATE (SIMULATED STREAM)
// -----------------------------
let TOTAL = 1200;
let USDT_D = 6;
let BTC_D = 50;
let ETHBTC = 0.05;

function rand() {
  return (Math.random() - 0.5) * 2;
}

// -----------------------------
// HISTORY
// -----------------------------
let history = [];

// -----------------------------
// Z SCORE
// -----------------------------
function mean(a){return a.reduce((x,y)=>x+y,0)/a.length;}
function std(a){let m=mean(a);return Math.sqrt(a.map(x=>(x-m)**2).reduce((x,y)=>x+y,0)/a.length);}
function z(v,a){let s=std(a)||1;return (v-mean(a))/s;}

// -----------------------------
// UPDATE MARKET (SIMULATION OR API HOOK)
// -----------------------------
function updateMarket(){

  // 🔌 HERE YOU CAN REPLACE WITH REAL DATA:
  // TOTAL = fetch(DeFiLlama)
  // BTC_D = fetch(Binance dominance proxy)
  // USDT_D = stablecoin supply change

  TOTAL += rand()*6;
  USDT_D += rand()*0.2;
  BTC_D += rand()*0.3;
  ETHBTC += rand()*0.001;
}

// -----------------------------
// CORE ROTATION ENGINE
// -----------------------------
function compute(){

  updateMarket();

  let BTC_STRENGTH =
    z(BTC_D, history.map(h=>h.BTC_D || BTC_D));

  let ALT_STRENGTH =
    z(ETHBTC, history.map(h=>h.ETHBTC || ETHBTC)) +
    (z(TOTAL, history.map(h=>h.TOTAL || TOTAL)) - BTC_STRENGTH);

  let USDT_FLOW =
    z(USDT_D, history.map(h=>h.USDT_D || USDT_D));

  // -----------------------------
  // LIQUIDITY ROTATION SCORE
  // -----------------------------
  let ROTATION =
    (ALT_STRENGTH - BTC_STRENGTH) - USDT_FLOW;

  // -----------------------------
  // FOOTPRINT DELTA (EXECUTION LAYER)
  // -----------------------------
  let BUY_PRESSURE = BTC_STRENGTH + ALT_STRENGTH;
  let SELL_PRESSURE = USDT_FLOW;

  let DELTA = BUY_PRESSURE - SELL_PRESSURE;

  // -----------------------------
  // FLOW STATE
  // -----------------------------
  let FLOW = "NEUTRAL";

  if(ROTATION > 1 && DELTA > 0) FLOW = "ALT RISK-ON FLOW";
  else if(BTC_STRENGTH > ALT_STRENGTH && DELTA > 0) FLOW = "BTC SAFE FLOW";
  else if(DELTA < 0) FLOW = "DISTRIBUTION / EXIT FLOW";

  // -----------------------------
  // STORE HISTORY
  // -----------------------------
  history.push({
    TOTAL,
    USDT_D,
    BTC_D,
    ETHBTC,
    ROTATION,
    DELTA
  });

  if(history.length > 120) history.shift();

  // -----------------------------
  // UI
  // -----------------------------
  document.getElementById("flow").innerText = FLOW;
  document.getElementById("btc").innerText = BTC_STRENGTH.toFixed(2);
  document.getElementById("alt").innerText = ALT_STRENGTH.toFixed(2);
  document.getElementById("usdt").innerText = USDT_FLOW.toFixed(2);
  document.getElementById("delta").innerText = DELTA.toFixed(2);

  return {ROTATION, DELTA};
}

// -----------------------------
// DRAW FOOTPRINT FLOW
// -----------------------------
function draw(){

  ctx.clearRect(0,0,canvas.width,canvas.height);

  let x = 50;
  let scale = 60;

  for(let i=0;i<history.length;i++){

    let h = history[i];

    let y = canvas.height/2 - h.ROTATION * scale;

    // footprint style bar
    ctx.fillStyle = h.DELTA > 0 ? "#22c55e" : "#ef4444";
    ctx.fillRect(x,y,6,6);

    // delta intensity overlay
    ctx.fillStyle = "rgba(59,130,246,0.3)";
    ctx.fillRect(x, canvas.height - Math.abs(h.DELTA)*20, 6, Math.abs(h.DELTA)*20);

    x += 8;
  }
}

// -----------------------------
// LOOP
// -----------------------------
setInterval(()=>{
  compute();
  draw();
}, 400);

</script>

</body>
</html>
