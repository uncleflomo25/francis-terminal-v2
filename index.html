<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Composite Candle Footprint Terminal</title>
<style>
body {
  margin:0;
  background:#0b0f14;
  color:#d1d4dc;
  font-family: monospace;
}
#header {
  padding:10px;
  background:#111827;
  display:flex;
  justify-content:space-between;
}
#chart {
  width:100%;
  height:90vh;
}
.panel {
  display:flex;
  gap:20px;
}
.box {
  padding:5px 10px;
  background:#1f2937;
  border-radius:6px;
}
</style>
</head>

<body>

<div id="header">
  <div class="panel">
    <div class="box">TOTAL: <span id="totalVal">0</span></div>
    <div class="box">USDT.D: <span id="usdtVal">0</span></div>
    <div class="box">COMPOSITE: <span id="compVal">0</span></div>
  </div>
</div>

<canvas id="chart"></canvas>

<script>
const canvas = document.getElementById("chart");
const ctx = canvas.getContext("2d");

canvas.width = window.innerWidth;
canvas.height = window.innerHeight * 0.9;

let data = [];

function randomWalk(prev) {
  return prev + (Math.random() - 0.5) * 2;
}

// INIT BASE VALUES
let TOTAL = 100;
let USDT = 10;

function generateCandle() {

  TOTAL = randomWalk(TOTAL);
  USDT = randomWalk(USDT);

  // Normalize inverse flow logic
  let buyPressure = (TOTAL - USDT) / 10;
  let sellPressure = (USDT - TOTAL) / 10;

  let open = buyPressure;
  let close = buyPressure + (Math.random() - 0.5);

  let high = Math.max(open, close) + Math.random();
  let low = Math.min(open, close) - Math.random();

  let volume = Math.abs(TOTAL - USDT) * (1 + Math.random());

  return {
    open, high, low, close,
    volume,
    total: TOTAL,
    usdt: USDT
  };
}

function draw() {
  ctx.clearRect(0,0,canvas.width,canvas.height);

  let w = canvas.width;
  let h = canvas.height;

  let candleWidth = 10;
  let x = 50;

  for (let i = 0; i < data.length; i++) {
    let c = data[i];

    let scale = 40;

    let o = h/2 - c.open * scale;
    let cl = h/2 - c.close * scale;
    let hi = h/2 - c.high * scale;
    let lo = h/2 - c.low * scale;

    // wick
    ctx.strokeStyle = "#9ca3af";
    ctx.beginPath();
    ctx.moveTo(x, hi);
    ctx.lineTo(x, lo);
    ctx.stroke();

    // body
    ctx.fillStyle = c.close > c.open ? "#22c55e" : "#ef4444";
    ctx.fillRect(x - 5, Math.min(o, cl), candleWidth, Math.abs(cl - o));

    // FOOTPRINT volume bar
    ctx.fillStyle = "rgba(59,130,246,0.4)";
    ctx.fillRect(x - 5, h - c.volume * 2, candleWidth, c.volume * 2);

    x += 15;
  }
}

function update() {
  let candle = generateCandle();

  data.push(candle);
  if (data.length > 80) data.shift();

  document.getElementById("totalVal").innerText = candle.total.toFixed(2);
  document.getElementById("usdtVal").innerText = candle.usdt.toFixed(2);
  document.getElementById("compVal").innerText = (candle.total - candle.usdt).toFixed(2);

  draw();
}

setInterval(update, 1000);

</script>

</body>
</html>
