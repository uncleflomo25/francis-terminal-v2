<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>⚡ V25 Composite Flow Engine</title>

<!-- REQUIRED LIBS -->
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdn.jsdelivr.net/npm/luxon"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-luxon"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-chart-financial"></script>

<style>
body{
    background:#02050c;
    color:#fff;
    font-family:Arial;
    margin:0;
}

.header{
    text-align:center;
    padding:12px;
    font-size:18px;
    background:#060d1f;
}

.controls{
    text-align:center;
    padding:10px;
}

button{
    margin:5px;
    padding:6px 12px;
    background:#0a1326;
    color:#fff;
    border:1px solid #1c2b4a;
    cursor:pointer;
}

canvas{
    width:100% !important;
    height:600px !important;
}
</style>
</head>

<body>

<div class="header">⚡ V25 — COMPOSITE INSTITUTIONAL CANDLE</div>

<div class="controls">
    <button onclick="loadData('1m')">1m</button>
    <button onclick="loadData('5m')">5m</button>
    <button onclick="loadData('15m')">15m</button>
    <button onclick="loadData('1h')">1H</button>
    <button onclick="loadData('1d')">1D</button>
</div>

<canvas id="chart"></canvas>

<script>

let chart;

// ================= FETCH =================
async function getKlines(symbol, interval){
    let url = `https://api.binance.com/api/v3/klines?symbol=${symbol}&interval=${interval}&limit=200`;
    let data = await fetch(url).then(r=>r.json());

    return data.map(d => ({
        time: d[0],
        close: parseFloat(d[4])
    }));
}

// ================= NORMALIZE =================
function norm(arr){
    let avg = arr.reduce((a,b)=>a+b)/arr.length;
    let std = Math.sqrt(arr.map(x=>(x-avg)**2).reduce((a,b)=>a+b)/arr.length);
    return arr.map(x => (x-avg)/(std || 1));
}

// ================= BUILD COMPOSITE =================
function buildComposite(btc, eth){

    let btcArr = btc.map(x=>x.close);
    let ethArr = eth.map(x=>x.close);

    let nBTC = norm(btcArr);
    let nETH = norm(ethArr);

    let candles = [];

    for(let i=1;i<btc.length;i++){

        let total   = nBTC[i];
        let btcDom  = nBTC[i];
        let usdtDom = -nBTC[i];

        let composite =
            (nETH[i]*0.45) +
            (total*0.25) -
            (btcDom*0.20) -
            (usdtDom*0.10);

        let prev =
            (nETH[i-1]*0.45) +
            (nBTC[i-1]*0.25) -
            (nBTC[i-1]*0.20) -
            (-nBTC[i-1]*0.10);

        candles.push({
            x: new Date(btc[i].time),
            o: prev,
            h: Math.max(prev, composite),
            l: Math.min(prev, composite),
            c: composite
        });
    }

    // 🔥 CRITICAL FIXES
    candles.sort((a,b)=>a.x - b.x);
    candles = candles.slice(-150);

    return candles;
}

// ================= DRAW =================
function draw(data){

    if(chart) chart.destroy();

    const ctx = document.getElementById('chart').getContext('2d');

    chart = new Chart(ctx, {
        type: 'candlestick',
        data: {
            datasets: [{
                label: 'Composite',
                data: data,
                parsing: false,
                color: {
                    up: '#00ff9c',
                    down: '#ff4d4d',
                    unchanged: '#ffd700'
                }
            }]
        },
        options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins:{
                legend:{display:false}
            },
            scales:{
                x:{
                    type:'time',
                    distribution:'series',
                    ticks:{color:'#aaa'}
                },
                y:{
                    ticks:{color:'#aaa'}
                }
            }
        }
    });
}

// ================= LOAD =================
async function loadData(interval){

    try{

        let btc = await getKlines("BTCUSDT", interval);
        let eth = await getKlines("ETHBTC", interval);

        let composite = buildComposite(btc, eth);

        draw(composite);

    }catch(e){
        console.error(e);
        alert("Error loading data");
    }
}

// INIT
loadData("1d");

</script>

</body>
</html>
