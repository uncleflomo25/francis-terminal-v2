<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>⚡ V17 REAL-TIME ENGINE</title>

<style>
body{
    margin:0;
    background:#02050c;
    color:#fff;
    font-family:Arial;
}

.header{
    padding:12px;
    background:#060d1f;
    color:#f0b90b;
    font-weight:bold;
}

.grid{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:10px;
    padding:10px;
}

.card{
    background:#0a1326;
    border:1px solid #1c2b4a;
    border-radius:8px;
    padding:12px;
}

.green{color:#00ff9c;}
.red{color:#ff4d4d;}
.yellow{color:#ffd700;}

.big{font-size:18px;font-weight:bold;}
</style>
</head>

<body>

<div class="header">⚡ V17 — REAL TIME FREE ENGINE</div>

<div class="grid">
    <div class="card">BTCUSDT<br><span id="btc" class="big"></span></div>
    <div class="card">ETHBTC<br><span id="ethbtc" class="big"></span></div>
    <div class="card">TOTAL<br><span id="total" class="big"></span></div>
    <div class="card">Market<br><span id="market" class="big"></span></div>
</div>

<script>

// ===== STATE =====
let lastBTC = 0;
let lastETH = 0;
let lastTOTAL = 0;

let btcPrice = 0;
let ethbtcPrice = 0;

// ===== FORMAT =====
function fmt(v){
    if(v > 1e12) return (v/1e12).toFixed(2)+"T";
    if(v > 1e9) return (v/1e9).toFixed(2)+"B";
    if(v > 1e6) return (v/1e6).toFixed(2)+"M";
    return v.toFixed(2);
}

// ===== DIRECTION =====
function getDir(curr, prev){
    if(prev === 0) return {arrow:"↔️", color:"yellow"};

    let change = (curr - prev) / prev;

    if(change > 0.0005) return {arrow:"⬆️", color:"green"};
    if(change < -0.0005) return {arrow:"⬇️", color:"red"};
    return {arrow:"↔️", color:"yellow"};
}

// ===== BTC STREAM =====
new WebSocket("wss://stream.binance.com:9443/ws/btcusdt@trade")
.onmessage = (e)=>{
    let t = JSON.parse(e.data);
    btcPrice = parseFloat(t.p);
    update();
}

// ===== ETHBTC STREAM =====
new WebSocket("wss://stream.binance.com:9443/ws/ethbtc@trade")
.onmessage = (e)=>{
    let t = JSON.parse(e.data);
    ethbtcPrice = parseFloat(t.p);
    update();
}

// ===== TOTAL MARKET =====
async function getTotal(){
    let res = await fetch("https://api.coingecko.com/api/v3/global");
    let d = await res.json();
    let total = d.data.total_market_cap.usd;

    let dir = getDir(total, lastTOTAL);
    lastTOTAL = total;

    document.getElementById("total").innerHTML =
        `<span class="${dir.color}">${fmt(total)} ${dir.arrow}</span>`;
}
setInterval(getTotal,10000);
getTotal();

// ===== ENGINE =====
function update(){

    // BTC
    let btcDir = getDir(btcPrice, lastBTC);
    lastBTC = btcPrice;

    document.getElementById("btc").innerHTML =
        `<span class="${btcDir.color}">${btcPrice.toFixed(2)} ${btcDir.arrow}</span>`;

    // ETHBTC
    let ethDir = getDir(ethbtcPrice, lastETH);
    lastETH = ethbtcPrice;

    document.getElementById("ethbtc").innerHTML =
        `<span class="${ethDir.color}">${ethbtcPrice.toFixed(5)} ${ethDir.arrow}</span>`;

    // MARKET LOGIC (clean + real)
    let state = "NEUTRAL";
    let color = "yellow";

    if(btcDir.color === "green" && ethDir.color === "green"){
        state = "RISK-ON";
        color = "green";
    }
    else if(btcDir.color === "red" && ethDir.color === "red"){
        state = "RISK-OFF";
        color = "red";
    }

    document.getElementById("market").innerHTML =
        `<span class="${color}">${state}</span>`;
}

</script>

</body>
</html>
