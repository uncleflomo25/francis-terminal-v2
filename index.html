<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>⚡ FRANCIS TERMINAL V10 — SMART ENGINE</title>
<script src="https://s3.tradingview.com/tv.js"></script>

<style>
body{margin:0;background:#020409;color:#fff;font-family:Arial;}

.header{
    text-align:center;
    padding:12px;
    font-size:20px;
    background:#050b18;
    border-bottom:1px solid #13203a;
}

.topbar{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:10px;
    padding:10px;
}

.box{
    background:#070f1f;
    border:1px solid #13203a;
    border-radius:8px;
    padding:10px;
    text-align:center;
}

.green{color:#00ff9c;}
.red{color:#ff4d4d;}
.yellow{color:#ffd700;}

.main{
    display:grid;
    grid-template-columns:2fr 1fr;
    grid-template-rows:350px 350px auto;
    gap:10px;
    padding:10px;
}

.chart{
    width:100%;
    height:100%;
    border:1px solid #13203a;
    border-radius:8px;
}

.panel{
    background:#070f1f;
    border:1px solid #13203a;
    border-radius:8px;
    padding:12px;
}
</style>
</head>

<body>

<div class="header">⚡ FRANCIS TERMINAL V10 — SMART FLOW ENGINE</div>

<!-- TOP -->
<div class="topbar">
    <div class="box">USDT.D <div id="usdt"></div></div>
    <div class="box">ETHBTC <div id="ethbtc"></div></div>
    <div class="box">BTC.D <div id="btcd"></div></div>
    <div class="box">TOTAL <div id="total"></div></div>
</div>

<div class="main">

    <div id="total_chart" class="chart"></div>
    <div id="ethbtc_chart" class="chart"></div>
    <div id="usdt_chart" class="chart"></div>
    <div id="btcd_chart" class="chart"></div>

    <div class="panel">
        <b>⚡ V10 ENGINE</b><br><br>

        Score: <span id="score"></span><br><br>

        State: <span id="state"></span><br><br>

        Liquidity: <span id="liq"></span><br>
        BTC Control: <span id="btc_ctrl"></span><br>
        Rotation: <span id="rotation"></span>

    </div>

</div>

<script>

/* ===== MOCK DATA (replace later with real) ===== */
function randTrend(){
    return Math.random() > 0.5 ? 1 : -1;
}

/* ===== ENGINE ===== */
function runEngine(){

    let usdt = randTrend();   // down = good
    let btcd = randTrend();   // up = good
    let ethbtc = randTrend(); // up = good
    let total = randTrend();  // up = good

    let score = 0;

    if(total > 0) score += 25;
    if(usdt < 0) score += 25;
    if(btcd > 0) score += 25;
    if(ethbtc > 0) score += 25;

    // STATE
    let state = "";
    let color = "";

    if(score >= 75){ state="🚀 STRONG BULL"; color="green";}
    else if(score >=55){ state="📈 BULL"; color="green";}
    else if(score >=45){ state="⚖️ SIDEWAYS"; color="yellow";}
    else if(score >=25){ state="📉 BEAR"; color="red";}
    else{ state="💥 STRONG BEAR"; color="red";}

    // UI
    document.getElementById("score").innerHTML = `<span class="${color}">${score}</span>`;
    document.getElementById("state").innerHTML = `<span class="${color}">${state}</span>`;

    document.getElementById("liq").innerHTML =
        usdt < 0 ? `<span class="green">RISK ON</span>` : `<span class="red">RISK OFF</span>`;

    document.getElementById("btc_ctrl").innerHTML =
        btcd > 0 ? `<span class="green">BTC DOMINANT</span>` : `<span class="red">ALTS DOMINANT</span>`;

    document.getElementById("rotation").innerHTML =
        ethbtc > 0 ? `<span class="green">ETH STRONG</span>` : `<span class="red">ETH WEAK</span>`;
}

setInterval(runEngine,3000);
runEngine();

/* ===== CHARTS ===== */
new TradingView.widget({container_id:"total_chart",symbol:"CRYPTOCAP:TOTAL",interval:"15",theme:"dark"});
new TradingView.widget({container_id:"ethbtc_chart",symbol:"BINANCE:ETHBTC",interval:"15",theme:"dark"});
new TradingView.widget({container_id:"usdt_chart",symbol:"CRYPTOCAP:USDT.D",interval:"15",theme:"dark"});
new TradingView.widget({container_id:"btcd_chart",symbol:"CRYPTOCAP:BTC.D",interval:"15",theme:"dark"});

</script>

</body>
</html>
