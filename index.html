<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>⚡ FRANCIS TERMINAL PRO V2</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script src="https://s3.tradingview.com/tv.js"></script>

<style>
body{
    margin:0;
    background:#02040a;
    color:#fff;
    font-family:Arial;
}

header{
    padding:14px;
    text-align:center;
    font-size:20px;
    background:#050816;
    border-bottom:1px solid #1a2a5a;
    letter-spacing:1px;
}

.top{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:10px;
    padding:10px;
}

.box{
    background:#050816;
    border:1px solid #1a2a5a;
    border-radius:10px;
    padding:12px;
    text-align:center;
}

.value{
    font-size:18px;
    margin-top:5px;
}

.green{color:#00ffa6;}
.red{color:#ff4d4d;}
.yellow{color:#ffd000;}

.grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:10px;
    padding:10px;
}

.card{
    background:#050816;
    border:1px solid #1a2a5a;
    border-radius:10px;
    padding:5px;
}

.panel{
    position:fixed;
    right:10px;
    top:60px;
    width:230px;
    background:#050816;
    border:1px solid #1a2a5a;
    border-radius:10px;
    padding:12px;
    font-size:13px;
    box-shadow:0 0 15px rgba(0,255,150,0.05);
}
</style>
</head>

<body>

<header>⚡ FRANCIS TERMINAL PRO V2</header>

<div class="top">
    <div class="box">USDT.D<div id="usdt" class="value"></div></div>
    <div class="box">ETHBTC<div id="ethbtc" class="value"></div></div>
    <div class="box">BTC.D<div id="btc" class="value"></div></div>
    <div class="box">TOTAL<div id="total" class="value"></div></div>
</div>

<div class="grid">
    <div class="card"><div id="c1"></div></div>
    <div class="card"><div id="c2"></div></div>
    <div class="card"><div id="c3"></div></div>
    <div class="card"><div id="c4"></div></div>
</div>

<div class="panel">
<b>⚡ ELITE FLOW</b><br><br>

USDT.D: <span id="p1"></span><br>
ETHBTC: <span id="p2"></span><br>
BTC.D: <span id="p3"></span><br>
TOTAL: <span id="p4"></span><br><br>

<b>SIGNAL</b><br>
<span id="signal"></span>
</div>

<script>

// ===== DATA STORAGE =====
let prev = {btc:null, ethbtc:null}

// ===== ARROW ENGINE =====
function arrow(change){
    if(change > 0.3) return '<span class="green">🟢 ▲</span>';
    if(change < -0.3) return '<span class="red">🔴 ▼</span>';
    return '<span class="yellow">🟡 →</span>';
}

// ===== FETCH REAL DATA =====
async function load(){

    let btc = await fetch("https://api.binance.com/api/v3/ticker/price?symbol=BTCUSDT").then(r=>r.json());
    let ethbtc = await fetch("https://api.binance.com/api/v3/ticker/price?symbol=ETHBTC").then(r=>r.json());

    let btcVal = parseFloat(btc.price);
    let ethbtcVal = parseFloat(ethbtc.price);

    let btcChange = prev.btc ? ((btcVal-prev.btc)/prev.btc)*100 : 0;
    let ethChange = prev.ethbtc ? ((ethbtcVal-prev.ethbtc)/prev.ethbtc)*100 : 0;

    // DISPLAY
    document.getElementById("btc").innerHTML = arrow(btcChange);
    document.getElementById("ethbtc").innerHTML = arrow(ethChange);

    document.getElementById("p3").innerHTML = arrow(btcChange);
    document.getElementById("p2").innerHTML = arrow(ethChange);

    // STATIC (from charts visually)
    document.getElementById("usdt").innerHTML = "Live";
    document.getElementById("total").innerHTML = "Live";
    document.getElementById("p1").innerHTML = "Live";
    document.getElementById("p4").innerHTML = "Live";

    // ===== SMART SIGNAL ENGINE =====
    let signal;

    if(ethChange > 0.3 && btcChange < 0){
        signal = '<span class="green">ALT SEASON 🚀</span>';
    }
    else if(btcChange > 0.3 && ethChange < 0){
        signal = '<span class="yellow">BTC DOMINANCE 🟡</span>';
    }
    else if(btcChange < 0 && ethChange < 0){
        signal = '<span class="red">RISK OFF 🔴</span>';
    }
    else{
        signal = '<span class="yellow">SIDEWAYS ⚖️</span>';
    }

    document.getElementById("signal").innerHTML = signal;

    prev.btc = btcVal;
    prev.ethbtc = ethbtcVal;
}

// RUN
load();
setInterval(load,5000);

// ===== CHARTS =====
new TradingView.widget({
    container_id:"c1",
    symbol:"CRYPTOCAP:USDT.D",
    interval:"15",
    theme:"dark"
});

new TradingView.widget({
    container_id:"c2",
    symbol:"BINANCE:ETHBTC",
    interval:"15",
    theme:"dark"
});

new TradingView.widget({
    container_id:"c3",
    symbol:"CRYPTOCAP:BTC.D",
    interval:"15",
    theme:"dark"
});

new TradingView.widget({
    container_id:"c4",
    symbol:"CRYPTOCAP:TOTAL",
    interval:"15",
    theme:"dark"
});

</script>

</body>
</html>
