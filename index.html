<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>⚡ FRANCIS TERMINAL V7 — INSTITUTIONAL ENGINE</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script src="https://s3.tradingview.com/tv.js"></script>

<style>
body{
    margin:0;
    background:linear-gradient(180deg,#01020a,#040714,#01020a);
    color:#fff;
    font-family:Arial;
}

.header{
    text-align:center;
    padding:14px;
    font-size:20px;
    background:#050a18;
    border-bottom:1px solid #1f2d50;
}

/* TOP */
.top{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:10px;
    padding:10px;
}

.box{
    background:#060d1f;
    border:1px solid #1f2d50;
    border-radius:10px;
    padding:12px;
    text-align:center;
}

.symbol{color:#aaa;font-size:13px;}
.price{font-size:18px;margin-top:5px;}
.arrow{font-size:18px;margin-top:5px;}
.vol{font-size:12px;color:#888;}

.green{color:#00ff9c;}
.red{color:#ff4d4d;}
.yellow{color:#ffd700;}

/* MARKET STATE PANEL */
.stateBox{
    margin:10px;
    padding:14px;
    background:#060d1f;
    border:1px solid #1f2d50;
    border-radius:10px;
    text-align:center;
    font-size:18px;
}

/* GRID */
.grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:10px;
    padding:10px;
}

.chart{
    height:300px;
    border:1px solid #13203a;
    border-radius:8px;
}
</style>
</head>

<body>

<div class="header">⚡ FRANCIS TERMINAL V7 — INSTITUTIONAL ENGINE</div>

<div class="top">
    <div class="box"><div class="symbol">USDT.D</div><div id="p1" class="price"></div><div id="a1" class="arrow"></div><div id="v1" class="vol"></div></div>
    <div class="box"><div class="symbol">ETHBTC</div><div id="p2" class="price"></div><div id="a2" class="arrow"></div><div id="v2" class="vol"></div></div>
    <div class="box"><div class="symbol">BTC.D</div><div id="p3" class="price"></div><div id="a3" class="arrow"></div><div id="v3" class="vol"></div></div>
    <div class="box"><div class="symbol">TOTAL</div><div id="p4" class="price"></div><div id="a4" class="arrow"></div><div id="v4" class="vol"></div></div>
</div>

<div class="stateBox" id="marketState">LOADING...</div>

<div class="grid">
    <div id="c1" class="chart"></div>
    <div id="c2" class="chart"></div>
    <div id="c3" class="chart"></div>
    <div id="c4" class="chart"></div>
</div>

<script>

/* FORMAT */
function fmt(v){
    if(v>1e9) return (v/1e9).toFixed(2)+"B";
    if(v>1e6) return (v/1e6).toFixed(2)+"M";
    return v.toFixed(2);
}

/* TREND ENGINE */
function signal(change){
    if(change > 0.5) return {arrow:"▲", cls:"green", dir:1};
    if(change < -0.5) return {arrow:"▼", cls:"red", dir:-1};
    return {arrow:"➜", cls:"yellow", dir:0};
}

/* DATA */
async function get(symbol){
    let r = await fetch(`https://api.binance.com/api/v3/ticker/24hr?symbol=${symbol}`);
    return await r.json();
}

async function update(){

    let btc = await get("BTCUSDT");
    let ethbtc = await get("ETHBTC");

    let btcCh = parseFloat(btc.priceChangePercent);
    let ethbtcCh = parseFloat(ethbtc.priceChangePercent);

    let sBTC = signal(btcCh);
    let sETHBTC = signal(ethbtcCh);
    let sUSDT = signal(-btcCh); // inverse
    let sTOTAL = signal(btcCh);

    /* APPLY UI */
    p1.innerText = (-btcCh).toFixed(2)+"%";
    a1.innerHTML = `<span class="${sUSDT.cls}">${sUSDT.arrow}</span>`;
    v1.innerText = "Liquidity";

    p2.innerText = ethbtc.lastPrice;
    a2.innerHTML = `<span class="${sETHBTC.cls}">${sETHBTC.arrow}</span>`;
    v2.innerText = "Vol: "+fmt(ethbtc.volume);

    p3.innerText = btcCh.toFixed(2)+"%";
    a3.innerHTML = `<span class="${sBTC.cls}">${sBTC.arrow}</span>`;
    v3.innerText = "Vol: "+fmt(btc.quoteVolume);

    p4.innerText = fmt(btc.quoteVolume);
    a4.innerHTML = `<span class="${sTOTAL.cls}">${sTOTAL.arrow}</span>`;
    v4.innerText = "Market Flow";

    /* ===== INSTITUTIONAL LOGIC ===== */
    let state = "SIDEWAYS";
    let cls = "yellow";

    // BTC dominance phase
    if(sBTC.dir === 1 && sETHBTC.dir === -1){
        state = "BTC DOMINANCE 📈";
        cls = "green";
    }

    // Alt rotation
    else if(sETHBTC.dir === 1 && sTOTAL.dir === 1){
        state = "ALT ROTATION 🚀";
        cls = "green";
    }

    // Risk off
    else if(sUSDT.dir === 1 && sTOTAL.dir === -1){
        state = "RISK OFF 🔴";
        cls = "red";
    }

    // Liquidity expansion
    else if(sUSDT.dir === -1 && sTOTAL.dir === 1){
        state = "RISK ON 💰";
        cls = "green";
    }

    document.getElementById("marketState").innerHTML =
        `<span class="${cls}">${state}</span>`;
}

/* CHARTS */
new TradingView.widget({container_id:"c1",symbol:"CRYPTOCAP:USDT.D",interval:"15",theme:"dark"});
new TradingView.widget({container_id:"c2",symbol:"BINANCE:ETHBTC",interval:"15",theme:"dark"});
new TradingView.widget({container_id:"c3",symbol:"CRYPTOCAP:BTC.D",interval:"15",theme:"dark"});
new TradingView.widget({container_id:"c4",symbol:"CRYPTOCAP:TOTAL",interval:"15",theme:"dark"});

update();
setInterval(update,5000);

</script>

</body>
</html>
