<!DOCTYPE html>
<html>
<head>
<title>CROSE J TradingView Terminal</title>

<style>
body {
  margin: 0;
  background: #0b0f14;
  font-family: Arial;
}

.grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  grid-template-rows: 1fr 1fr;
  height: 100vh;
  gap: 5px;
  padding: 5px;
}

.box {
  position: relative;
  border: 1px solid #1f2a3a;
  background: #111826;
}

.label {
  position: absolute;
  top: 5px;
  left: 8px;
  font-size: 12px;
  color: #aaa;
  z-index: 10;
  background: rgba(0,0,0,0.4);
  padding: 2px 6px;
  border-radius: 4px;
}
</style>
</head>

<body>

<div class="grid">

  <!-- 8D -->
  <div class="box">
    <div class="label">8D / MACRO BIAS</div>
    <iframe
      src="https://s.tradingview.com/widgetembed/?symbol=FX:EURUSD&interval=W&theme=dark"
      width="100%" height="100%" frameborder="0">
    </iframe>
  </div>

  <!-- 4D -->
  <div class="box">
    <div class="label">4D / SWING STRUCTURE</div>
    <iframe
      src="https://s.tradingview.com/widgetembed/?symbol=FX:EURUSD&interval=D&theme=dark"
      width="100%" height="100%" frameborder="0">
    </iframe>
  </div>

  <!-- 2D -->
  <div class="box">
    <div class="label">2D / TRANSITION (12H)</div>
    <iframe
      src="https://s.tradingview.com/widgetembed/?symbol=FX:EURUSD&interval=720&theme=dark"
      width="100%" height="100%" frameborder="0">
    </iframe>
  </div>

  <!-- EXECUTION -->
  <div class="box">
    <div class="label">EXECUTION (4H / DAILY)</div>
    <iframe
      src="https://s.tradingview.com/widgetembed/?symbol=FX:EURUSD&interval=240&theme=dark"
      width="100%" height="100%" frameborder="0">
    </iframe>
  </div>

</div>

</body>
</html>
