<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>⚡ V25 Composite Flow Engine</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-chart-financial"></script>

<style>
body{
    background:#02050c;
    color:#fff;
    font-family:Arial;
    margin:0;
}

.header{
    text-align:center;
    padding:12px;
    font-size:18px;
    background:#060d1f;
}

.controls{
    padding:10px;
    text-align:center;
}

button{
    margin:5px;
    padding:6px 10px;
    background:#0a1326;
    color:#fff;
    border:1px solid #1c2b4a;
    cursor:pointer;
}

canvas{
    width:100% !important;
    height:600px !important;
}
</style>
</head>

<body>

<div class="header">⚡ V25 — COMPOSITE INSTITUTIONAL CANDLE (NO TV)</div>

<div class="controls">
    Timeframe:
    <button onclick="loadData('1')">1m</button>
    <button onclick="loadData('5')">5m</button>
    <button onclick="loadData('15')">15m</button>
    <button onclick="loadData('60')">1H</button>
    <button onclick="loadData('D')">1D</button>
</div>

<canvas id="chart"></canvas>

<script>

let chart;

// ===== FETCH BINANCE =====
async function getKlines(symbol, interval){
    let url = `https://api.binance.com/api/v3/klines?symbol=${symbol}&interval=${interval}&limit=200`;
    let data = await fetch(url).then(r=>r.json());
    return data.map(d => ({
        time: d[0],
        close: parseFloat(d[4])
    }));
}

// ===== NORMALIZE =====
function norm(arr){
    let avg = arr.reduce((a,b)=>a+b)/arr.length;
    let std = Math.sqrt(arr.map(x=>Math.pow(x-avg,2)).reduce((a,b)=>a+b)/arr.length);
    return arr.map(x => (x-avg)/(std||1));
}

// ===== BUILD COMPOSITE =====
function buildComposite(btc, ethbtc){

    let btcArr = btc.map(x=>x.close);
    let ethArr = ethbtc.map(x=>x.close);

    let nBTC = norm(btcArr);
    let nETH = norm(ethArr);

    let candles = [];

    for(let i=1;i<btc.length;i++){

        // Simulated macro proxies
        let total = nBTC[i];       // proxy
        let btcDom = nBTC[i];
        let usdtDom = -nBTC[i];    // inverse proxy

        let composite =
            (nETH[i]*0.45) +
            (total*0.25) -
            (btcDom*0.20) -
            (usdtDom*0.10);

        let prev =
            (nETH[i-1]*0.45) +
            (nBTC[i-1]*0.25) -
            (nBTC[i-1]*0.20) -
            (-nBTC[i-1]*0.10);

        candles.push({
            x: btc[i].time,
            o: prev,
            h: Math.max(prev, composite),
            l: Math.min(prev, composite),
            c: composite
        });
    }

    return candles;
}

// ===== DRAW =====
function draw(data){

    if(chart) chart.destroy();

    const ctx = document.getElementById('chart');

    chart = new Chart(ctx, {
        type: 'candlestick',
        data: {
            datasets: [{
                label: 'Composite Market',
                data: data,
                borderColor: '#00ff9c'
            }]
        },
        options: {
            plugins:{
                legend:{display:false}
            },
            scales:{
                x:{ticks:{color:'#aaa'}},
                y:{ticks:{color:'#aaa'}}
            }
        }
    });
}

// ===== LOAD ENGINE =====
async function loadData(tf){

    let interval =
        tf==="1" ? "1m" :
        tf==="5" ? "5m" :
        tf==="15"? "15m":
        tf==="60"? "1h":
        "1d";

    let btc = await getKlines("BTCUSDT", interval);
    let eth = await getKlines("ETHBTC", interval);

    let composite = buildComposite(btc, eth);

    draw(composite);
}

// INIT
loadData("D");

</script>

</body>
</html>
