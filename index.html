<!DOCTYPE html>
<html lang='en'>
<head>
<meta charset='UTF-8'><meta name='viewport' content='width=device-width,initial-scale=1.0'>
<title>Francis Terminal V6.2 TRUE DOMINANCE</title>
<script src='https://cdn.jsdelivr.net/npm/chart.js'></script>
<style>*{box-sizing:border-box}body{margin:0;background:#020617;color:#fff;font-family:Arial,sans-serif}header{padding:18px 24px;background:#081226;border-bottom:1px solid #1e293b;font-size:28px;font-weight:800}.wrap{max-width:1500px;margin:auto;padding:20px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px}.card{background:#0f172a;border:1px solid #1e293b;border-radius:18px;padding:18px}.label{font-size:12px;color:#94a3b8}.val{font-size:32px;font-weight:800;color:#10b981;margin-top:8px}.row{display:grid;grid-template-columns:2fr 1fr;gap:16px;margin-top:16px}.chart{height:420px}.small{font-size:14px;color:#cbd5e1}.list div{padding:8px 0;border-bottom:1px solid #1e293b}@media(max-width:950px){.row{grid-template-columns:1fr}}</style>
</head><body><header>📊 Francis Terminal V6.2 TRUE DOMINANCE</header><div class='wrap'>
<div class='grid'>
<div class='card'><div class='label'>BTC Price</div><div id='btc' class='val'>$--</div></div>
<div class='card'><div class='label'>ETH Price</div><div id='eth' class='val'>$--</div></div>
<div class='card'><div class='label'>BTC Dominance</div><div id='btcd' class='val'>--%</div></div>
<div class='card'><div class='label'>USDT Dominance</div><div id='usdtd' class='val'>--%</div></div>
<div class='card'><div class='label'>USDC Dominance</div><div id='usdcd' class='val'>--%</div></div>
<div class='card'><div class='label'>ICC Regime</div><div id='regime' class='val'>Standby</div></div>
</div>
<div class='row'><div class='card'><div class='label'>Stablecoin Pressure Flow</div><div class='chart'><canvas id='chart'></canvas></div></div><div><div class='card'><div class='label'>AI Scanner</div><div id='scan' class='small'>Loading...</div></div><div class='card' style='margin-top:16px'><div class='label'>Signal Center</div><div class='list' id='signals'></div></div></div></div></div>
<script>
const pts=[],labs=[];const ch=new Chart(document.getElementById('chart'),{type:'line',data:{labels:labs,datasets:[{data:pts,borderColor:'#10b981',borderWidth:3,tension:.35}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}}}});
function money(n){return '$'+Number(n).toLocaleString(undefined,{maximumFractionDigits:0})}
async function load(){try{
let p=await fetch('https://api.binance.com/api/v3/ticker/price?symbols=["BTCUSDT","ETHUSDT"]');let pd=await p.json();let btc=+pd[0].price,eth=+pd[1].price;
let g=await fetch('https://api.coingecko.com/api/v3/global');let gd=await g.json();let total=gd.data.total_market_cap.usd;let btcd=+gd.data.market_cap_percentage.btc.toFixed(1);
let c=await fetch('https://api.coingecko.com/api/v3/coins/tether');let td=await c.json();let usdtcap=td.market_data.market_cap.usd;
let u=await fetch('https://api.coingecko.com/api/v3/coins/usd-coin');let ud=await u.json();let usdccap=ud.market_data.market_cap.usd;
let usdtd=((usdtcap/total)*100).toFixed(1);let usdcd=((usdccap/total)*100).toFixed(1);
document.getElementById('btc').innerText=money(btc);document.getElementById('eth').innerText=money(eth);document.getElementById('btcd').innerText=btcd+'%';document.getElementById('usdtd').innerText=usdtd+'%';document.getElementById('usdcd').innerText=usdcd+'%';
let flow=btcd*0.45 - usdtd*2 - usdcd + (btc/1000)*0.02; pts.push(flow);labs.push(new Date().toLocaleTimeString());if(pts.length>30){pts.shift();labs.shift();}ch.update();
let regime=flow>28?'Risk ON':flow<20?'Risk OFF':'Rotation';document.getElementById('regime').innerText=regime;
document.getElementById('scan').innerText='Stablecoin pressure '+(usdtd>6?'elevated':'normal')+'. BTC dominance '+btcd+'%. USDT.D '+usdtd+'%.';
document.getElementById('signals').innerHTML='<div>BTC '+money(btc)+'</div><div>BTC.D '+btcd+'%</div><div>USDT.D '+usdtd+'%</div><div>USDC.D '+usdcd+'%</div><div>Mode: '+regime+'</div>';
}catch(e){document.getElementById('scan').innerText='Feed issue';}}
load();setInterval(load,10000);
</script></body></html>
