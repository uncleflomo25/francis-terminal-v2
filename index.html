<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>⚡ V26 — REAL FLOW ENGINE (NO TV)</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
body{
    margin:0;
    background:#02050c;
    color:white;
    font-family:Arial;
}

.header{
    text-align:center;
    padding:10px;
    background:#06122b;
    font-weight:bold;
}

.grid{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:10px;
    padding:10px;
}

.box{
    background:#0a1326;
    padding:12px;
    border-radius:6px;
    border:1px solid #1c2b4a;
}

.big{font-size:20px;font-weight:bold;}

.green{color:#00ff9c;}
.red{color:#ff4d4d;}
.yellow{color:#ffd700;}

canvas{
    width:100% !important;
    height:500px !important;
}
</style>
</head>

<body>

<div class="header">⚡ V26 — REAL INSTITUTIONAL ENGINE</div>

<div class="grid">
<div class="box">BTC<br><span id="btc" class="big">--</span></div>
<div class="box">ETHBTC<br><span id="ethbtc" class="big">--</span></div>
<div class="box">BTC.D (proxy)<br><span id="btcd" class="big">--</span></div>
<div class="box">USDT.D (proxy)<br><span id="usdt" class="big">--</span></div>
</div>

<div class="grid">
<div class="box">TOTAL (proxy)<br><span id="total"></span></div>
<div class="box">Signal<br><span id="signal"></span></div>
<div class="box">State<br><span id="state"></span></div>
<div class="box">Confidence<br><span id="conf"></span></div>
</div>

<canvas id="chart"></canvas>

<script>

//=====================
// HELPERS
//=====================
function dir(curr, prev){
    if(!prev) return {a:"↔️",c:"yellow",d:0};
    let ch = (curr-prev)/prev;
    if(ch>0.002) return {a:"⬆️",c:"green",d:1};
    if(ch<-0.002) return {a:"⬇️",c:"red",d:-1};
    return {a:"↔️",c:"yellow",d:0};
}

//=====================
// CHART
//=====================
let ctx = document.getElementById('chart').getContext('2d');

let chart = new Chart(ctx,{
    type:'line',
    data:{
        labels:[],
        datasets:[{
            label:'Composite Flow',
            data:[],
            borderWidth:3,
            tension:0.3
        }]
    },
    options:{
        responsive:true,
        plugins:{legend:{display:false}},
        scales:{
            x:{display:false},
            y:{grid:{color:"#111"}}
        }
    }
});

//=====================
// ENGINE
//=====================
let prev = {};
let compArr = [];

async function update(){

    // REAL DATA
    let btc = await fetch("https://api.binance.com/api/v3/ticker/price?symbol=BTCUSDT").then(r=>r.json());
    let eth = await fetch("https://api.binance.com/api/v3/ticker/price?symbol=ETHBTC").then(r=>r.json());

    let btcP = parseFloat(btc.price);
    let ethP = parseFloat(eth.price);

    // DIRECTION
    let d1 = dir(btcP, prev.btc);
    let d2 = dir(ethP, prev.eth);

    // PROXIES (IMPORTANT)
    let btc_d = 50 + (d1.d * 2);     // fake BTC dominance movement
    let usdt_d = 5 - (d1.d * 1.5);   // inverse risk
    let total = btcP * 19;           // scaled proxy

    // DISPLAY
    document.getElementById("btc").innerHTML =
        `<span class="${d1.c}">${btcP.toFixed(0)} ${d1.a}</span>`;

    document.getElementById("ethbtc").innerHTML =
        `<span class="${d2.c}">${ethP.toFixed(5)} ${d2.a}</span>`;

    document.getElementById("btcd").innerHTML =
        `<span class="${d1.c}">${btc_d.toFixed(2)}%</span>`;

    document.getElementById("usdt").innerHTML =
        `<span class="${d1.c}">${usdt_d.toFixed(2)}%</span>`;

    document.getElementById("total").innerText =
        (total/1e6).toFixed(2)+"B";

    //=====================
    // COMPOSITE ENGINE
    //=====================
    let comp =
        (d2.d * 0.4) +
        (d1.d * 0.3) -
        (btc_d * 0.002) -
        (usdt_d * 0.002);

    compArr.push(comp);
    if(compArr.length > 100) compArr.shift();

    //=====================
    // CHART UPDATE
    //=====================
    chart.data.labels.push("");
    chart.data.datasets[0].data = compArr;

    // COLOR
    chart.data.datasets[0].borderColor =
        comp > 0 ? "#00ff9c" :
        comp < 0 ? "#ff4d4d" : "#ffd700";

    chart.update();

    //=====================
    // SIGNAL
    //=====================
    let signal="NEUTRAL";
    if(comp > 0.5) signal="STRONG BUY";
    else if(comp > 0.1) signal="BUY";
    else if(comp < -0.5) signal="STRONG SELL";
    else if(comp < -0.1) signal="SELL";

    let color =
        signal.includes("BUY") ? "green" :
        signal.includes("SELL") ? "red" : "yellow";

    document.getElementById("signal").innerHTML =
        `<span class="${color}">${signal}</span>`;

    document.getElementById("state").innerHTML =
        `<span class="${d1.c}">
        ${d1.d==1?"TREND UP":d1.d==-1?"TREND DOWN":"RANGE"}
        </span>`;

    document.getElementById("conf").innerText =
        Math.min(100, Math.abs(comp)*100).toFixed(0)+"%";

    prev.btc = btcP;
    prev.eth = ethP;
}

// LOOP
update();
setInterval(update,3000);

</script>

</body>
</html>
