<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Composite Footprint - Simple Trader (Freeze Mode)</title>
<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#020617;
  color:#e5e7eb;
}
header{
  padding:14px 18px;
  border-bottom:1px solid #1e293b;
  display:flex;
  justify-content:space-between;
  align-items:center;
}
h1{
  margin:0;
  font-size:18px;
}
.sub{
  font-size:12px;
  color:#94a3b8;
}
.wrap{
  display:grid;
  grid-template-columns:240px 1fr 300px;
  gap:12px;
  padding:12px;
  min-height:calc(100vh - 60px);
}
.panel{
  background:#07101d;
  border:1px solid #1e293b;
  border-radius:16px;
  padding:12px;
}
.title{
  font-size:13px;
  font-weight:700;
  margin-bottom:10px;
}
.big{
  font-size:34px;
  font-weight:800;
}
.signal{
  font-size:42px;
  font-weight:900;
  text-align:center;
  padding:20px 0;
}
.green{color:#22c55e;}
.red{color:#ef4444;}
.yellow{color:#eab308;}

.btn{
  width:100%;
  padding:10px;
  margin-top:8px;
  border:none;
  border-radius:10px;
  background:#0f172a;
  color:#fff;
  cursor:pointer;
  border:1px solid #334155;
}
.btn:hover{
  background:#1e293b;
}

.table{
  width:100%;
  border-collapse:collapse;
  font-size:13px;
}
.table th,.table td{
  padding:7px;
  border-bottom:1px solid #132033;
  text-align:right;
}
.table th:first-child,
.table td:first-child{
  text-align:left;
}

.heat{
  display:grid;
  grid-template-columns:repeat(20,1fr);
  gap:3px;
  margin-top:10px;
}
.heat div{
  height:18px;
  border-radius:4px;
}

@media(max-width:1100px){
  .wrap{grid-template-columns:1fr;}
}
</style>
</head>
<body>

<header>
<div>
<h1>COMPOSITE FOOTPRINT - SIMPLE TRADER</h1>
<div class="sub">Freeze Mode • Manual Refresh Only</div>
</div>
<div id="clock"></div>
</header>

<div class="wrap">

<!-- LEFT -->
<div class="panel">
<div class="title">Market Bias</div>
<div class="big green" id="bias">BULLISH</div>
<div class="sub">BTC + ETHBTC + Dominance</div>

<div class="title" style="margin-top:18px;">Controls</div>
<button class="btn" onclick="render()">Refresh Now</button>
<button class="btn" onclick="toggleLive()">Live: OFF</button>
<div class="sub" style="margin-top:10px;">No auto movement unless Live ON</div>
</div>

<!-- CENTER -->
<div class="panel">
<div class="title">Footprint Ladder</div>
<table class="table" id="tbl"></table>

<div class="title" style="margin-top:14px;">Pressure Heatmap</div>
<div class="heat" id="heat"></div>
</div>

<!-- RIGHT -->
<div class="panel">
<div class="title">Trade Decision</div>
<div class="signal green" id="decision">BUY</div>

<div class="big green" id="delta">+1250</div>
<div class="sub">Net Composite Delta</div>

<div class="title" style="margin-top:18px;">Why</div>
<div class="sub" id="why">
Buy pressure stronger than sell pressure.
</div>
</div>

</div>

<script>
function rnd(a,b){
  return Math.floor(Math.random()*(b-a+1))+a;
}

let liveMode=false;
let timer=null;

function render(){
  document.getElementById("clock").textContent =
    new Date().toLocaleTimeString();

  let t='<tr><th>Price</th><th>Buy</th><th>Sell</th><th>Delta</th></tr>';
  let net=0;

  for(let i=0;i<10;i++){
    let price=69000-(i*25);
    let buy=rnd(500,3500);
    let sell=rnd(500,3500);
    let delta=buy-sell;
    net+=delta;

    t+=`
    <tr>
      <td>${price}</td>
      <td class="green">${buy}</td>
      <td class="red">${sell}</td>
      <td class="${delta>=0?'green':'red'}">${delta}</td>
    </tr>`;
  }

  document.getElementById("tbl").innerHTML=t;

  let signal="WAIT";
  let color="yellow";
  let why="Balanced market pressure.";

  if(net>1200){
    signal="BUY";
    color="green";
    why="Buy pressure stronger than sell pressure.";
  }else if(net<-1200){
    signal="SELL";
    color="red";
    why="Sell pressure stronger than buy pressure.";
  }

  document.getElementById("decision").className="signal "+color;
  document.getElementById("decision").textContent=signal;

  document.getElementById("delta").className="big "+color;
  document.getElementById("delta").textContent=
    (net>0?"+":"")+net;

  document.getElementById("bias").className="big "+color;
  document.getElementById("bias").textContent=
    signal==="WAIT"?"NEUTRAL":signal;

  document.getElementById("why").textContent=why;

  let h="";
  for(let i=0;i<20;i++){
    let v=rnd(-10,10);
    let c=v>0?"#16a34a":v<0?"#b91c1c":"#a16207";
    h+=`<div style="background:${c}"></div>`;
  }
  document.getElementById("heat").innerHTML=h;
}

function toggleLive(){
  liveMode=!liveMode;

  const btn=document.querySelectorAll(".btn")[1];

  if(liveMode){
    btn.textContent="Live: ON";
    timer=setInterval(render,3000);
  }else{
    btn.textContent="Live: OFF";
    clearInterval(timer);
  }
}

render(); // only once on load
</script>

</body>
</html>
