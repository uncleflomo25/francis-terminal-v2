<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>⚡ V22 INSTITUTIONAL FLOW ENGINE</title>

<script src="https://s3.tradingview.com/tv.js"></script>

<style>
body{
    background:#02050c;
    color:white;
    font-family:Arial;
    margin:0;
}

.header{
    padding:12px;
    text-align:center;
    background:#060d1f;
    font-size:18px;
    font-weight:bold;
}

.grid{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:10px;
    padding:10px;
}

.box{
    background:#0a1326;
    padding:12px;
    border-radius:6px;
    border:1px solid #1c2b4a;
}

.big{font-size:18px;font-weight:bold;}

.green{color:#00ff9c;}
.red{color:#ff4d4d;}
.yellow{color:#ffd700;}

</style>
</head>

<body>

<div class="header">⚡ V22 — INSTITUTIONAL FLOW ENGINE</div>

<!-- PRICE -->
<div class="grid">
<div class="box">BTC<br><span id="btc" class="big">--</span></div>
<div class="box">ETHBTC<br><span id="ethbtc" class="big">--</span></div>
<div class="box">Funding<br><span id="funding" class="big">--</span></div>
<div class="box">Open Interest<br><span id="oi" class="big">--</span></div>
</div>

<!-- FLOW -->
<div class="grid">
<div class="box">Spot Buy<br><span id="spotBuy"></span></div>
<div class="box">Spot Sell<br><span id="spotSell"></span></div>
<div class="box">Perp Buy<br><span id="perpBuy"></span></div>
<div class="box">Perp Sell<br><span id="perpSell"></span></div>
</div>

<!-- ENGINE -->
<div class="grid">
<div class="box">Delta<br><span id="delta"></span></div>
<div class="box">Market Signal<br><span id="signal"></span></div>
<div class="box">Confidence<br><span id="confidence"></span></div>
<div class="box">Market State<br><span id="state"></span></div>
</div>

<!-- CHARTS -->
<div class="grid">
<div id="chart_btc" style="height:300px;"></div>
<div id="chart_ethbtc" style="height:300px;"></div>
<div id="chart_total" style="height:300px;"></div>
<div id="chart_usdt" style="height:300px;"></div>
</div>

<script>

// ===== FORMAT =====
function fmt(v){
    if(v > 1e9) return (v/1e9).toFixed(2)+"B";
    if(v > 1e6) return (v/1e6).toFixed(2)+"M";
    return v.toFixed(2);
}

// ===== DIRECTION =====
function dir(curr, prev){
    if(!prev) return {a:"↔️",c:"yellow",d:"SIDE"};
    let ch = ((curr-prev)/prev)*100;
    if(ch>0.2) return {a:"⬆️",c:"green",d:"UP"};
    if(ch<-0.2) return {a:"⬇️",c:"red",d:"DOWN"};
    return {a:"↔️",c:"yellow",d:"SIDE"};
}

let prev = {};

// ===== MAIN ENGINE =====
async function update(){

    // ===== DATA =====
    let btc = await fetch("https://api.binance.com/api/v3/ticker/24hr?symbol=BTCUSDT").then(r=>r.json());
    let eth = await fetch("https://api.binance.com/api/v3/ticker/24hr?symbol=ETHBTC").then(r=>r.json());
    let oi = await fetch("https://fapi.binance.com/fapi/v1/openInterest?symbol=BTCUSDT").then(r=>r.json());
    let funding = await fetch("https://fapi.binance.com/fapi/v1/premiumIndex?symbol=BTCUSDT").then(r=>r.json());

    let btcP = parseFloat(btc.lastPrice);
    let ethP = parseFloat(eth.lastPrice);

    let btcDir = dir(btcP, prev.btc);
    let ethDir = dir(ethP, prev.eth);

    // ===== DISPLAY PRICE =====
    document.getElementById("btc").innerHTML =
        `<span class="${btcDir.c}">${btcP.toFixed(0)} ${btcDir.a}</span>`;

    document.getElementById("ethbtc").innerHTML =
        `<span class="${ethDir.c}">${ethP.toFixed(5)} ${ethDir.a}</span>`;

    // ===== FUNDING =====
    let f = parseFloat(funding.lastFundingRate);
    document.getElementById("funding").innerHTML =
        `<span class="${f>0?'red':'green'}">${(f*100).toFixed(3)}%</span>`;

    // ===== OI =====
    let oiVal = parseFloat(oi.openInterest);
    document.getElementById("oi").innerText = fmt(oiVal * btcP);

    // ===== FLOW =====
    let vol = parseFloat(btc.volume);

    let spotBuy = vol * (btc.priceChangePercent > 0 ? 0.65 : 0.45);
    let spotSell = vol - spotBuy;

    let perpBuy = spotBuy * 1.4;
    let perpSell = spotSell * 1.4;

    document.getElementById("spotBuy").innerText = fmt(spotBuy);
    document.getElementById("spotSell").innerText = fmt(spotSell);
    document.getElementById("perpBuy").innerText = fmt(perpBuy);
    document.getElementById("perpSell").innerText = fmt(perpSell);

    let delta = spotBuy - spotSell;

    document.getElementById("delta").innerHTML =
        `<span class="${delta>0?'green':'red'}">${fmt(delta)}</span>`;

    // ===== SIGNAL ENGINE =====
    let score = 0;

    if(btcDir.d==="UP") score+=2;
    if(ethDir.d==="UP") score+=1;
    if(delta>0) score+=2;
    if(f<0) score+=1;
    if(btcDir.d==="DOWN") score-=2;
    if(delta<0) score-=2;
    if(f>0) score-=1;

    let signal="NEUTRAL";
    if(score>=4) signal="STRONG BUY";
    else if(score>=2) signal="BUY";
    else if(score<=-4) signal="STRONG SELL";
    else if(score<=-2) signal="SELL";

    let color =
        signal.includes("BUY") ? "green" :
        signal.includes("SELL") ? "red" : "yellow";

    document.getElementById("signal").innerHTML =
        `<span class="${color}">${signal}</span>`;

    // ===== CONFIDENCE =====
    let conf = Math.min(100, Math.abs(score)*20);
    document.getElementById("confidence").innerText = conf + "%";

    // ===== STATE =====
    let state =
        btcDir.d==="SIDE" ? "RANGE" :
        btcDir.d==="UP" ? "TREND UP" :
        "TREND DOWN";

    document.getElementById("state").innerHTML =
        `<span class="${btcDir.c}">${state}</span>`;

    prev.btc = btcP;
    prev.eth = ethP;
}

// ===== CHARTS =====
new TradingView.widget({container_id:"chart_btc",symbol:"BINANCE:BTCUSDT",interval:"D",theme:"dark"});
new TradingView.widget({container_id:"chart_ethbtc",symbol:"BINANCE:ETHBTC",interval:"D",theme:"dark"});
new TradingView.widget({container_id:"chart_total",symbol:"CRYPTOCAP:TOTAL",interval:"D",theme:"dark"});
new TradingView.widget({container_id:"chart_usdt",symbol:"CRYPTOCAP:USDT.D",interval:"D",theme:"dark"});

// LOOP
update();
setInterval(update,3000);

</script>

</body>
</html>
