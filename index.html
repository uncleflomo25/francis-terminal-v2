<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Francis Terminal PRO V3</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script src="https://s3.tradingview.com/tv.js"></script>

<style>
body{
margin:0;
background:#050b18;
color:#fff;
font-family:Arial;
}

header{
padding:15px;
text-align:center;
font-size:22px;
background:#0d1428;
border-bottom:1px solid #1c2b4a;
}

.grid-4{
display:grid;
grid-template-columns:repeat(4,1fr);
gap:12px;
padding:12px;
}

.grid-2{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:12px;
padding:12px;
}

.panel{
background:#0b1220;
border:1px solid #1f2a44;
border-radius:14px;
padding:14px;
}

.title{
font-size:12px;
color:#8aa0c8;
margin-bottom:6px;
}

.big{
font-size:26px;
font-weight:700;
}

.green{color:#00ff9c;}
.red{color:#ff4d4d;}
.yellow{color:#ffd84d;}

.chart{
height:300px;
}
</style>
</head>

<body>

<header>Francis Terminal PRO V3</header>

<div class="grid-4">
<div class="panel"><div class="title">BTC.D</div><div id="btcd" class="big">--</div></div>
<div class="panel"><div class="title">USDT.D</div><div id="usdt" class="big">--</div></div>
<div class="panel"><div class="title">ETHBTC</div><div id="ethbtc" class="big">--</div></div>
<div class="panel"><div class="title">TOTAL</div><div id="total" class="big">--</div></div>
</div>

<div class="grid-2">
<div class="panel">
<div class="title">SPOT FLOW</div>
<div id="spotVol">Volume: --</div>
<div id="spotDelta">Delta: --</div>
</div>

<div class="panel">
<div class="title">PERP FLOW</div>
<div id="perpVol">Volume: --</div>
<div id="perpDelta">Delta: --</div>
<div id="oi">OI: --</div>
</div>
</div>

<div class="panel" style="margin:12px;">
<div class="title">SIGNAL</div>
<div id="signal" class="big yellow">LOADING...</div>
</div>

<div class="grid-2">
<div class="panel"><div id="btc" class="chart"></div></div>
<div class="panel"><div id="ethbtc_chart" class="chart"></div></div>
<div class="panel"><div id="btcd_chart" class="chart"></div></div>
<div class="panel"><div id="usdt_chart" class="chart"></div></div>
</div>

<script>

// charts
new TradingView.widget({container_id:"btc",symbol:"BINANCE:BTCUSDT",interval:"15",theme:"dark"});
new TradingView.widget({container_id:"ethbtc_chart",symbol:"BINANCE:ETHBTC",interval:"15",theme:"dark"});
new TradingView.widget({container_id:"btcd_chart",symbol:"CRYPTOCAP:BTC.D",interval:"15",theme:"dark"});
new TradingView.widget({container_id:"usdt_chart",symbol:"CRYPTOCAP:USDT.D",interval:"15",theme:"dark"});

// data
async function loadData(){

let spot = await fetch("https://api.binance.com/api/v3/ticker/24hr?symbol=BTCUSDT").then(r=>r.json());
let perp = await fetch("https://fapi.binance.com/fapi/v1/ticker/24hr?symbol=BTCUSDT").then(r=>r.json());
let oi = await fetch("https://fapi.binance.com/fapi/v1/openInterest?symbol=BTCUSDT").then(r=>r.json());

let ethbtc = await fetch("https://api.binance.com/api/v3/ticker/price?symbol=ETHBTC").then(r=>r.json());

// calc
let spotVol = spot.quoteVolume/1e9;
let perpVol = perp.quoteVolume/1e9;

let spotDelta = ((spot.takerBuyQuoteVolume/spot.quoteVolume)-0.5)*spot.quoteVolume/1e9;
let perpDelta = ((perp.takerBuyQuoteVolume/perp.quoteVolume)-0.5)*perp.quoteVolume/1e9;

let prevOI = localStorage.getItem("oi") || oi.openInterest;
let oiChange = oi.openInterest - prevOI;
localStorage.setItem("oi", oi.openInterest);

// UI
document.getElementById("spotVol").innerText="Volume: "+spotVol.toFixed(2)+"B";
document.getElementById("perpVol").innerText="Volume: "+perpVol.toFixed(2)+"B";
document.getElementById("spotDelta").innerText="Delta: "+spotDelta.toFixed(2)+"B";
document.getElementById("perpDelta").innerText="Delta: "+perpDelta.toFixed(2)+"B";
document.getElementById("oi").innerText="OI: "+(oi.openInterest/1000).toFixed(2)+"K";

document.getElementById("ethbtc").innerText=ethbtc.price;

// signal
let signal="NEUTRAL",color="yellow";

if(spotDelta>0 && perpDelta>0 && oiChange>0){signal="STRONG BUY";color="green";}
else if(spotDelta<0 && perpDelta<0 && oiChange<0){signal="STRONG SELL";color="red";}

let s=document.getElementById("signal");
s.innerText=signal;
s.className="big "+color;

// macro placeholders
document.getElementById("btcd").innerText="Live (chart)";
document.getElementById("usdt").innerText="Live (chart)";
document.getElementById("total").innerText="Live (chart)";
}

loadData();
setInterval(loadData,5000);

</script>

</body>
</html>
