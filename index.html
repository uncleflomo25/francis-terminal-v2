<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>⚡ V27 REAL DATA ENGINE</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
body{
    margin:0;
    background:#02050c;
    color:white;
    font-family:Arial;
}

.header{
    text-align:center;
    padding:12px;
    background:#06122b;
    font-weight:bold;
}

.grid{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:10px;
    padding:10px;
}

.box{
    background:#0a1326;
    border:1px solid #1c2b4a;
    border-radius:8px;
    padding:12px;
    text-align:center;
}

.big{font-size:20px;font-weight:bold;}

.green{color:#00ff9c;}
.red{color:#ff4d4d;}
.yellow{color:#ffd700;}

.arrow{font-size:26px;}

canvas{
    width:100% !important;
    height:400px !important;
}
</style>
</head>

<body>

<div class="header">⚡ V27 — REAL MARKET FLOW ENGINE</div>

<div class="grid">
<div class="box">BTC<br><span id="btc" class="big"></span></div>
<div class="box">ETHBTC<br><span id="ethbtc" class="big"></span></div>
<div class="box">BTC.D<br><span id="btcd" class="big"></span></div>
<div class="box">USDT.D<br><span id="usdt" class="big"></span></div>

<div class="box">TOTAL<br><span id="total"></span></div>
<div class="box">Signal<br><span id="signal"></span></div>
<div class="box">State<br><span id="state"></span></div>
<div class="box">Confidence<br><span id="conf"></span></div>
</div>

<canvas id="chart"></canvas>

<script>

//=====================
// HELPERS
//=====================
function dir(curr, prev){
    if(!prev) return {a:"↔️",c:"yellow",d:0};
    let ch = (curr-prev)/prev;
    if(ch>0.002) return {a:"⬆️",c:"green",d:1};
    if(ch<-0.002) return {a:"⬇️",c:"red",d:-1};
    return {a:"↔️",c:"yellow",d:0};
}

function fmt(v){
    if(v>1e12) return (v/1e12).toFixed(2)+"T";
    if(v>1e9) return (v/1e9).toFixed(2)+"B";
    return v.toFixed(2);
}

//=====================
// CHART
//=====================
let ctx = document.getElementById('chart').getContext('2d');

let chart = new Chart(ctx,{
    type:'line',
    data:{labels:[],datasets:[{data:[],borderWidth:3,tension:0.3}]},
    options:{
        plugins:{legend:{display:false}},
        scales:{x:{display:false},y:{grid:{color:"#111"}}}
    }
});

//=====================
// ENGINE
//=====================
let prev = {};
let compArr = [];

async function update(){

    //=====================
    // REAL DATA
    //=====================
    let btc = await fetch("https://api.binance.com/api/v3/ticker/price?symbol=BTCUSDT").then(r=>r.json());
    let eth = await fetch("https://api.binance.com/api/v3/ticker/price?symbol=ETHBTC").then(r=>r.json());

    let global = await fetch("https://api.coingecko.com/api/v3/global").then(r=>r.json());
    let tether = await fetch("https://api.coingecko.com/api/v3/coins/tether").then(r=>r.json());

    let btcP = parseFloat(btc.price);
    let ethP = parseFloat(eth.price);

    let total = global.data.total_market_cap.usd;
    let btc_d = global.data.market_cap_percentage.btc;

    let usdt_mcap = tether.market_data.market_cap.usd;
    let usdt_d = (usdt_mcap / total) * 100;

    //=====================
    // DIRECTION
    //=====================
    let dBTC = dir(btcP, prev.btc);
    let dETH = dir(ethP, prev.eth);
    let dBTCD = dir(btc_d, prev.btcd);
    let dUSDT = dir(usdt_d, prev.usdt);
    let dTOTAL = dir(total, prev.total);

    function set(id,val,d){
        document.getElementById(id).innerHTML =
        `<span class="${d.c}">${val} <span class="arrow">${d.a}</span></span>`;
    }

    set("btc", btcP.toFixed(0), dBTC);
    set("ethbtc", ethP.toFixed(5), dETH);
    set("btcd", btc_d.toFixed(2)+"%", dBTCD);
    set("usdt", usdt_d.toFixed(2)+"%", dUSDT);
    set("total", fmt(total), dTOTAL);

    //=====================
    // COMPOSITE ENGINE
    //=====================
    let comp =
        (dETH.d * 2) +
        (dTOTAL.d * 2) -
        (dBTCD.d * 1.5) -
        (dUSDT.d * 1.5);

    compArr.push(comp);
    if(compArr.length>150) compArr.shift();

    chart.data.labels.push("");
    chart.data.datasets[0].data = compArr;

    chart.data.datasets[0].borderColor =
        comp>0 ? "#00ff9c" : comp<0 ? "#ff4d4d" : "#ffd700";

    chart.update();

    //=====================
    // SIGNAL
    //=====================
    let signal="NEUTRAL";
    if(comp>=3) signal="STRONG BUY";
    else if(comp>=1) signal="BUY";
    else if(comp<=-3) signal="STRONG SELL";
    else if(comp<=-1) signal="SELL";

    let color =
        signal.includes("BUY") ? "green" :
        signal.includes("SELL") ? "red" : "yellow";

    document.getElementById("signal").innerHTML =
        `<span class="${color}">${signal}</span>`;

    document.getElementById("state").innerHTML =
        `<span class="${dBTC.c}">
        ${dBTC.d==1?"TREND UP":dBTC.d==-1?"TREND DOWN":"RANGE"}
        </span>`;

    document.getElementById("conf").innerText =
        Math.min(100, Math.abs(comp)*20)+"%";

    // SAVE
    prev.btc = btcP;
    prev.eth = ethP;
    prev.btcd = btc_d;
    prev.usdt = usdt_d;
    prev.total = total;
}

// LOOP
update();
setInterval(update,5000);

</script>

</body>
</html>
