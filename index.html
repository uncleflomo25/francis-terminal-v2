<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Advanced Trade Journal</title>

<style>
/* ===== YOUR FULL CSS (UNCHANGED) ===== */
body { margin:0; background:#0a0e27; color:#e2e8f0; font-family:Segoe UI; }
.container { max-width:1600px; margin:auto; padding:20px; }

header {
  background:linear-gradient(135deg,#1e293b,#0f172a);
  border-bottom:2px solid #3b82f6;
  padding:20px;
  margin-bottom:20px;
}

header h1 { color:#00ff88; margin:0; }
header p { color:#60a5fa; font-size:12px; }

.tab-btn { padding:10px; margin:5px; cursor:pointer; }
.tab-content { display:none; }
.tab-content.active { display:block; }

.card {
  background:#111827;
  padding:20px;
  margin:10px 0;
  border-radius:10px;
}

/* (keep your full CSS here exactly as you had it) */
</style>
</head>

<body>

<header class="container">
  <h1>📊 ADVANCED TRADE JOURNAL</h1>
  <p>Risk Calculator + Journal System</p>
</header>

<div class="container">

  <!-- TABS -->
  <button class="tab-btn" onclick="switchTab('calculator')">Calculator</button>
  <button class="tab-btn" onclick="switchTab('journal')">Journal</button>
  <button class="tab-btn" onclick="switchTab('stats')">Stats</button>

  <!-- CALCULATOR -->
  <div id="calculator" class="tab-content active">
    <div class="card">
      <h2>Trade Calculator</h2>

      <input id="accountBalance" placeholder="Account Balance" oninput="calculate()" />
      <input id="riskAmount" placeholder="Risk Amount" oninput="calculate()" />
      <input id="entryPrice" placeholder="Entry Price" oninput="calculate()" />
      <input id="slPrice" placeholder="Stop Loss" oninput="calculate()" />
      <input id="tpPrice" placeholder="Take Profit" oninput="calculate()" />

      <button onclick="saveTrade()">Save Trade</button>

      <div id="output"></div>
    </div>
  </div>

  <!-- JOURNAL -->
  <div id="journal" class="tab-content">
    <div class="card">
      <h2>Journal</h2>
      <div id="journalList"></div>
    </div>
  </div>

  <!-- STATS -->
  <div id="stats" class="tab-content">
    <div class="card">
      <h2>Stats</h2>
      <div id="statsBox"></div>
    </div>
  </div>

</div>

<script>
let trades = [];

// TAB SWITCH
function switchTab(tab) {
  document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
  document.getElementById(tab).classList.add('active');
}

// CALCULATION
function calculate() {
  const balance = +document.getElementById("accountBalance").value || 0;
  const risk = +document.getElementById("riskAmount").value || 0;
  const entry = +document.getElementById("entryPrice").value || 0;
  const sl = +document.getElementById("slPrice").value || 0;
  const tp = +document.getElementById("tpPrice").value || 0;

  if (!balance || !risk || !entry || !sl) return;

  const pip = 0.0001;
  const slPips = Math.abs(entry - sl) / pip;

  const lot = risk / (slPips * 10);

  document.getElementById("output").innerHTML = `
    <p>SL Pips: ${slPips.toFixed(1)}</p>
    <p>Lot Size: ${lot.toFixed(2)}</p>
  `;
}

// SAVE TRADE
function saveTrade() {
  const trade = {
    balance: +document.getElementById("accountBalance").value,
    risk: +document.getElementById("riskAmount").value,
    entry: +document.getElementById("entryPrice").value,
    sl: +document.getElementById("slPrice").value,
    tp: +document.getElementById("tpPrice").value,
    time: new Date().toLocaleString()
  };

  trades.push(trade);
  updateJournal();
  updateStats();
}

// JOURNAL
function updateJournal() {
  document.getElementById("journalList").innerHTML =
    trades.map(t => `
      <div class="card">
        <p>Entry: ${t.entry} | SL: ${t.sl} | TP: ${t.tp}</p>
        <small>${t.time}</small>
      </div>
    `).join("");
}

// STATS
function updateStats() {
  document.getElementById("statsBox").innerHTML = `
    <p>Total Trades: ${trades.length}</p>
  `;
}
</script>

</body>
</html>
