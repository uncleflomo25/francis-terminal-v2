<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>⚡ FRANCIS TERMINAL ELITE V2.5</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script src="https://s3.tradingview.com/tv.js"></script>

<style>
body{
    margin:0;
    background:#02040a;
    color:#fff;
    font-family:Arial;
}

header{
    padding:14px;
    text-align:center;
    font-size:20px;
    background:#050816;
    border-bottom:1px solid #1a2a5a;
}

.top{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:10px;
    padding:10px;
}

.box{
    background:#050816;
    border:1px solid #1a2a5a;
    border-radius:10px;
    padding:12px;
    text-align:center;
}

.value{font-size:16px;margin-top:5px;}

.green{color:#00ffa6;}
.red{color:#ff4d4d;}
.yellow{color:#ffd000;}

.grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:10px;
    padding:10px;
}

.card{
    background:#050816;
    border:1px solid #1a2a5a;
    border-radius:10px;
}

.panel{
    position:fixed;
    right:10px;
    top:60px;
    width:240px;
    background:#050816;
    border:1px solid #1a2a5a;
    border-radius:10px;
    padding:12px;
    font-size:13px;
}
</style>
</head>

<body>

<header>⚡ FRANCIS TERMINAL ELITE V2.5</header>

<div class="top">
    <div class="box">USDT.D<div id="usdt" class="value"></div></div>
    <div class="box">ETHBTC<div id="ethbtc" class="value"></div></div>
    <div class="box">BTC.D<div id="btc" class="value"></div></div>
    <div class="box">TOTAL<div id="total" class="value"></div></div>
</div>

<div class="grid">
    <div class="card"><div id="c1"></div></div>
    <div class="card"><div id="c2"></div></div>
    <div class="card"><div id="c3"></div></div>
    <div class="card"><div id="c4"></div></div>
</div>

<div class="panel">
<b>⚡ ELITE FLOW</b><br><br>

USDT.D: <span id="p1"></span><br>
ETHBTC: <span id="p2"></span><br>
BTC.D: <span id="p3"></span><br>
TOTAL: <span id="p4"></span><br><br>

<b>SIGNAL</b><br>
<span id="signal"></span>
</div>

<script>

// STORE PREVIOUS VALUES
let prev = {
    btc:null,
    ethbtc:null,
    usdt:null,
    total:null
};

// SMART ARROW
function arrow(change){
    if(change > 0.5) return '<span class="green">🟢 ▲ STRONG</span>';
    if(change > 0.15) return '<span class="green">▲</span>';

    if(change < -0.5) return '<span class="red">🔴 ▼ STRONG</span>';
    if(change < -0.15) return '<span class="red">▼</span>';

    return '<span class="yellow">→</span>';
}

// LOAD DATA
async function load(){

    let btc = await fetch("https://api.binance.com/api/v3/ticker/price?symbol=BTCUSDT").then(r=>r.json());
    let ethbtc = await fetch("https://api.binance.com/api/v3/ticker/price?symbol=ETHBTC").then(r=>r.json());

    let btcVal = parseFloat(btc.price);
    let ethbtcVal = parseFloat(ethbtc.price);

    // SIMULATED DOMINANCE (temporary until API upgrade)
    let usdtVal = 7 + Math.random();
    let totalVal = 2.5 + Math.random();

    // CALCULATE CHANGE
    let btcCh = prev.btc ? ((btcVal-prev.btc)/prev.btc)*100 : 0;
    let ethCh = prev.ethbtc ? ((ethbtcVal-prev.ethbtc)/prev.ethbtc)*100 : 0;
    let usdtCh = prev.usdt ? ((usdtVal-prev.usdt)/prev.usdt)*100 : 0;
    let totalCh = prev.total ? ((totalVal-prev.total)/prev.total)*100 : 0;

    // DISPLAY
    document.getElementById("btc").innerHTML = arrow(btcCh);
    document.getElementById("ethbtc").innerHTML = arrow(ethCh);
    document.getElementById("usdt").innerHTML = arrow(usdtCh);
    document.getElementById("total").innerHTML = arrow(totalCh);

    document.getElementById("p3").innerHTML = arrow(btcCh);
    document.getElementById("p2").innerHTML = arrow(ethCh);
    document.getElementById("p1").innerHTML = arrow(usdtCh);
    document.getElementById("p4").innerHTML = arrow(totalCh);

    // LOGIC FLAGS
    let btcUp = btcCh > 0.2;
    let btcDown = btcCh < -0.2;

    let ethUp = ethCh > 0.2;
    let ethDown = ethCh < -0.2;

    let usdtUp = usdtCh > 0.2;
    let totalUp = totalCh > 0.2;

    // ELITE SIGNAL ENGINE
    let signal;

    if(ethUp && totalUp && btcDown){
        signal = '<span class="green">ALT SEASON 🚀</span>';
    }
    else if(btcUp && ethDown){
        signal = '<span class="yellow">BTC SEASON 🟡</span>';
    }
    else if(usdtUp){
        signal = '<span class="red">RISK OFF 🔴</span>';
    }
    else{
        signal = '<span class="yellow">CHOP ⚖️</span>';
    }

    document.getElementById("signal").innerHTML = signal;

    // SAVE
    prev.btc = btcVal;
    prev.ethbtc = ethbtcVal;
    prev.usdt = usdtVal;
    prev.total = totalVal;
}

// RUN
load();
setInterval(load,5000);

// CHARTS
new TradingView.widget({container_id:"c1",symbol:"CRYPTOCAP:USDT.D",interval:"15",theme:"dark"});
new TradingView.widget({container_id:"c2",symbol:"BINANCE:ETHBTC",interval:"15",theme:"dark"});
new TradingView.widget({container_id:"c3",symbol:"CRYPTOCAP:BTC.D",interval:"15",theme:"dark"});
new TradingView.widget({container_id:"c4",symbol:"CRYPTOCAP:TOTAL",interval:"15",theme:"dark"});

</script>

</body>
</html>
