<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Composite Footprint Terminal FINAL</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Inter,Arial,sans-serif;background:#030712;color:#e5e7eb}header{height:56px;display:flex;justify-content:space-between;align-items:center;padding:0 16px;border-bottom:1px solid #1f2937;background:#020617}.brand{font-weight:800}.sub{font-size:12px;color:#94a3b8}.wrap{display:grid;grid-template-columns:260px 1fr 320px;gap:12px;padding:12px;height:calc(100vh - 56px)}.panel{background:#07101d;border:1px solid #1e293b;border-radius:18px;padding:12px;box-shadow:0 10px 30px rgba(0,0,0,.35)}.title{font-size:13px;font-weight:700;margin-bottom:10px}.controls label{font-size:12px;display:block;margin:8px 0 4px}.controls select,.controls input{width:100%;padding:8px;border-radius:10px;background:#0f172a;color:#fff;border:1px solid #334155}.main{display:grid;grid-template-rows:220px 1fr 120px;gap:12px}.chart{position:relative;overflow:hidden}.bar{position:absolute;bottom:0;width:8px;border-radius:4px 4px 0 0}.table{width:100%;border-collapse:collapse;font-size:12px}.table th,.table td{padding:5px;border-bottom:1px solid #132033;text-align:right}.table th:first-child,.table td:first-child{text-align:left}.buy{color:#22c55e}.sell{color:#ef4444}.heat{display:grid;grid-template-columns:repeat(40,1fr);gap:2px;height:100%}.heat div{border-radius:3px}.side .gauge{width:180px;height:180px;border-radius:50%;margin:10px auto;background:conic-gradient(#22c55e 0 220deg,#eab308 220deg 280deg,#ef4444 280deg 360deg);display:flex;align-items:center;justify-content:center}.inner{width:118px;height:118px;border-radius:50%;background:#07101d;display:flex;align-items:center;justify-content:center;font-size:28px;font-weight:800}.metric{text-align:center;font-size:34px;font-weight:800;margin:12px 0}.signal{text-align:center;font-size:13px;color:#94a3b8}.stack{display:grid;gap:8px}.row{height:14px;background:#0f172a;border-radius:7px;overflow:hidden}.fill{height:100%}.small{font-size:12px;color:#94a3b8}.footer{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}@media(max-width:1200px){.wrap{grid-template-columns:1fr}.side{order:3}.controls{order:2}}
</style>
</head>
<body>
<header><div><div class='brand'>COMPOSITE FOOTPRINT TERMINAL FINAL</div><div class='sub'>BTC • ETHBTC • BTC.D • USDT.D</div></div><div id='clock'></div></header>
<div class='wrap'>
<div class='panel controls'>
<div class='title'>Controls</div>
<label>Timeframe</label><select><option>1m</option><option>5m</option><option>15m</option><option>1H</option><option>4H</option></select>
<label>Refresh</label><select><option>1s</option><option>3s</option></select>
<label>BTC Weight</label><input type='range' min='0' max='100' value='40'>
<label>ETHBTC Weight</label><input type='range' min='0' max='100' value='25'>
<label>BTC.D Weight</label><input type='range' min='0' max='100' value='20'>
<label>USDT.D Weight</label><input type='range' min='0' max='100' value='15'>
<label>Theme</label><select><option>Dark</option><option>Terminal</option></select>
</div>
<div class='main'>
<div class='panel chart'><div class='title'>BTC Live Structure</div><div id='chart'></div></div>
<div class='panel'><div class='title'>Footprint Matrix</div><table class='table' id='tbl'></table></div>
<div class='panel'><div class='title'>Composite Heatmap</div><div class='heat' id='heat'></div></div>
</div>
<div class='panel side'>
<div class='title'>Composite Summary</div>
<div class='gauge'><div class='inner' id='gauge'>0</div></div>
<div class='metric' id='net'>0</div>
<div class='signal' id='sig'>NEUTRAL</div>
<div class='title' style='margin-top:14px'>Delta Pressure</div>
<div class='stack' id='stack'></div>
<div class='title' style='margin-top:14px'>Institutional Read</div>
<div class='small' id='intel'>Loading...</div>
</div>
</div>
<script>
function rnd(a,b){return Math.floor(Math.random()*(b-a+1))+a}
function render(){document.getElementById('clock').textContent=new Date().toLocaleTimeString();let c='';for(let i=0;i<90;i++){let h=rnd(20,180),x=i*9;c+=`<div class='bar' style='left:${x}px;height:${h}px;background:${i%6==0?'#22c55e':'#38bdf8'}'></div>`}document.getElementById('chart').innerHTML=c;let t='<tr><th>Price</th><th>Buy</th><th>Sell</th><th>Delta</th></tr>';let net=0;for(let i=0;i<12;i++){let p=69000-i*25,b=rnd(300,3900),s=rnd(300,3900),d=b-s;net+=d;t+=`<tr><td>${p}</td><td class='buy'>${b}</td><td class='sell'>${s}</td><td class='${d>=0?'buy':'sell'}'>${d}</td></tr>`}document.getElementById('tbl').innerHTML=t;document.getElementById('gauge').textContent=net;document.getElementById('net').textContent=(net>0?'+':'')+net;document.getElementById('net').style.color=net>=0?'#22c55e':'#ef4444';document.getElementById('sig').textContent=net>1500?'STRONG BUY':net<-1500?'STRONG SELL':'MIXED';let st='';for(let i=0;i<10;i++){let v=rnd(-100,100);st+=`<div class='row'><div class='fill' style='width:${Math.abs(v)}%;background:${v>=0?'#22c55e':'#ef4444'}'></div></div>`}document.getElementById('stack').innerHTML=st;let h='';for(let i=0;i<40;i++){let v=rnd(-10,10);h+=`<div style='background:${v>0?'#16a34a':v<0?'#b91c1c':'#a16207'}'></div>`}document.getElementById('heat').innerHTML=h;document.getElementById('intel').textContent=net>2500?'Whale accumulation detected':net<-2500?'Distribution pressure detected':'Balanced auction / absorption';}
render();setInterval(render,2000);
</script>
</body></html>
